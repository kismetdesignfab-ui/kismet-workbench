// Compares what's on screen against what's actually saved on the listing.
// Only a real difference counts — prompting on every close when nothing
// changed would train you to dismiss the warning without reading it.
function drawerHasUnsavedChanges(l){
  if(!l) return false;
  const titleEl = document.getElementById('edProposedTitle');
  const descEl = document.getElementById('edDescription');
  if(!titleEl && !descEl) return false;   // drawer isn't showing an editable listing
  if(titleEl && titleEl.value !== (l.proposedTitle||'')) return true;
  if(descEl && descEl.value !== (l.description||'')) return true;
  try{
    const uiTags = currentTagsFromUI();
    const saved = l.tags||[];
    if(uiTags.length !== saved.length) return true;
    if(uiTags.some((t,i)=>t !== saved[i])) return true;
  }catch(e){ /* tag editor not present */ }
  return false;
}

async function closeDrawerChecked(l){
  if(!drawerHasUnsavedChanges(l)){ closeDrawer(); return; }
  // Three real options, not a yes/no that loses work either way.
  const save = confirm(
    'You have unsaved changes on this listing.\n\n' +
    'OK = save them as a draft and close\n' +
    'Cancel = keep editing (nothing is lost)'
  );
  if(!save) return;   // stay in the drawer
  const titleEl = document.getElementById('edProposedTitle');
  const descEl = document.getElementById('edDescription');
  if(titleEl) l.proposedTitle = titleEl.value;
  if(descEl) l.description = descEl.value;
  try{ l.tags = currentTagsFromUI(); }catch(e){}
  const ok = await persistWorkbook();
  if(!ok){
    alert('Save failed — your changes are still on screen. Nothing was closed or lost.');
    return;
  }
  updateMiniGauge(); renderNav();
  closeDrawer();
}

          ${l.imageUrls.slice(0,5).map((u,i)=>`<img src="${escapeHtml(u)}" alt="listing photo ${i+1}" style="width:88px; height:88px; object-fit:cover; border-radius:var(--r-md); border:1px solid var(--line);"/>`).join('')}
        </div>
        <div class="section-note" style="margin:0 0 8px 0;">The drafting AI can't see these. Checking the photo gives it a factual description of what's actually in the artwork instead of guessing from the old title.</div>
        <button class="copy-btn" id="checkPhotoBtn">\u2726 Check photo &amp; describe artwork</button>
        <div id="photoCheckResult" style="margin-top:8px;">${l.artworkDescription ? renderArtworkDescription(l.artworkDescription) : ''}</div>

    </div>

    <div class="ws-block">
      <div class="ws-lbl"><span>Verified facts \u2014 what AI generation is allowed to trust</span></div>
      <div class="section-note" style="margin:0 0 8px 0;">Never inferred from the old title or tags \u2014 only what's checked here. Saved on this listing, so you only set it once.</div>
      <div class="row2" style="margin-bottom:8px;">
        <div class="field" style="margin-bottom:0;"><label>Product type</label>
          <select id="edProductType"><option value="digital" ${l.productType==='digital'?'selected':''}>Digital</option><option value="physical" ${l.productType==='physical'?'selected':''}>Physical</option></select></div>
        <div class="field" style="margin-bottom:0;"><label>Personalization available?</label>
          <select id="edVfPersonalization"><option value="" ${!l.verifiedFacts.personalization?'selected':''}>\u2014 not specified \u2014</option><option value="Yes" ${l.verifiedFacts.personalization==='Yes'?'selected':''}>Yes</option><option value="No" ${l.verifiedFacts.personalization==='No'?'selected':''}>No</option></select></div>
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Included formats</label>
        <div style="display:flex; gap:12px; flex-wrap:wrap; padding:6px 0;">
          ${(WB.meta.availableFormats||DEFAULT_AVAILABLE_FORMATS).map(f=>`<label style="display:flex; align-items:center; gap:5px; font-size:12.5px; cursor:pointer;"><input type="checkbox" class="ed-vf-format" value="${escapeHtml(f)}" ${(l.verifiedFacts.formats||[]).includes(f)?'checked':''}/> ${escapeHtml(f)}</label>`).join('')}
        </div></div>
      <div class="row2">
        <div class="field" style="margin-bottom:0;"><label>Dimensions</label><input type="text" id="edVfDimensions" value="${escapeHtml(l.verifiedFacts.dimensions||'')}" placeholder="e.g. 12in x 8in"/></div>
        <div class="field" style="margin-bottom:0;"><label>Kerf</label><input type="text" id="edVfKerf" value="${escapeHtml(l.verifiedFacts.kerf||'')}" placeholder="e.g. .051 in"/></div>
      </div>
      <button class="copy-btn" id="saveVerifiedFactsBtn" style="margin-top:8px;">Save verified facts</button>
      <span class="result-flash" id="vfSaveFlash"></span>
    </div>

    <div class="ws-block">
      <div class="ws-lbl"><span>Proposed title</span>${copyBtn('title')}<button class="copy-btn" data-aigen="title" style="margin-left:8px;">\u2726 Generate with AI</button></div>
      ${liveNowCompare(l.oldTitle)}
      <textarea id="edProposedTitle" placeholder="New title to paste into Etsy…" style="min-height:44px;">${escapeHtml(l.proposedTitle)}</textarea>
      <div id="aiGenResult_title"></div>
    </div>

    <div class="ws-block">
      <div class="ws-lbl"><span>Description</span>${copyBtn('desc')}<button class="copy-btn" data-aigen="description" style="margin-left:8px;">\u2726 Generate with AI</button></div>
      ${liveNowCompare(l.oldDescription, 120)}
      <textarea id="edDescription" placeholder="Full listing description…">${escapeHtml(l.description)}</textarea>
      <div id="aiGenResult_description"></div>
    </div>

    <div class="ws-block">
      <div class="ws-lbl"><span>Tags (${l.tags.length}/13)</span>${copyBtn('tags')}<button class="copy-btn" data-aigen="tags" style="margin-left:8px;">\u2726 Generate with AI</button></div>
      ${liveNowCompare((l.oldTags||[]).join(', '))}
      <div id="tagsEditArea"></div>
      <button class="btn" id="addTagBtn" style="margin-top:6px;">+ Add tag</button>
      <div class="tags-summary" id="tagsSummary"></div>
      <div id="aiGenResult_tags"></div>
    </div>

    ${(()=>{
      const proj = WB.projects.find(p=>!p.archived && p.skus.includes(l.sku));
      if(!proj){
        // Single-listing work shouldn't require building a project first.
        // Scope is still mandatory — it's what stops an unintended field
        // being written — so it's chosen here instead of inherited.
        return `<div class="ws-block">
          <div class="ws-lbl"><span>Push this listing to Etsy</span></div>
          <div class="section-note" style="margin:0 0 10px 0;">Not in a project, so pick what this push is allowed to change. Never writable either way: SKU, price, quantity, listing status, shipping, or files.</div>
          <div class="field" style="margin-bottom:8px;"><label>What may this push change?</label>
            <select id="singlePushScope">
              ${Object.entries(PROJECT_SCOPES).filter(([k])=>k!=='shopSection').map(([k,v])=>`<option value="${k}">${escapeHtml(v.label)}</option>`).join('')}
            </select></div>
          <div class="field" style="margin-bottom:8px;"><label>Type your confirmation word to push</label>
            <input type="password" id="singlePushConfirm" placeholder="confirmation word" autocomplete="off"/></div>
          <button class="btn primary" id="singlePushBtn">Push this listing to Etsy</button>
          <div id="singlePushResult"></div>
        </div>`;
      }
      const diff = buildEtsyDiff(l, proj);
      const blockers = etsyPushBlockers(l, proj);
      return `<div class="ws-block">
        <div class="ws-lbl"><span>Push to Etsy \u2014 via "${escapeHtml(proj.name)}" (${escapeHtml(PROJECT_SCOPES[proj.scope].label)})</span></div>
        ${blockers.length ? `<div class="section-note" style="color:var(--amber);">${blockers.map(escapeHtml).join(' \u00b7 ')}</div>`
          : diff.length ? `<div class="section-note">${diff.map(d=>`<b style="color:var(--ink)">${escapeHtml(d.label)}</b> will change`).join(', ')}.</div>` : `<div class="section-note">Nothing to push within this project's scope right now.</div>`}
        ${(!blockers.length && diff.length) ? `
        <div class="field" style="margin-top:8px;"><label>Type your confirmation word to push</label>
          <input type="password" id="drawerPushConfirm" placeholder="confirmation word" autocomplete="off"/></div>
        <button class="btn primary" id="drawerPushBtn">Push this listing to Etsy</button>
        <div id="drawerPushResult"></div>` : ''}
      </div>`;
    })()}

    ${(()=>{ const matches = findKeywordMatches(l); if(!matches.length) return ''; return `
    <div class="ws-block">
      <div class="ws-lbl"><span>Past keyword research for this listing</span></div>
      ${matches.map(m=>`<div class="section-note" style="margin:4px 0;">
        ${m.linkedSku===l.sku ? '<span class="badge updated" style="margin-right:6px;">LINKED</span>' : ''}<b style="color:var(--ink)">${escapeHtml(m.keyword)}</b> — ${m.searches??'?'} searches, ${m.searchResults??'?'} results, ${escapeHtml(m.conversion||'?')} conversion ${m.dateResearched?('· logged '+m.dateResearched):''}
      </div>`).join('')}
    </div>`; })()}

    ${(()=>{
      const already = new Set(WB.keywordResearch.filter(k=>k.linkedSku===l.sku).map(k=>k.keyword.toLowerCase()));
      const queued = new Set(WB.keywordQueue.filter(q=>q.addedFrom===l.sku).map(q=>q.keyword.toLowerCase()));
      const candidates = extractKeywordCandidates(l).filter(c=>!already.has(c.toLowerCase()) && !queued.has(c.toLowerCase()));
      if(!candidates.length) return '';
      return `
    <div class="ws-block">
      <div class="ws-lbl"><span>Suggested keywords to research (pulled from the title)</span></div>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${candidates.map(c=>`<button class="copy-btn" data-add-kw="${escapeHtml(c)}" style="font-weight:600;">+ ${escapeHtml(c)}</button>`).join('')}
      </div>
      <div class="section-note" style="margin:8px 0 0 0;">Click one to add it to the research queue, linked to this listing. Then look it up in Marketplace Insights and log the numbers.</div>
    </div>`; })()}

    <div class="row2">
      <div class="field"><label>Live date</label>
        <input type="date" id="edLiveDate" value="${l.liveDate && /^\d{4}-\d{2}-\d{2}/.test(l.liveDate) ? l.liveDate.slice(0,10) : ''}"/>
      </div>
      ${WB.meta.infographicEnabled !== false ? `
      <div class="field"><label>${escapeHtml(WB.meta.infographicLabel||'Infographic')} decision</label>
        <select id="edInfographic">
          <option value="" ${!l.infographic?'selected':''}>— not decided —</option>
          <option value="NEEDED" ${l.infographic==='NEEDED'?'selected':''}>NEEDED (not done yet)</option>
          <option value="DONE" ${l.infographic==='DONE'?'selected':''}>DONE</option>
          <option value="NOT NEEDED" ${l.infographic==='NOT NEEDED'?'selected':''}>NOT NEEDED</option>
        </select>
        ${l.infographicCheckNote ? `<div class="section-note" style="margin:6px 0 0 0;">${escapeHtml(l.infographicCheckNote)}</div>` : ''}
      </div>` : ''}
    </div>


    <div class="field"><label>Performance / notes</label>
      <textarea id="edNotes" placeholder="Research notes, results…">${escapeHtml(l.notes||'')}</textarea>
    </div>

    ${(()=>{
      const platform = WB.meta.socialPlatform || 'Facebook';
      if(platform==='None') return '';
      const label = platform==='Other' ? (WB.meta.socialPlatformOther || 'Social') : platform;
      const LU = label.toUpperCase();
      return `
    <div class="section-title" style="margin-top:22px;"><span class="left">${escapeHtml(label)}</span></div>
    <div class="fb-states" id="fbStates">
      <button class="fb-btn ${l.fbStatus==='NOT_POSTED'?'active':''}" data-fb="NOT_POSTED">${LU} NOT POSTED</button>
      <button class="fb-btn ${l.fbStatus==='OPEN'?'active':''}" data-fb="OPEN">OPEN ${LU} POST</button>
      <button class="fb-btn ${l.fbStatus==='PUBLISHED'?'active':''}" data-fb="PUBLISHED">MARK ${LU} PUBLISHED</button>
    </div>
    <div id="fbPublishForm"></div>
    ${l.fbStatus==='PUBLISHED' ? `<div class="section-note" style="margin-top:8px;">Published ${l.fbDate?('on '+l.fbDate):'— no date on record'}${l.fbLink?(' · <a href="'+escapeHtml(l.fbLink)+'" target="_blank" style="color:var(--steel)">link</a>'):''}</div>` : ''}`;
    })()}

    <div class="section-title" style="margin-top:24px;"><span class="left">Push to Etsy</span></div>
    ${(()=>{
      const vf = l.batchVerified ? [] : visibleFlags(l);
      if(!vf.length) return '';
      return `<div class="ws-block" style="border-left:4px solid var(--amber);">
      <div class="ws-lbl"><span>Verification checks from the prepared batch</span></div>
      ${vf.map(f=>{
        const type = flagType(f);
        return `<div style="display:flex; align-items:flex-start; gap:10px; margin:8px 0; padding-bottom:8px; border-bottom:1px solid var(--line-soft);">
          <div style="flex:1; font-size:13px; color:var(--ink);">${escapeHtml(f)}</div>
          <button class="copy-btn" data-cleartype="${escapeHtml(type)}" style="flex-shrink:0;">Clear</button>
        </div>`;
      }).join('')}
      <div class="section-note" style="margin:10px 0 0 0;">Clearing a check asks whether to stop showing that TYPE of check everywhere \u2014 not just on this listing.</div>
    </div>`;
    })()}
    ${(()=>{
      const proj = listingProject(l);
      const blockers = etsyPushBlockers(l, proj);
      const diff = buildEtsyDiff(l, proj);
      const inProjects = projectsFor(l.sku);
      let head = '';
      if(inProjects.length){
        head = `<div class="section-note" style="margin-bottom:10px;">In ${inProjects.length>1?'projects':'project'}: ${inProjects.map(p=>`<span class="badge ${p.id===(proj&&proj.id)?'updated2':'notreviewed'}" style="margin-right:5px;">${escapeHtml(p.name)} · ${escapeHtml(PROJECT_SCOPES[p.scope].label)}</span>`).join('')}</div>`;
      }
      if(blockers.length){
        return head + `<div class="section-note">Can't push yet: ${escapeHtml(blockers[0])}</div>`;
      }
      return head + `<div class="banner warn" style="margin-bottom:12px;"><span class="mono">i</span><span class="fill">Scope: <b>${escapeHtml(PROJECT_SCOPES[proj.scope].label)}</b>. Only the field(s) below will be written. Never written: SKU, price, quantity, listing status, shipping, files.</span></div>
      <div class="ws-block">
        ${diff.map(c=>`<div style="margin-bottom:10px;">
          <div class="ws-lbl"><span>${escapeHtml(c.label)}</span></div>
          <div class="section-note" style="margin:0 0 3px 0;">from: ${escapeHtml(String(c.from).slice(0,120))}${String(c.from).length>120?'…':''}</div>
          <div class="ws-text" style="font-size:12.5px;">to: ${escapeHtml(String(c.to).slice(0,300))}${String(c.to).length>300?'…':''}</div>
        </div>`).join('')}
      </div>
      <div class="section-note" style="margin-bottom:10px;">A restore point is saved automatically before anything is written.</div>
      <button class="btn primary" id="pushEtsyBtn" style="width:100%;">Push to Etsy — ${escapeHtml(PROJECT_SCOPES[proj.scope].label.toLowerCase())}</button>`;
    })()}
    <div class="result-flash" id="pushFlash"></div>

    ${(()=>{
      const snaps = snapshotsFor(l.sku);
      if(!snaps.length) return '';
      return `<div class="section-title" style="margin-top:24px;"><span class="left">Restore points</span></div>
      <div class="section-note">Saved automatically before each push. Restoring writes the old title, tags and description back to Etsy.</div>
      ${snaps.slice(0,5).map((s,i)=>`
        <div class="draft-card">
          <div style="flex:1; min-width:0;">
            <div class="section-note" style="margin:0 0 3px 0;">${s.takenAt.slice(0,10)} at ${s.takenAt.slice(11,16)}</div>
            <div style="font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(s.title||'(no title)')}</div>
          </div>
          <button class="btn" data-restore="${i}">Restore this</button>
        </div>`).join('')}`;
    })()}

    ${(()=>{
      const hist = viewHistoryFor(l.sku);
      if(hist.length < 1) return '';
      // Show day-over-day deltas, plus a marker on any day this listing was
      // pushed — that's the whole point: seeing before/after around a change.
      const pushDates = new Set((WB.pushLog||[]).filter(p=>p.sku===l.sku).map(p=>p.pushedAt.slice(0,10)));
      const rows = hist.map((h,i)=>{
        const prev = i>0 ? hist[i-1] : null;
        const dv = (prev && h.views!=null && prev.views!=null) ? h.views - prev.views : null;
        const df = (prev && h.favorites!=null && prev.favorites!=null) ? h.favorites - prev.favorites : null;
        return { ...h, dv, df, pushed: pushDates.has(h.date) };
      }).slice(-14).reverse();
      return `<div class="section-title" style="margin-top:24px;"><span class="left">Views &amp; favorites history</span></div>
      <div class="section-note">${hist.length===1
        ? 'One snapshot so far — day-over-day numbers appear once there are at least two.'
        : `Last ${Math.min(hist.length,14)} snapshots. The + column is that day's real change.`}</div>
      <div class="grid grid-2" style="gap:16px; margin-bottom:14px;">
        <div class="card" style="padding:12px 14px;"><div class="k">Views</div>${trendChartHtml('drawerViewsChart_'+l.sku, hist.map(h=>({x:h.date, y:h.views})))}</div>
        <div class="card" style="padding:12px 14px;"><div class="k">Favorites</div>${trendChartHtml('drawerFavChart_'+l.sku, hist.map(h=>({x:h.date, y:h.favorites})))}</div>
      </div>
      <div class="card-scroll" style="max-height:260px;"><table class="simple-table">
        <thead><tr><th>Date</th><th>Views</th><th>+</th><th>Favorites</th><th>+</th></tr></thead>
        <tbody>${rows.map(r=>`<tr${r.pushed?' style="background:var(--torch-soft);"':''}>
          <td class="small">${r.date}${r.pushed?' <span class="badge updated2">PUSHED</span>':''}</td>
          <td class="small">${r.views ?? ''}</td>
          <td class="small"${r.dv>0?' style="color:var(--green); font-weight:700;"':''}>${r.dv==null?'':(r.dv>0?'+':'')+r.dv}</td>
          <td class="small">${r.favorites ?? ''}</td>
          <td class="small"${r.df>0?' style="color:var(--green); font-weight:700;"':''}>${r.df==null?'':(r.df>0?'+':'')+r.df}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    })()}

    <div class="section-title" style="margin-top:24px;"><span class="left">Completion gates</span></div>
    <div class="gate-list" id="gateList"></div>

    <div class="save-bar">
      <button class="btn" id="saveDraftBtn">Save without completing</button>
      <button class="btn primary" id="markCompleteBtn" ${allPass && !l.isDraft ? '' : 'disabled'}>MARK COMPLETE</button>
    </div>
    ${(!allPass && !l.isDraft) ? `
    <div class="section-note" style="margin-top:6px;">Reviewed this yourself and don't need every gate checked? You can mark it complete anyway \u2014 this is a manual override, not a push, and it's recorded as one.</div>
    <button class="copy-btn" id="forceCompleteBtn" style="margin-top:6px;">Mark complete anyway (manual override)</button>
    ` : ''}
    <div class="result-flash" id="resultFlash"></div>
  `;

  renderTagsEditor(l);
  renderGateList(l);
  const drawerHist = viewHistoryFor(l.sku);
  mountTrendChart('drawerViewsChart_'+l.sku, drawerHist.map(h=>({x:h.date, y:h.views})), { valueFormat: v=>Math.round(v).toLocaleString() });
  mountTrendChart('drawerFavChart_'+l.sku, drawerHist.map(h=>({x:h.date, y:h.favorites})), { valueFormat: v=>Math.round(v).toLocaleString() });

  document.getElementById('closeDrawer').addEventListener('click', ()=> closeDrawerChecked(l));
  // Track which listing the drawer is showing, so clicking the backdrop
  // can run the same unsaved-changes check.
  window.__openDrawerListing = l;

  wireCopyButtons(drawer, {
    title: ()=> document.getElementById('edProposedTitle').value,
    desc: ()=> document.getElementById('edDescription').value,
    tags: ()=> currentTagsFromUI().join(', '),
    sku: ()=> l.sku,
  });

  document.getElementById('edProposedTitle').addEventListener('input', ()=>{ l.proposedTitle = document.getElementById('edProposedTitle').value; refreshGates(l); });
  document.getElementById('edDescription').addEventListener('input', ()=>{ l.description = document.getElementById('edDescription').value; refreshGates(l); });
  document.getElementById('edLiveDate').addEventListener('input', ()=>{ l.liveDate = document.getElementById('edLiveDate').value || null; refreshGates(l); });
  const edInfographic = document.getElementById('edInfographic');
  if(edInfographic) edInfographic.addEventListener('change', ()=>{ l.infographic = edInfographic.value || null; refreshGates(l); });
  document.getElementById('edNotes').addEventListener('input', ()=>{ l.notes = document.getElementById('edNotes').value || null; });
  document.getElementById('addTagBtn').addEventListener('click', ()=>{ l.tags.push(''); renderTagsEditor(l); refreshGates(l); });
  document.getElementById('saveVerifiedFactsBtn').addEventListener('click', async ()=>{
    l.productType = document.getElementById('edProductType').value;
    l.verifiedFacts = {
      formats: Array.from(document.querySelectorAll('.ed-vf-format:checked')).map(cb=>cb.value),
      dimensions: document.getElementById('edVfDimensions').value.trim(),
      kerf: document.getElementById('edVfKerf').value.trim(),
      personalization: document.getElementById('edVfPersonalization').value,
      materials: l.verifiedFacts.materials||'', productionTime: l.verifiedFacts.productionTime||'',
    };
    const ok = await persistWorkbook();
    const f = document.getElementById('vfSaveFlash');
    f.className = 'result-flash show ' + (ok?'ok':'err');
    f.textContent = ok ? 'Saved.' : 'Save failed.';
  });
  document.querySelectorAll('[data-aigen]').forEach(b=> b.addEventListener('click', ()=> draftWithAi(l, b.dataset.aigen)));
  const checkPhotoBtn = document.getElementById('checkPhotoBtn');
  if(checkPhotoBtn) checkPhotoBtn.addEventListener('click', async ()=>{
    const out = document.getElementById('photoCheckResult');
    checkPhotoBtn.disabled = true; checkPhotoBtn.textContent = 'Looking at the photo…';
    if(out) out.innerHTML = '';
    try{
      const res = await fetch(AI_PROXY + '/describe-artwork', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ imageUrl: (l.imageUrls||[])[0] }),
      });
      const d = await res.json();
      if(!res.ok || d.error) throw new Error(d.error || `HTTP ${res.status}`);
      l.artworkDescription = d;
      await persistWorkbook();
      // renderDrawer() already renders the description AND wires the
      // "Apply these to verified facts" button. Overwriting innerHTML here
      // replaced that button with an identical-looking one carrying no
      // click handler — which is exactly why it did nothing.
      renderDrawer(l);
    }catch(e){
      const fresh = document.getElementById('photoCheckResult') || out;
      if(fresh) fresh.innerHTML = `<div class="banner err" style="margin:0;"><span class="mono">⚠</span><span class="fill">Couldn't check the photo: ${escapeHtml(e.message)}</span></div>`;
      const b = document.getElementById('checkPhotoBtn');
      if(b){ b.disabled=false; b.textContent='\u2726 Check photo & describe artwork'; }
    }
  });
  const applySpecsBtn = document.getElementById('applyPhotoSpecsBtn');
  if(applySpecsBtn) applySpecsBtn.addEventListener('click', async ()=>{
    const d = l.artworkDescription || {};
    // Only accept formats this shop actually offers — a photo saying "AI"
    // or a misread word shouldn't invent a format that isn't configured.
    const allowed = (WB.meta.availableFormats||DEFAULT_AVAILABLE_FORMATS).map(f=>f.toUpperCase());
    const matched = (d.formatsShownInPhoto||[])
      .map(f=>String(f).toUpperCase().trim())
      .filter(f=>allowed.includes(f));
    const unmatched = (d.formatsShownInPhoto||[])
      .map(f=>String(f).toUpperCase().trim())
      .filter(f=>!allowed.includes(f));

    if(matched.length){
      const existing = new Set(l.verifiedFacts.formats||[]);
      matched.forEach(f=>existing.add(f));
      l.verifiedFacts.formats = Array.from(existing);
    }
    if((d.dimensionsShownInPhoto||'').trim() && !(l.verifiedFacts.dimensions||'').trim()){
      l.verifiedFacts.dimensions = d.dimensionsShownInPhoto.trim();
    }
    const saved = await persistWorkbook();
    renderDrawer(l);   // re-renders Verified facts with the new values, re-wired
    // Append the confirmation rather than replacing the block — replacing it
    // would strip the freshly-wired button off the page again.
    const fresh = document.getElementById('photoCheckResult');
    if(fresh){
      fresh.insertAdjacentHTML('beforeend',
        `<div class="banner ${saved?'ok':'err'}" style="margin:8px 0 0 0;"><span class="mono">${saved?'✓':'⚠'}</span><span class="fill">
          ${saved ? 'Saved to verified facts' : 'Could NOT be saved'}${matched.length?`: ${matched.map(escapeHtml).join(', ')}`:''}${(d.dimensionsShownInPhoto||'')?` \u00b7 size ${escapeHtml(d.dimensionsShownInPhoto)}`:''}. ${saved?'Check the Verified facts section below and correct anything wrong.':''}
          ${unmatched.length?`<br/><b>Skipped</b> ${unmatched.map(escapeHtml).join(', ')} \u2014 not in this shop's configured format list (set that on Playbook if it should be).`:''}
          ${(!matched.length && !(d.dimensionsShownInPhoto||'').trim())?`<br/>Nothing was applied \u2014 no recognised formats or dimensions were printed on the photo.`:''}
        </span></div>`);
    }
  });
  const singlePushBtn = document.getElementById('singlePushBtn');
  if(singlePushBtn) singlePushBtn.addEventListener('click', async ()=>{
    const out = document.getElementById('singlePushResult');

// The one real "MARK COMPLETE" action: writes listing + closeout + completion
// atomically (single persisted object), then reads the saved copy back and
// verifies all three records actually agree before claiming success.
// A project push satisfies a different, narrower bar than the old MARK
// COMPLETE gates (which require infographic + description + full tag set
// together) — a Title-only or Tags-only project can never meet those, so
// its real, successful pushes were invisible to the Completion Log. This
// registers what a project actually pushed, using its own scope as the
// standard rather than the old full-rewrite checklist.
async function completeProjectPushes(project){
  const today = todayISO;
  const pushedSkus = (project.pushed||[]).filter(s=>!(project.loggedSkus||[]).includes(s));
  if(!pushedSkus.length) return { added:0 };

  pushedSkus.forEach(sku=>{
    const l = WB.listings.find(x=>x.sku===sku);
    if(!l) return;
    const pushEntry = (WB.pushLog||[]).filter(p=>p.sku===sku && p.projectId===project.id).pop();
    const fieldsNote = pushEntry ? pushEntry.fields.join(', ') : PROJECT_SCOPES[project.scope].label;
    WB.sessionCloseout.push({
      workDate: today, sku: l.sku, listing: l.oldTitle || l.proposedTitle,
      completionEvidence: `Pushed to Etsy via project "${project.name}"`,
      etsyStatus: l.status, infographic: l.infographic, fbPost: l.fbStatus==='PUBLISHED'?'Yes':'No',
      morningReconciled: 'YES', notes: `Scope: ${fieldsNote}`,
    });
    WB.completionCheck.push({
      sku: l.sku, listing: l.oldTitle || l.proposedTitle, etsyStatus: l.status, liveDate: l.liveDate,
      infographic: l.infographic, fbPost: l.fbStatus==='PUBLISHED'?'Yes':'No',
      auditResult: 'PASS', notes: `Pushed via project "${project.name}" — wrote: ${fieldsNote}.`,
    });
    if(!project.loggedSkus) project.loggedSkus = [];
    project.loggedSkus.push(sku);
  });
  await persistWorkbook();
  return { added: pushedSkus.length };
}

async function markComplete(l, force){
  if(!force){
    if(!gatesPass(l)){ flashResult(false, 'Gates not satisfied.'); return; }
    l.tags = currentTagsFromUI();
    if(!gatesPass(l)){ renderGateList(l); flashResult(false, 'Tags changed — gates no longer pass.'); return; }
  } else {
    l.tags = currentTagsFromUI();
  }

  const wasUpdatedBefore = l.status && l.status.startsWith('UPDATED');
  l.status = wasUpdatedBefore ? 'UPDATED*' : 'UPDATED';
  l.pendingDraft = false; // it's live now — clear the draft flag so it drops out of the queue
  l.etsyChangedExternally = false; l.externalChangeDetail = null; // reconciled — the app now reflects the change

  // A forced completion is still honest about what it is — this is not
  // a push, and the record says plainly that the gates weren't all met.
  const unmetGates = force ? computeGates(l).filter(g=>!g.pass).map(g=>g.label) : [];
  const closeoutEntry = {
    workDate: todayISO, sku: l.sku, listing: l.proposedTitle || l.oldTitle,
    completionEvidence: force ? 'Manually reviewed and force-completed \u2014 not all gates were met' : 'Recorded via Ops Bench MARK COMPLETE',
    etsyStatus: l.status,
    infographic: l.infographic, fbPost: l.fbStatus==='PUBLISHED' ? 'Yes' : 'No',
    morningReconciled: 'YES', notes: force ? `Manual override. Unmet: ${unmetGates.join('; ') || 'none'}. ${l.notes||''}`.trim() : (l.notes || ''),
  };
  const completionEntry = {
    sku: l.sku, listing: l.proposedTitle || l.oldTitle, etsyStatus: l.status, liveDate: l.liveDate,
    infographic: l.infographic, fbPost: l.fbStatus==='PUBLISHED' ? 'Yes' : 'No',
    auditResult: force ? 'MANUAL OVERRIDE' : 'PASS',
    notes: force ? `Marked complete manually without all gates passing. Unmet: ${unmetGates.join('; ') || 'none'}.` : 'All tracked completion fields present — gated by Ops Bench.',
  };

  // replace existing entries for this SKU rather than duplicating
  WB.sessionCloseout = WB.sessionCloseout.filter(c=>!(c.sku===l.sku && c.workDate===todayISO));
  WB.sessionCloseout.push(closeoutEntry);
  WB.completionCheck = WB.completionCheck.filter(c=>c.sku!==l.sku);
  WB.completionCheck.push(completionEntry);

  const ok = await persistWorkbook();
  if(!ok){
    flashResult(false, 'SAVE FAILED — records not confirmed. Nothing marked complete. Try again.');
    return;
  }
  // read-back verification across all three records
  let verified = false;
  try{
    const r = await appStorage.get(wbKeyFor(activeProfileId));
    const check = JSON.parse(r.value);
    const cl = check.listings.find(x=>x.sku===l.sku);
    const cc = check.sessionCloseout.find(x=>x.sku===l.sku && x.workDate===todayISO);
    const cp = check.completionCheck.find(x=>x.sku===l.sku);
    verified = !!(cl && cl.status===l.status && cc && cp);
  }catch(e){ verified = false; }

  if(verified){
    const msg = force ? 'RECORDED — MANUAL OVERRIDE (not all gates met)' : 'PASS — RECORDED AND VERIFIED';
    flashResult(true, msg);
    renderDrawer(l);
    flashResult(true, msg); // re-set after the refresh wipes it, so it's actually visible
  } else {
    flashResult(false, 'Write succeeded but read-back verification failed. Do not trust this as complete — reload and check.');
  }
  updateMiniGauge(); renderNav();
  if(uiState.lastTab==='listings') renderListings();
}

let projectState = { editingId:null, pickerFor:null, confirmBulk:null, viewingId:null, bulkExcludedByProject:{}, pendingAssign:null, openProjectId:null, pickerSearch:'', pickerSection:'', pickerSelected:[], openNewProjectForm:false, pickerSortCol:'sku', pickerSortDir:'asc' };
// One exclusion set per project — so unchecking a listing in one project's
// review list can never accidentally exclude it in a different project.
function excludedSetFor(pid){
  if(!projectState.bulkExcludedByProject[pid]) projectState.bulkExcludedByProject[pid] = new Set();
  return projectState.bulkExcludedByProject[pid];
}

// ============================================================
// BULK PUSH
// Runs the same single-listing push over every ready listing in a
// project, one at a time. Deliberately sequential: Etsy allows 10
// requests/second and the app makes two per listing (snapshot read,
// then write), so a paced loop stays comfortably inside the limit and
// keeps the failure of one listing from taking down the run.
// ============================================================
let bulkState = { running:false, cancel:false, log:[], done:0, total:0, projectId:null };

// Sorts a project's listings into what can go now and what can't, with
// the reason — shown before anything is written.
function bulkPreflight(project){
  const ready = [], blocked = [];
  project.skus.forEach(sku=>{
    if((project.pushed||[]).includes(sku)) return; // already done
    const l = WB.listings.find(x=>x.sku===sku);
    if(!l){ blocked.push({ sku, title:'(not found in this shop)', reason:'No listing with this SKU.' }); return; }
    const blockers = etsyPushBlockers(l, project);
    if(blockers.length) blocked.push({ sku, title:l.oldTitle||sku, reason:blockers[0] });
    else ready.push(l);
  });
  return { ready, blocked };
}

async function runBulkPush(project, selected){
  const ready = selected || bulkPreflight(project).ready;
  bulkState = { running:true, cancel:false, log:[], done:0, total:ready.length, projectId:project.id };
  renderProjects();

  for(const l of ready){
    if(bulkState.cancel){
      bulkState.log.push({ sku:l.sku, ok:false, msg:'Stopped by you — this listing was not touched.' });
      break;
    }
    const r = await pushListingToEtsy(l, project);
    bulkState.done++;
    bulkState.log.push({ sku:l.sku, title:l.oldTitle||l.sku, ok:r.ok, msg:r.message });
    renderProjects();
    // Pace the run: two calls per listing, well under Etsy's 10/second.
    await new Promise(res=>setTimeout(res, 400));
  }

  bulkState.running = false;
  await persistWorkbook();
  renderProjects();
}

// ============================================================
// BULK GENERATION — drafts only, never pushes. Each listing goes through
// the SAME validated path as the single Generate button: nothing is
// applied to a listing unless it passes the shared validator, so a bad
// draft in the middle of a run can't quietly overwrite good content.
// ============================================================
let bulkGenState = { running:false, cancel:false, log:[], done:0, total:0, projectId:null };

async function generateOneForBulk(l, field){
  const instructions = WB.meta.seoInstructionsV1Draft;
  if(!instructions || !instructions.trim()) return { ok:false, message:'No SEO instructions saved (Rules & Playbook).' };
  const useTemplates = WB.meta.useDescriptionTemplates;
  try{
    const res = await fetch(AI_PROXY + '/draft-openai', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        sku: l.sku, oldTitle: l.oldTitle, currentTags: l.tags,
        keywordMatches: findKeywordMatches(l), notes: l.notes,
        tagContext: buildTrustedTagContext(l),
        instructions, instructionVersion:'v1-draft',
        researchVersion: WB.meta.seoResearchVersion || '',
        verifiedFacts: l.verifiedFacts, useTemplates,
        artworkDescription: l.artworkDescription || null,
      }),
    });
    const data = await res.json();
    if(!res.ok || data.error) return { ok:false, message: data.message || data.error || `HTTP ${res.status}` };

    let assembled = null;
    if(useTemplates){
      assembled = assembleDescription(l, l.productType, WB.meta.descriptionTemplates, l.verifiedFacts, data.introText, data.useText);
    }
    const draftForChecks = { ...data, description: assembled ? assembled.description : data.description };
    const v = validateDraft(l, draftForChecks, l.verifiedFacts, assembled, { field });
    if(!v.ok) return { ok:false, message: v.blocking.join(' \u00b7 ') };

    if((!field || field==='title')) l.proposedTitle = data.title || l.proposedTitle;
    if((!field || field==='description')) l.description = (assembled ? assembled.description : data.description) || l.description;
    if((!field || field==='tags') && Array.isArray(data.tags)) l.tags = data.tags.map(t=>String(t).trim());
    l.aiInvented = findInventedWords(l, draftForChecks);
    return { ok:true, message: v.warnings.length ? `Applied \u2014 ${v.warnings.length} note(s)` : 'Applied', warnings:v.warnings };
  }catch(e){
    return { ok:false, message:'Request failed: ' + e.message };
  }
}

async function runBulkGenerate(project, listings, field){
  bulkGenState = { running:true, cancel:false, log:[], done:0, total:listings.length, projectId:project.id };
  renderProjects();
  for(const l of listings){
    if(bulkGenState.cancel){
      bulkGenState.log.push({ sku:l.sku, ok:false, msg:'Stopped by you — this listing was not touched.' });
      break;
    }
    const r = await generateOneForBulk(l, field);
    bulkGenState.done++;
    bulkGenState.log.push({ sku:l.sku, title:l.oldTitle||l.sku, ok:r.ok, msg:r.message });
    // Save after each one so a crash or a close mid-run doesn't lose
    // everything already generated.
    await persistWorkbook();
    renderProjects();
    await new Promise(res=>setTimeout(res, 300));
  }
  bulkGenState.running = false;
  await persistWorkbook();
  renderProjects();
}

        </select>
        <div class="section-note" id="npScopeBlurb" style="margin:8px 0 0 0;">${escapeHtml(PROJECT_SCOPES.title.blurb)}</div>
      </div>
      <div id="npSectionPicker" style="display:none;">
        <div class="field"><label>Move every listing in this project into which section?</label>
          <select id="npTargetSection">
            <option value="">\u2014 choose \u2014</option>
            ${(WB.shopSections||[]).map(s=>`<option value="${s.id}">${escapeHtml(s.title)}</option>`).join('')}
          </select>
        </div>
        <button class="copy-btn" id="npRefreshSections" style="margin-bottom:14px;">Refresh sections from Etsy</button>
      </div>
      <div class="section-note" style="margin-bottom:0;">Scope is locked once the project is created — that's the point of it. Never writable by any project: SKU, price, quantity, listing status, shipping, or files.</div>
      <div class="save-bar"><button class="btn primary" id="createProjectBtn">Create project</button>
      <button class="btn" id="cancelProjectBtn">Cancel</button></div>
    </div>
  </div>`;

  const activeProjects = projects.filter(p=>!p.archived);
  const archivedProjects = projects.filter(p=>p.archived);
  const openProject = activeProjects.find(p=>p.id===projectState.openProjectId);

  if(!projects.length){
    html += `<div class="empty-hint">No projects yet. Create one to start working.</div>`;
  } else if(openProject){
    // ---------- DETAIL VIEW: inside one project ----------
    const p = openProject;
    const pr = projectProgress(p);
    const isActive = p.id===activeId;
    const allPushed = pr.total > 0 && pr.done === pr.total;
    const unloggedPushed = (p.pushed||[]).filter(s=>!(p.loggedSkus||[]).includes(s)).length;
    html += `<button class="copy-btn" id="backToProjectsBtn" style="margin-bottom:16px;">\u2190 All projects</button>`;
    html += `<div class="card" style="margin-bottom:10px; ${isActive?'border-color:var(--ink); border-width:1.5px;':''}">
        ${unloggedPushed ? `<div class="banner warn" style="margin-bottom:14px;"><span class="mono">i</span><span class="fill"><b>${unloggedPushed}</b> pushed listing${unloggedPushed===1?"":'s'} ${unloggedPushed===1?"isn't":"aren't"} registered in the Completion Log yet.</span><button data-completeproj="${p.id}">Register in Completion Log</button></div>` : ''}
        ${allPushed ? `<div class="banner ok" style="margin-bottom:14px;"><span class="mono">✓</span><span class="fill">All ${pr.total} listing${pr.total===1?'':'s'} pushed. Nothing left to do here.</span><button data-archiveproj="${p.id}">Archive this project</button></div>` : ''}
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;">
          <div style="flex:1; min-width:240px;">
            <div style="font-size:18px; font-weight:700; color:var(--ink); margin-bottom:5px;">
              ${escapeHtml(p.name)} ${isActive?'<span class="badge updated" style="margin-left:6px;">ACTIVE</span>':''}
            </div>
            <div class="section-note" style="margin:0 0 8px 0;">
              Scope: <b style="color:var(--ink)">${escapeHtml(PROJECT_SCOPES[p.scope].label)}</b> · ${pr.done} of ${pr.total} pushed
            </div>
            <div class="gauge-mini"><div class="bar"><div class="bar-fill" style="width:${pr.pct}%"></div></div></div>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${isActive?'':`<button class="btn" data-activate="${p.id}">Make active</button>`}
            <button class="btn" data-addskus="${p.id}">Add listings</button>
            <button class="btn" data-archiveproj="${p.id}">Archive</button>
            <button class="btn danger" data-delproj="${p.id}">Delete</button>
          </div>
        </div>
        ${(()=>{
          const rows = p.skus.map(sku=>({ sku, l: WB.listings.find(x=>x.sku===sku) }));
          if(!rows.length) return `<div class="empty-hint" style="margin-top:14px;">No listings in this project yet \u2014 use "Add listings" above.</div>`;
          const flaggedCount = rows.filter(r=>r.l && !r.l.batchVerified && visibleFlags(r.l).length).length;
          const excluded = excludedSetFor(p.id);
          return `<div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
            ${flaggedCount ? `<div class="banner warn" style="margin-bottom:12px;"><span class="mono">!</span><span class="fill"><b>${flaggedCount}</b> listing${flaggedCount===1?'':'s'} in this project still ${flaggedCount===1?'has':'have'} unresolved verification notes from the prepared batch.</span><button data-clearallflags="${p.id}">Clear all</button></div>` : ''}
            <div class="section-note" style="margin-bottom:10px;">Uncheck any listing you don't want touched next time this project pushes to Etsy \u2014 this is remembered here and in the push confirmation.</div>
            <div class="priority-list">
              ${rows.map(r=>{
                const pushed = (p.pushed||[]).includes(r.sku);
                if(!r.l) return `<div class="priority-row" style="cursor:default; border-left-color:var(--red);">
                  <span class="sku">${escapeHtml(r.sku)}</span>
                  <span class="title" style="color:var(--red);">Not found in this shop \u2014 remove or re-import</span>
                </div>`;
                const flagged = !r.l.batchVerified && visibleFlags(r.l).length;
                return `<div class="priority-row" style="${pushed?'border-left-color:var(--green);':''}${flagged?'border-left-color:var(--amber);':''}">
                  ${pushed?'':`<input type="checkbox" data-reviewcheck="${r.sku}" data-reviewcheckproj="${p.id}" ${excluded.has(r.sku)?'':'checked'} style="flex-shrink:0;"/>`}
                  <span class="sku" data-openlisting="${r.sku}" style="cursor:pointer;">${escapeHtml(r.sku)}</span>
                  <span class="title" data-openlisting="${r.sku}" style="cursor:pointer;">${escapeHtml(r.l.oldTitle||r.l.proposedTitle||'(no title)')}</span>
                  ${pushed?'<span class="badge updated">PUSHED</span>':''}
                  ${flagged?`<button class="copy-btn" data-clearflag="${r.sku}">Clear check (${visibleFlags(r.l).length})</button>`:''}
                  <span class="go" data-openlisting="${r.sku}" style="cursor:pointer;">OPEN \u2192</span>
                </div>`;
              }).join('')}
            </div>
            ${p.skus.some(sku=>!(p.pushed||[]).includes(sku)) ? `
            <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
              <div class="ws-lbl"><span>Generate drafts with AI</span></div>
              <div class="section-note" style="margin:4px 0 10px 0;">Writes drafts onto these listings for you to review \u2014 it does <b>not</b> push anything to Etsy. One API call per listing, so a large project costs real money; nothing is applied for a listing whose draft fails validation.</div>
              <div class="row2" style="margin-bottom:10px;">
                <div class="field" style="margin-bottom:0;"><label>Generate what?</label>
                  <select id="bulkGenField_${p.id}">
                    <option value="">Title, description and tags</option>
                    <option value="title">Title only</option>
                    <option value="tags">Tags only</option>
                    <option value="description">Description only</option>
                  </select></div>
                <div class="field" style="margin-bottom:0;"><label>Which listings?</label>
                  <select id="bulkGenScope_${p.id}">
                    <option value="unpushed">Not yet pushed (${p.skus.filter(s=>!(p.pushed||[]).includes(s)).length})</option>
                    <option value="all">Every listing in this project (${p.skus.length})</option>
                  </select></div>
              </div>
              <button class="btn" data-bulkgen="${p.id}" ${bulkGenState.running?'disabled':''}>${bulkGenState.running?'Generating…':'\u2726 Generate drafts for these listings'}</button>
            </div>
            <button class="btn primary" data-bulk="${p.id}" style="width:100%; margin-top:16px;">Push all to Etsy</button>` : ''}
          </div>`;
        })()}
        ${bulkGenState.projectId===p.id && (bulkGenState.running || bulkGenState.log.length) ? `
        <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
          <div class="k" style="margin-bottom:8px;">${bulkGenState.running ? `GENERATING — ${bulkGenState.done} OF ${bulkGenState.total}` : `RUN FINISHED — ${bulkGenState.log.filter(x=>x.ok).length} APPLIED, ${bulkGenState.log.filter(x=>!x.ok).length} SKIPPED`}</div>
          <div class="gauge-mini" style="margin-bottom:12px;"><div class="bar"><div class="bar-fill" style="width:${bulkGenState.total?Math.round((bulkGenState.done/bulkGenState.total)*100):0}%"></div></div></div>
          ${bulkGenState.running ? `<button class="btn danger" data-bulkgencancel="1">Stop after this listing</button>` : `<button class="btn" data-bulkgenclear="1">Clear</button>`}
          <div class="card-scroll" style="max-height:240px; margin-top:12px;"><table class="simple-table">
            <tbody>${bulkGenState.log.slice().reverse().map(e=>`<tr>
              <td class="small" style="width:56px;">${escapeHtml(e.sku)}</td>
              <td class="${e.ok?'pass':''}" style="${e.ok?'':'color:var(--red)'}">${e.ok?'applied':'skipped'}</td>
              <td class="small">${escapeHtml(e.msg||'')}</td>
            </tr>`).join('')}</tbody>
          </table></div>
        </div>` : ''}
        ${bulkState.projectId===p.id && (bulkState.running || bulkState.log.length) ? `
        <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
          <div class="k" style="margin-bottom:8px;">${bulkState.running ? `PUSHING — ${bulkState.done} OF ${bulkState.total}` : `RUN FINISHED — ${bulkState.log.filter(x=>x.ok).length} PUSHED, ${bulkState.log.filter(x=>!x.ok).length} FAILED`}</div>
          <div class="gauge-mini" style="margin-bottom:12px;"><div class="bar"><div class="bar-fill" style="width:${bulkState.total?Math.round((bulkState.done/bulkState.total)*100):0}%"></div></div></div>
          ${bulkState.running ? `<button class="btn danger" data-bulkcancel="1">Stop after this listing</button>` : `<button class="btn" data-bulkclear="1">Clear</button>`}
          <div class="card-scroll" style="max-height:240px; margin-top:12px;"><table class="simple-table">
            <tbody>${bulkState.log.slice().reverse().map(e=>`<tr>
              <td class="small" style="width:56px;">${escapeHtml(e.sku)}</td>
              <td class="${e.ok?'pass':''}" style="${e.ok?'':'color:var(--red)'}">${e.ok?'pushed':'failed'}</td>
              <td class="small">${escapeHtml(e.msg||'')}</td>
            </tr>`).join('')}</tbody>
          </table></div>
        </div>` : ''}
        ${projectState.confirmBulk===p.id ? (()=>{
          const pf = bulkPreflight(p);
          const selectedCount = pf.ready.filter(l=>!excludedSetFor(p.id).has(l.sku)).length;
          return `
        <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
          <div class="banner warn"><span class="mono">!</span><span class="fill">This writes to live Etsy listings. Scope: <b>${escapeHtml(PROJECT_SCOPES[p.scope].label)}</b> — nothing else is touched. A restore point is saved for each one before it changes.</span></div>
          ${pf.blocked.length ? `
            <div class="section-note"><b style="color:var(--ink)">${pf.blocked.length} can't be pushed and are skipped automatically:</b></div>
            <div class="card-scroll" style="max-height:180px; margin-bottom:14px;"><table class="simple-table">
              <tbody>${pf.blocked.map(b=>`<tr><td class="small" style="width:56px;">${escapeHtml(b.sku)}</td><td>${escapeHtml(b.title)}</td><td class="small">${escapeHtml(b.reason)}</td></tr>`).join('')}</tbody>
            </table></div>` : ''}
          ${pf.ready.length ? `
            <div class="section-note" style="margin-bottom:6px;"><b style="color:var(--ink)">${selectedCount} of ${pf.ready.length} selected</b> — uncheck any you don't want touched right now.</div>
            <div style="margin-bottom:10px;">
              <button class="copy-btn" data-bulkselectall="1">Select all</button>
              <button class="copy-btn" data-bulkselectnone="1">Select none</button>
              ${pf.ready.some(l=>!l.batchVerified && visibleFlags(l).length)?`<button class="copy-btn" data-bulkclearflags="${p.id}">Clear all verification checks</button>`:''}
            </div>
            <div class="card-scroll" style="max-height:260px; margin-bottom:16px;">
              ${pf.ready.map(l=>{
                const flagged = !l.batchVerified && visibleFlags(l).length;
                return `<label style="display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line-soft); cursor:pointer; font-size:13px;">
                <input type="checkbox" data-bulkcheck="${l.sku}" data-bulkcheckproj="${p.id}" ${excludedSetFor(p.id).has(l.sku)?'':'checked'}/>
                <span class="sku" style="width:44px; flex-shrink:0;">${escapeHtml(l.sku)}</span>
                <span style="flex:1;">${escapeHtml(l.oldTitle||l.sku)}</span>
                ${flagged?`<span class="badge high">${visibleFlags(l).length} UNCHECKED</span>`:''}
              </label>`;}).join('')}
            </div>
            ${pf.ready.some(l=>!l.batchVerified && visibleFlags(l).length)?`<div class="section-note" style="margin:-8px 0 14px 0;">Listings marked <b style="color:var(--amber)">UNCHECKED</b> still have unresolved verification notes from the prepared batch \u2014 uncheck them here if you want to review each one first, or push anyway.</div>`:''}
            ${WB.meta.pushPassword ? `
            <div class="field"><label>Type your confirmation word to push</label>
              <input type="password" id="bulkConfirmInput" placeholder="confirmation word" autocomplete="off"/></div>
            <button class="btn primary" data-bulkgo="${p.id}" ${selectedCount===0?'disabled':''}>Push ${selectedCount} listing${selectedCount===1?'':'s'} to Etsy</button>`
            : `<div class="banner err"><span class="mono">!</span><span class="fill">No confirmation word set yet \u2014 set one on the Playbook tab before you can bulk push. This is deliberate: it stops an accidental bulk write to live listings.</span></div>`}
            <button class="btn" data-bulkcancelconfirm="1">Cancel</button>`
            : `<div class="empty-hint">Nothing is ready to push in this project.</div>
               <button class="btn" data-bulkcancelconfirm="1">Close</button>`}
        </div>`; })() : ''}
        ${projectState.pickerFor===p.id ? (()=>{
          const alreadyIn = new Set(p.skus);
          const retired = new Set(WB.meta.retiredSkus||[]);
          const search = (projectState.pickerSearch||'').toLowerCase();
          const sectionFilter = projectState.pickerSection||'';
          let candidates = WB.listings.filter(l=>{
            if(l.isDraft || alreadyIn.has(l.sku) || retired.has(l.sku)) return false;
            if(sectionFilter && String(l.shopSectionId)!==sectionFilter) return false;
            if(search && !(l.sku.toLowerCase().includes(search) || (l.oldTitle||'').toLowerCase().includes(search))) return false;
            return true;
          });
          const sortCol = projectState.pickerSortCol || 'sku';
          const sortDir = projectState.pickerSortDir || 'asc';
          const dir = sortDir==='asc' ? 1 : -1;
          candidates = candidates.slice().sort((a,b)=>{
            let av, bv;
            if(sortCol==='title'){ av=(a.oldTitle||'').toLowerCase(); bv=(b.oldTitle||'').toLowerCase(); }
            else { av=a.sku; bv=b.sku; }
            if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
          });
          const arrow = (col)=> sortCol===col ? (sortDir==='asc'?' \u25b2':' \u25bc') : '';
          const selected = projectState.pickerSelected || [];
          return `
        <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
          <div class="row2">
            <div class="field" style="margin-bottom:0;"><label>Search by SKU or title</label>
              <input type="text" id="pickerSearchInput" value="${escapeHtml(projectState.pickerSearch||'')}" placeholder="e.g. 0011 or farm sign"/></div>
            <div class="field" style="margin-bottom:0;"><label>Filter by shop section</label>
              <select id="pickerSectionSelect">
                <option value="">\u2014 all sections \u2014</option>
                ${(WB.shopSections||[]).map(s=>`<option value="${s.id}" ${sectionFilter===String(s.id)?'selected':''}>${escapeHtml(s.title)}</option>`).join('')}
              </select></div>
          </div>
          <div class="section-note" style="margin:8px 0 6px 0;">${candidates.length} match${candidates.length===1?'':'es'} \u2014 ${selected.length} selected</div>
          ${candidates.length ? `<div style="display:flex; align-items:center; gap:10px; padding:6px 12px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim); text-transform:uppercase; letter-spacing:0.1em;">
            <span style="width:16px;"></span>
            <span data-pickersort="sku" style="width:50px; flex-shrink:0; cursor:pointer;">SKU${arrow('sku')}</span>
            <span data-pickersort="title" style="flex:1; cursor:pointer;">TITLE${arrow('title')}</span>
            <span style="flex-shrink:0;">SECTION</span>
          </div>` : ''}
          <div class="card-scroll" style="max-height:280px; margin-bottom:12px;">
            ${candidates.length ? candidates.slice(0,200).map(l=>`
              <label style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line-soft); cursor:pointer; font-size:13px;">
                <input type="checkbox" class="picker-check" value="${l.sku}" ${selected.includes(l.sku)?'checked':''}/>
                <span class="sku" style="width:50px; flex-shrink:0;">${l.sku}</span>
                <span style="flex:1;">${escapeHtml(l.oldTitle||'(no title)')}</span>
                ${l.shopSectionId?`<span class="badge notreviewed" style="flex-shrink:0;">${escapeHtml(sectionNameFor(l.shopSectionId)||'')}</span>`:''}
              </label>`).join('') : `<div class="empty-hint">Nothing matches.</div>`}
          </div>
          <button class="btn primary" data-addselected="${p.id}" ${selected.length===0?'disabled':''}>Add ${selected.length} selected</button>
          <button class="btn" data-cancelsku="1">Cancel</button>
          <details style="margin-top:14px;"><summary class="copy-btn" style="display:inline-block; cursor:pointer;">Or paste SKUs directly</summary>
            <div class="field" style="margin-top:10px;"><label>Paste SKUs (one per line, or comma separated)</label>
              <textarea id="skuPaste" style="min-height:70px; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:10px 12px; font-family:'IBM Plex Mono',monospace; font-size:13px;"></textarea></div>
            <button class="btn primary" data-savesku="${p.id}">Add pasted SKUs</button>
          </details>
        </div>`;
        })() : ''}
      </div>`;
  } else {
    // ---------- LIST VIEW: a clean, clickable list of projects ----------
    html += `<div class="section-title"><span class="left">Your projects</span></div>`;
    if(!activeProjects.length){
      html += `<div class="empty-hint">Nothing active \u2014 everything's archived below, or create a new project.</div>`;
    }
    html += `<div class="priority-list">` + activeProjects.map(p=>{
      const pr = projectProgress(p);
      const isActive = p.id===activeId;
      return `<div class="priority-row" data-openproject="${p.id}" style="height:auto; padding:14px 17px; ${isActive?'border-left-color:var(--ink);':''}">
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
            <span class="title" style="font-weight:700;">${escapeHtml(p.name)}</span>
            ${isActive?'<span class="badge updated">ACTIVE</span>':''}
            <span class="badge draft">${escapeHtml(PROJECT_SCOPES[p.scope].label)}</span>
          </div>
          <div class="gauge-mini" style="max-width:280px;"><div class="bar"><div class="bar-fill" style="width:${pr.pct}%"></div></div></div>
        </div>
        <span class="count-pill">${pr.done}/${pr.total}</span>
        <span class="go">ENTER \u2192</span>
      </div>`;
    }).join('') + `</div>`;

    if(archivedProjects.length){
      html += `<div class="section-title" style="margin-top:30px;"><span class="left">Archived (${archivedProjects.length})</span></div>`;
      html += archivedProjects.map(p=>{
        const pr = projectProgress(p);
        return `<div class="card" style="margin-bottom:8px; opacity:0.7;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;">
            <div>
              <div style="font-size:14px; font-weight:700; color:var(--ink);">${escapeHtml(p.name)}</div>
              <div class="section-note" style="margin:2px 0 0 0;">Scope: ${escapeHtml(PROJECT_SCOPES[p.scope].label)} · ${pr.done} of ${pr.total} pushed</div>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn" data-unarchiveproj="${p.id}">Unarchive</button>
              <button class="btn danger" data-delproj="${p.id}">Delete</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }
  }

  document.getElementById('content').innerHTML = html;

  const backBtn = document.getElementById('backToProjectsBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ projectState.openProjectId = null; renderProjects(); });
  document.querySelectorAll('[data-openproject]').forEach(el=> el.addEventListener('click', ()=>{
    projectState.openProjectId = el.dataset.openproject;
    projectState.confirmBulk = null; projectState.pickerFor = null;
    renderProjects();
  }));

  const form = document.getElementById('newProjectForm');
  const assignScopeSel = document.getElementById('assignNewScope');
  if(assignScopeSel) assignScopeSel.addEventListener('change', ()=>{
    document.getElementById('assignScopeBlurb').textContent = PROJECT_SCOPES[assignScopeSel.value].blurb;
  });
  const assignExistingBtn = document.getElementById('assignExistingBtn');
  if(assignExistingBtn) assignExistingBtn.addEventListener('click', async ()=>{
    const pid = document.getElementById('assignExistingSelect').value;
    if(!pid) return;
    const p = WB.projects.find(x=>x.id===pid);
    const pa = projectState.pendingAssign;
    let added = 0;
    pa.skus.forEach(s=>{ if(!p.skus.includes(s)){ p.skus.push(s); added++; } });
    WB.meta.activeProjectId = p.id;
    projectState.pendingAssign = null;
    projectState.openProjectId = p.id; // straight into it
    await persistWorkbook();
    render();
  });
  const assignNewBtn = document.getElementById('assignNewBtn');
  if(assignNewBtn) assignNewBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('assignNewName').value.trim();
    if(!name) return;
    const scope = document.getElementById('assignNewScope').value;
    const pa = projectState.pendingAssign;
    const id = newProjectId();
    WB.projects.push({ id, name, scope, skus: pa.skus.slice(), pushed:[], loggedSkus:[], created: todayISO });
    WB.meta.activeProjectId = id;
    projectState.pendingAssign = null;
    projectState.openProjectId = id; // straight into it
    await persistWorkbook();
    render();
  });
  const assignCancelBtn = document.getElementById('assignCancelBtn');
  if(assignCancelBtn) assignCancelBtn.addEventListener('click', ()=>{
    projectState.pendingAssign = null; renderProjects();
  });
  document.getElementById('downloadBulkEditBtn').addEventListener('click', downloadBulkEditTemplate);
  document.getElementById('newProjectBtn').addEventListener('click', ()=>{
    const willOpen = form.style.display==='none';
    form.style.display = willOpen ? 'block' : 'none';
    projectState.openNewProjectForm = willOpen;
    if(willOpen) document.getElementById('npName')?.focus();
  });
  const scopeSel = document.getElementById('npScope');
