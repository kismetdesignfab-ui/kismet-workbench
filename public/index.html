// ============================================================
// KEYWORD RESEARCH — a permanent, searchable log of what you look up
// in Etsy's own Marketplace Insights. Manual entry (Etsy doesn't expose
// this through the API — see Playbook), indexed by keyword text so it
// cross-references across every listing instead of living in screenshots.
// ============================================================

// Pulls a candidate research phrase out of a title by stripping the generic
// words that repeat across nearly every listing in this kind of shop
// (file formats, tool names, download language) — what's left is usually
// the actual product concept worth checking in Marketplace Insights.
const KEYWORD_NOISE_WORDS = new Set([
  'svg','dxf','png','pdf','eps','ai','jpg','jpeg',
  'cut','file','files','cutfile','cutting',
  'laser','plasma','cnc','xtool','cricut','glowforge','silhouette',
  'digital','download','downloads','instant','printable',
  'sign','signs','template','templates','pattern','patterns',
  'a','an','the','for','with','and','or','of','on','in','to','your',
]);
function extractKeywordCandidates(listing){
  const titles = [listing.oldTitle, listing.proposedTitle].filter(Boolean);
  const seen = new Set();
  const candidates = [];
  titles.forEach(title=>{
    const cleaned = title.replace(/\([^)]*\)/g, ' '); // drop "(Download)" style parentheticals
    const words = cleaned.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    const kept = words.filter(w=>!KEYWORD_NOISE_WORDS.has(w) && w.length>1);
    if(!kept.length) return;
    const phrase = kept.join(' ');
    if(phrase && !seen.has(phrase)){ seen.add(phrase); candidates.push(phrase); }
    if(kept.length>3){
      const short = kept.slice(0,3).join(' ');
      if(!seen.has(short)){ seen.add(short); candidates.push(short); }
    }
  });
  return candidates.slice(0,4);
}

function findKeywordMatches(listing){
  if(!listing) return [];
  // Search the WHOLE research collection, then rank and dedupe — the old
  // "first five matching records" was arbitrary and could drop the most
  // relevant entry purely because of insertion order.
  //
  // Ranking, in order:
  //   1. Relevance — does the phrase actually describe this listing?
  //   2. SKU-linked, among equally relevant (a link is weak evidence: the
  //      screenshot importer can attach every similar term to one SKU).
  //   3. Recorded conversion strength. Missing stays UNKNOWN, never "low",
  //      and is never inferred from searches or competition.
  //   4. Recency, then search volume as tie-breakers.
  const titleWords = normalizeTagText((listing.oldTitle||'')+' '+(listing.proposedTitle||''))
    .split(' ').filter(w=>w.length>2 && !TAG_NON_SUBJECT_WORDS.has(w));
  const titleStems = tagStemSet(titleWords);

  const CONVERSION_RANK = { 'very high':5, 'high':4, 'typical':3, 'low':2, 'very low':1 };
  const scored = (WB.keywordResearch||[]).map(k=>{
    const kwWords = normalizeTagText(k.keyword).split(' ').filter(w=>w.length>2 && !TAG_NON_SUBJECT_WORDS.has(w));
    if(!kwWords.length) return null;
    const overlap = kwWords.filter(w=>titleStems.has(tagStem(w))).length;
    const relevance = overlap / kwWords.length;   // 1.0 = every significant word matches
    if(relevance === 0 && k.linkedSku !== listing.sku) return null;
    const convRaw = (k.conversion||'').trim().toLowerCase();
    return {
      rec: k,
      relevance,
      linked: k.linkedSku === listing.sku ? 1 : 0,
      conv: CONVERSION_RANK[convRaw] || 0,     // 0 = unknown, deliberately not "low"
      date: k.dateResearched || '',
      searches: parseInt(String(k.searches||'').replace(/[^0-9]/g,''),10) || 0,
    };
  }).filter(Boolean);

  scored.sort((a,b)=>
    (b.relevance - a.relevance) ||
    (b.linked - a.linked) ||
    (b.conv - a.conv) ||
    (b.date.localeCompare(a.date)) ||
    (b.searches - a.searches)
  );

  const seen = new Set();
  const out = [];
  scored.forEach(s=>{
    const key = normalizeTagText(s.rec.keyword);
    if(seen.has(key)) return;
    seen.add(key);
    out.push(s.rec);
  });
  return out.slice(0,8);
}

// Sends the listing's context (old title, current tags, keyword research
// already logged, any notes) to OpenAI via the AI proxy and drops the
// result into the proposed title/description/tags fields. Never marks
// anything complete on its own — it's a draft, gates still apply the
// same as if you'd typed it yourself.
// Catches the failure mode that matters most: the model inventing product
// facts. Any substantive word in the generated title or tags that can't be
// traced back to the old title, existing tags, keyword research, or notes
// gets flagged for review rather than silently accepted.
const AI_ALLOWED_VOCAB = new Set([
  'svg','dxf','png','pdf','eps','file','files','cut','cutting','cnc','plasma','laser',
  'digital','download','instant','sign','signs','art','design','template','pattern',
  'for','and','with','the','a','an','of','to','in','on','your','you','it','is',
]);
function findInventedWords(l, draft){
  // Old tags are unverified history, not confirmed evidence — a legacy tag
  // being wrong or vague is exactly the kind of thing this app exists to
  // fix, so it can't also count as proof a word is accurate. The old
  // TITLE stays trusted (it's the one thing a human actually named
  // deliberately); old tags don't get that benefit anymore.
  const source = [
    l.oldTitle||'', l.notes||'',
    l.pk||'', l.sk||'',
    findKeywordMatches(l).map(k=>k.keyword+' '+(k.relatedTerms||'')).join(' '),
  ].join(' ').toLowerCase();
  const sourceWords = new Set(source.split(/[^a-z0-9]+/).filter(Boolean));
  // Same word-family matching used by the tag checks — otherwise "farm"
  // could satisfy one check and be flagged as invented by another.
  const sourceStems = tagStemSet(Array.from(sourceWords));
  const check = ((draft.title||'') + ' ' + (draft.tags||[]).join(' ')).toLowerCase();
  const flagged = [];
  const seen = new Set();
  check.split(/[^a-z0-9]+/).filter(w=>w.length>2).forEach(w=>{
    if(seen.has(w)) return;
    seen.add(w);
    if(AI_ALLOWED_VOCAB.has(w)) return;
    if(sourceWords.has(w)) return;
    if(sourceStems.has(tagStem(w))) return;
    flagged.push(w);
  });
  return flagged;
}

// ============================================================
// DETERMINISTIC RESPONSE-INTEGRITY CHECKS — provider-agnostic. These are
// mechanical pass/fail checks, separate from the (much bigger, later)
// judgment-based audit. Runs on any draft from any provider.
// ============================================================

// Words that describe the general activity/category rather than THIS
// design specifically. Used to find genuine SUBJECT words in the title —
// a title mentioning "CNC" or "sign" doesn't make those subject-specific,
// they're just process/category vocabulary.
const TAG_NON_SUBJECT_WORDS = new Set([
  'design','making','custom','art','artwork','template','pattern','craft','decor',
  'gift','item','product','digital','download','sign','signs','file','files',
  'cut','cutting','cnc','plasma','laser','svg','dxf','png','pdf','eps','xtool','cricut','glowforge',
  'for','and','with','the','a','an','of','to','so',
]);
// A genuine format/product-type identifier — legitimate even standing
// alone with process words ("CNC plasma file", "laser cut file"), since it
// tells a buyer what they're actually getting, unlike "CNC design" or
// "plasma cutting" which name an activity with no product attached.
const TAG_FORMAT_WORDS = new Set(['file','files','svg','dxf','png','pdf','eps','download']);
// Exact known-bad patterns caught by direct evidence, not just the general
// rule — case/spacing-insensitive.
const TAG_HARD_BLACKLIST = new Set([
  'artwork','quote design','custom signs','sign making','cnc design',
  'digital download','laser design','plasma design','cut design',
]);
// These words are filler in this shop's tags even when a subject word is
// attached ("farm life design" is still filler).
const TAG_BANNED_FILLER_WORDS = new Set(['design','artwork','making']);
// A tag counts as "process-only" if every word in it is one of these —
// legitimate on its own (a couple of these are genuinely useful, like
// "laser cut file"), but 4+ of them eating 13 slots is redundant, not reach.
const PROCESS_ONLY_WORDS = new Set(['cnc','plasma','laser','cutting','cut','file','files','svg','dxf','png','pdf','eps']);

const KNOWN_PLACE_PHRASES = [
  'alabama','alaska','arizona','arkansas','california','colorado','connecticut','delaware','florida','georgia','hawaii','idaho','illinois','indiana','iowa','kansas','kentucky','louisiana','maine','maryland','massachusetts','michigan','minnesota','mississippi','missouri','montana','nebraska','nevada','new hampshire','new jersey','new mexico','new york','north carolina','north dakota','ohio','oklahoma','oregon','pennsylvania','rhode island','south carolina','south dakota','tennessee','texas','utah','vermont','virginia','washington','west virginia','wisconsin','wyoming','district of columbia',
  'alberta','british columbia','manitoba','new brunswick','newfoundland and labrador','nova scotia','ontario','prince edward island','quebec','saskatchewan','northwest territories','nunavut','yukon'
].sort((a,b)=>b.length-a.length);

function normalizeTagText(v){
  return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}

function tagIdentityWords(v){
  return normalizeTagText(v).split(' ').filter(w=>w.length>2 && !TAG_NON_SUBJECT_WORDS.has(w));
}

// Reduce a word to a crude stem so obvious variants of the same subject
// match each other. Without this, a listing whose trusted subject is
// "farmer" rejects the perfectly good tags "farm sign" and "farming sign"
// purely because the strings differ — the exact bug this fixes.
// Controlled word-family matching. Blind suffix-stripping was wrong in
// both directions: it collapsed box/boxer (a container and a dog breed)
// while still failing horse/horses, pony/ponies and butterfly/butterflies.
// This uses explicit, safe morphology instead — and every place that
// compares words uses THIS, so a word can't pass one check and fail another.
const WORD_FAMILY_GROUPS = [
  ['farm','farms','farmer','farmers','farming','farmhouse'],
  ['horse','horses','pony','ponies','equine'],
  ['butterfly','butterflies'],
  ['sign','signs','signage'],
  ['skull','skulls'],
  ['flower','flowers','floral'],
  ['tree','trees'],
  ['deer','bucks','buck'],
  ['fish','fishing','fisherman'],
  ['hunt','hunting','hunter','hunters'],
  ['cow','cows','cattle'],
  ['dog','dogs','puppy','puppies'],
  ['cat','cats','kitten','kittens'],
  ['bird','birds'],
  ['angel','angels'],
  ['cross','crosses'],
  ['star','stars'],
  ['heart','hearts'],
  ['flag','flags'],
  ['truck','trucks'],
  ['tractor','tractors'],
  ['bee','bees'],
  ['leaf','leaves'],
  ['wolf','wolves'],
  ['mountain','mountains'],
  ['pumpkin','pumpkins'],
  ['ghost','ghosts'],
  ['witch','witches'],
  ['bat','bats'],
  ['snowflake','snowflakes'],
];
const WORD_FAMILY_MAP = (()=>{
  const m = {};
  WORD_FAMILY_GROUPS.forEach(group=>{ group.forEach(w=>{ m[w] = group[0]; }); });
  return m;
})();
// Only the genuinely safe regular plural is inferred for words not in an
// explicit family. Everything riskier (‑er, ‑ing, ‑ies) must be declared
// above, so no new false merges can appear on their own.
function tagStem(w){
  const s = String(w||'').toLowerCase();
  if(WORD_FAMILY_MAP[s]) return WORD_FAMILY_MAP[s];
  if(s.length>3 && s.endsWith('s') && !s.endsWith('ss')){
    // Words whose plural genuinely adds "es" (glasses, boxes, churches,
    // dishes, buzzes) vs. ordinary plurals that just add "s" (horses,
    // signs). Getting this wrong produced "glasse" and "dresse".
    const takesEs = /(sses|shes|ches|xes|zes)$/.test(s);
    const base = takesEs ? s.slice(0,-2) : s.slice(0,-1);
    return WORD_FAMILY_MAP[base] || base;
  }
  return s;
}
function tagStemSet(words){
  return new Set((words||[]).map(tagStem));
}
// Shared helper so every caller compares word families identically.
function wordsShareFamily(a, b){
  return tagStem(a) === tagStem(b);
}

// Trusted tag identity comes from the human-written title, explicit PK/SK,
// and research deliberately linked to this SKU. Legacy tags are never proof.
function buildTrustedTagContext(l){
  const titleText = normalizeTagText(l.oldTitle||'');
  const placePhrase = KNOWN_PLACE_PHRASES.find(p=>titleText.includes(p)) || '';
  const anchors = [];
  const addAnchor = raw=>{
    const phrase = normalizeTagText(raw);
    if(!tagIdentityWords(phrase).length) return;
    if(!anchors.some(a=>normalizeTagText(a)===phrase)) anchors.push(phrase);
  };

  if(placePhrase) addAnchor(placePhrase);
  if(l.pk) addAnchor(l.pk);
  String(l.sk||'').split(/[,;|]/).forEach(addAnchor);
  WB.keywordResearch.filter(k=>k.linkedSku===l.sku).slice(0,4).forEach(k=>addAnchor(k.keyword));

  // Preserve meaningful title clauses such as "North Dakota" and
  // "So God Made a Farmer". Previously a clause was DISCARDED ENTIRELY if
  // it contained more process words than subject words — which erased the
  // subject on titles like "Peeking Bigfoot Sign, CNC Plasma DXF Cut File"
  // (45 of 520 listings lost their subject this way). The ratio test was
  // the bug: strip the process vocabulary and keep whatever real subject
  // remains, however much process language surrounded it.
  String(l.oldTitle||'').replace(/\([^)]*\)/g,' ').split(/[,;:|\-]+/).forEach(clause=>{
    const clean = normalizeTagText(clause);
    if(!clean) return;
    const stripped = clean
      .replace(/\b(signs?|svg|dxf|dwg|png|jpg|pdf|eps|ai|files?|cutting|cut|ready|cnc|plasma|laser|xtool|cricut|glowforge|digital|download|instant)\b/g,' ')
      .replace(/\s+/g,' ').trim();
    // Keep it if ANY real subject word survived the strip.
    if(tagIdentityWords(stripped).length) addAnchor(stripped);
  });

  // A compact set prevents this safeguard from becoming keyword stuffing.
  const compactAnchors = [];
  anchors.forEach(a=>{
    const aw = new Set(tagIdentityWords(a));
    if(!aw.size) return;
    const duplicate = compactAnchors.some(existing=>{
      const ew = new Set(tagIdentityWords(existing));
      return Array.from(aw).every(w=>ew.has(w));
    });
    if(!duplicate && compactAnchors.length<6) compactAnchors.push(a);
  });

  return {
    namedPlace: placePhrase,
    identityPhrases: compactAnchors,
    subjectWords: Array.from(new Set(compactAnchors.flatMap(tagIdentityWords))),
    // These are house preferences, not Etsy rules and not proven — they
    // are passed to the model as guidance and surfaced as WARNINGS, never
    // as hard blocks. The place quota in particular is unsatisfiable for
    // names like "Northwest Territories" (21 chars, over Etsy's tag limit).
    suggestedSubjectTagCount: 4,
    suggestedPlaceTagCount: placePhrase ? 2 : 0,
    suggestedMaxProcessTags: 3,
    bannedFillerWords: Array.from(TAG_BANNED_FILLER_WORDS),
  };
}

function analyzeTagQuality(l, tags){
  const trusted = buildTrustedTagContext(l);
  // Subject vocabulary: real, specific words from the title and any
  // logged research — NOT the generic vocabulary, and NOT old tags,
  // which are unverified history, not confirmed evidence.
  const subjectWords = new Set(trusted.subjectWords);
  const subjectStems = tagStemSet(trusted.subjectWords);

  const blacklisted = [];
  const genericOnly = [];
  let subjectCount = 0;
  let processCount = 0;

  tags.forEach(rawTag=>{
    const tag = (rawTag||'').toLowerCase().trim();
    if(TAG_HARD_BLACKLIST.has(tag)) blacklisted.push(rawTag);
    const words = tag.split(/[^a-z0-9]+/).filter(Boolean);
    if(words.some(w=>TAG_BANNED_FILLER_WORDS.has(w))) blacklisted.push(rawTag);
    const hasSubject = words.some(w=>subjectWords.has(w) || subjectStems.has(tagStem(w)));
    const hasFormat = words.some(w=>TAG_FORMAT_WORDS.has(w));
    // Filler = names an activity/category with nothing specific attached —
    // neither a real subject word nor an actual product-type identifier.
    if(words.length && !hasSubject && !hasFormat) genericOnly.push(rawTag);
    if(hasSubject) subjectCount++;
    if(words.length && words.every(w=>PROCESS_ONLY_WORDS.has(w))) processCount++;
  });

  const normalizedTags = tags.map(normalizeTagText);
  const placeWords = tagIdentityWords(trusted.namedPlace);
  const placeTagCount = placeWords.length
    ? normalizedTags.filter(t=>placeWords.every(w=>t.split(' ').includes(w))).length
    : 0;
  const missingAnchors = trusted.identityPhrases.filter(anchor=>{
    const aw = tagIdentityWords(anchor);
    if(!aw.length) return false;
    const required = Math.min(2, aw.length);
    const awStems = aw.map(tagStem);
    return !normalizedTags.some(t=>{
      const tw = new Set(t.split(' '));
      const twStems = tagStemSet(Array.from(tw));
      // Match on the word OR its stem, so "farm"/"farming" count toward
      // an anchor built from "farmer".
      return aw.filter((w,i)=>tw.has(w) || twStems.has(awStems[i])).length>=required;
    });
  });

  return {
    blacklisted:Array.from(new Set(blacklisted)), genericOnly, subjectCount, processCount,
    placePhrase:trusted.namedPlace, placeTagCount,
    placeCoveragePass:!trusted.namedPlace || placeTagCount>=trusted.suggestedPlaceTagCount,
    missingAnchors,
    subjectRatio: tags.length ? subjectCount/tags.length : 0,
  };
}

// ============================================================
// THE SINGLE SHARED VALIDATOR. Previously two separately-written
// functions enforced different rules on different paths, so the same
// draft could pass in one place and fail in another.
//
// Request-aware: a tags-only generation validates tags + SKU + review
// status, and never fails because an unrequested title or description
// wasn't returned.
//
// Two severities:
//   BLOCKING  — objective, verifiable failures. Nothing is applied.
//   WARNING   — house preferences and judgment calls. Applied, but flagged.
// ============================================================
function validateDraft(l, draft, verifiedFacts, assembled, opts){
  opts = opts || {};
  const field = opts.field || null;              // null = full rewrite
  const wants = f => !field || field === f;
  const blocking = [];
  const warnings = [];

  // --- Response integrity: always checked, regardless of what was asked for
  if(draft.sku && l.sku && String(draft.sku).trim() !== String(l.sku).trim()){
    blocking.push(`returned SKU "${draft.sku}" doesn't match this listing (${l.sku}) — the model answered about the wrong item`);
  }
  if(draft.needsReview === true){
    blocking.push('the model flagged needsReview — it did not have enough verified information to work from');
  }

  // --- Title
  if(wants('title')){
    const title = (draft.title||'').trim();
    if(!title) blocking.push('no title returned');
    else {
      if(title.length>140) blocking.push(`title is ${title.length} characters — Etsy's hard limit is 140`);
      const words = title.split(/\s+/).filter(Boolean).length;
      if(words>15) warnings.push(`title is ${words} words (house guideline is 15 or fewer)`);
      const caps = (title.match(/\b[A-Z]{2,}\b/g)||[]);
      if(caps.length>3) warnings.push(`${caps.length} ALL-CAPS tokens (house guideline is 3 or fewer): ${caps.join(', ')}`);
    }
  }

  // --- Description
  if(wants('description')){
    if(assembled && assembled.needsReview){
      blocking.push(`description can't be assembled — missing required block data: ${(assembled.missingRequired||[]).join(', ')}`);
    } else {
      const desc = (assembled ? assembled.description : draft.description) || '';
      if(!desc.trim()) blocking.push('no description content returned');
    }
  }

  // --- Tags
  if(wants('tags')){
    const raw = Array.isArray(draft.tags) ? draft.tags : null;
    if(!raw) blocking.push('no tags array returned');
    else {
      const trimmed = raw.map(t=>String(t==null?'':t).trim());
      const empties = trimmed.filter(t=>!t).length;
      if(empties) blocking.push(`${empties} blank tag(s) returned`);
      if(trimmed.length!==13) blocking.push(`must be exactly 13 tags (got ${trimmed.length})`);
      const overLen = trimmed.filter(t=>t.length>20);
      if(overLen.length) blocking.push(`${overLen.length} tag(s) over Etsy's 20-character limit: ${overLen.map(t=>`"${t}" (${t.length})`).join(', ')}`);
      const seen = new Set(), dupes = new Set();
      trimmed.forEach(t=>{ const n = normalizeTagText(t); if(!n) return; if(seen.has(n)) dupes.add(t); seen.add(n); });
      if(dupes.size) blocking.push(`duplicate tags: ${Array.from(dupes).join(', ')}`);
      const underscored = trimmed.filter(t=>t.includes('_'));
      if(underscored.length) blocking.push(`tags must use natural spaces, not underscores: ${underscored.join(', ')}`);

      // Formats claimed in tags must actually be in the verified file package.
      const verifiedSet = new Set(((verifiedFacts&&verifiedFacts.formats)||[]).map(f=>String(f).toLowerCase().trim()));
      const claimedInTags = new Set();
      trimmed.forEach(t=>normalizeTagText(t).split(' ').forEach(w=>{ if(TAG_FORMAT_WORDS.has(w) && w!=='file' && w!=='files' && w!=='download') claimedInTags.add(w); }));
      const unverifiedFormats = Array.from(claimedInTags).filter(f=>!verifiedSet.has(f));
      if(unverifiedFormats.length) blocking.push(`tags claim file format(s) not verified for this listing: ${unverifiedFormats.join(', ')}`);

      // Quality signals — judgment calls, so they warn rather than block.
      if(trimmed.length && !empties){
        const a = analyzeTagQuality(l, trimmed);
        a.blacklisted.forEach(t=>warnings.push(`"${t}" reads as filler — consider replacing it with something specific to this design`));
        a.genericOnly.forEach(t=>warnings.push(`"${t}" has no subject or format word — may be too broad to earn its slot`));
        if(a.subjectCount < 4) warnings.push(`only ${a.subjectCount} tag(s) carry a subject identifier (house guideline is 4+)`);
        if(a.processCount > 3) warnings.push(`${a.processCount} tags are pure process/machine terms (house guideline is 3 or fewer)`);
        if(!a.placeCoveragePass) warnings.push(`"${a.placePhrase}" appears in ${a.placeTagCount} tag(s) (house guideline is ${buildTrustedTagContext(l).suggestedPlaceTagCount})`);
        a.missingAnchors.forEach(x=>warnings.push(`trusted identity "${x}" isn't covered by any tag`));
      }
    }
  }

  // Untraceable-word check spans title+tags, so only when either was requested.
  if(wants('title') || wants('tags')){
    const invented = findInventedWords(l, draft);
    if(invented.length) warnings.push(`${invented.length} word(s) couldn't be traced to the title or research: ${invented.join(', ')}`);
  }

  return { blocking, warnings, ok: blocking.length===0 };
}


async function draftWithAi(l, field){
  const btn = document.querySelector(field ? `[data-aigen="${field}"]` : '#draftWithAiBtn');
  const resultEl = document.getElementById(field ? `aiGenResult_${field}` : 'aiDraftResult');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.dataset.origText || btn.textContent; btn.textContent = 'Generating\u2026'; }
  if(resultEl) resultEl.innerHTML = '';
  const flashId = field ? `aiGenResult_${field}` : 'aiDraftResult';
  const flash = document.getElementById(flashId);
  const instructions = WB.meta.seoInstructionsV1Draft;
  if(!instructions || !instructions.trim()){
    if(flash) flash.innerHTML = `<div class="banner err"><span class="mono">⚠</span><span class="fill">No SEO instructions saved yet \u2014 set them on the Rules \u0026 Playbook tab first.</span></div>`;
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText; }
    return;
  }

  async function requestDraft(retryNote){
    const useTemplates = WB.meta.useDescriptionTemplates;
    const res = await fetch(AI_PROXY + '/draft-openai', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        sku: l.sku, oldTitle: l.oldTitle, currentTags: l.tags,
        keywordMatches: findKeywordMatches(l),
        tagContext: buildTrustedTagContext(l),
        notes: retryNote ? `${l.notes||''}\n\n${retryNote}`.trim() : l.notes,
        instructions, instructionVersion: 'v1-draft',
        researchVersion: WB.meta.seoResearchVersion || '',
        verifiedFacts: l.verifiedFacts, useTemplates,
        artworkDescription: l.artworkDescription || null,
      }),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.message || data.error || `AI request failed (HTTP ${res.status})`);
    return data;
  }

  try{
    const data = await requestDraft(null);

    // One well-structured request, one charge. No automatic retry.
    // Everything is prepared and validated BEFORE anything is committed —
    // previously a failed tag set still rewrote the title and description,
    // so a "rejected" result silently changed the listing anyway.
    const useTemplates = WB.meta.useDescriptionTemplates;
    let assembled = null;
    if(useTemplates){
      assembled = assembleDescription(l, l.productType, WB.meta.descriptionTemplates, l.verifiedFacts, data.introText, data.useText);
    }
    const draftForChecks = { ...data, description: assembled ? assembled.description : data.description };

    const v = validateDraft(l, draftForChecks, l.verifiedFacts, assembled, { field });

    // Commit ALL requested fields together, or none of them.
    if(v.ok){
      l.aiInvented = findInventedWords(l, draftForChecks);
      if((!field || field==='title')) l.proposedTitle = data.title || l.proposedTitle;
      if((!field || field==='description')) l.description = (assembled ? assembled.description : data.description) || l.description;
      if((!field || field==='tags') && Array.isArray(data.tags)) l.tags = data.tags.map(t=>String(t).trim());
      await persistWorkbook();
    }
    renderDrawer(l);

    // renderDrawer() rebuilt the drawer — the element captured earlier is
    // now detached, so re-fetch before writing into it.
    const freshFlash = document.getElementById(flashId);
    if(freshFlash){
      if(!v.ok){
        freshFlash.innerHTML = `<div class="banner err" style="margin-bottom:8px;"><span class="mono">✗</span><span class="fill"><b>Rejected \u2014 nothing was changed, and no retry was charged.</b><br/>${v.blocking.map(escapeHtml).join('<br/>')}</span></div>`;
      } else if(v.warnings.length){
        freshFlash.innerHTML = `<div class="banner warn" style="margin-bottom:8px;"><span class="mono">!</span><span class="fill"><b>Applied, with notes worth reading:</b><br/>${v.warnings.map(escapeHtml).join('<br/>')}</span></div>`;
      } else {
        freshFlash.innerHTML = `<div class="banner ok" style="margin-bottom:8px;"><span class="mono">✓</span><span class="fill">Applied \u2014 passed every check. Still worth reading before you push.</span></div>`;
      }
    }
  }catch(e){
    // Same staleness risk doesn't apply here — no renderDrawer() has run
    // in the error path, so resultEl (captured at the very top) is still
    // a real, attached node. Re-fetching anyway costs nothing and removes
    // any doubt.
    const errEl = document.getElementById(flashId) || resultEl;
    if(errEl) errEl.innerHTML = `<div class="banner err" style="margin-bottom:8px;"><span class="mono">⚠</span><span class="fill">Request failed: ${escapeHtml(e.message)}</span></div>`;
  }finally{
    const b = document.querySelector(field ? `[data-aigen="${field}"]` : '#draftWithAiBtn');
    if(b){ b.disabled = false; b.textContent = b.dataset.origText || '\u2726 Generate with AI'; }
  }
}

let kwState = { search:'', pendingResult:null, pendingSku:null, batchPreview:null };

// ============================================================
// KEYWORD RESEARCH — the one true schema and the one true upsert logic.
// Every save path (manual entry, screenshot read, bulk import) goes
// through this, so "what counts as the same keyword" and "what counts as
// newer research" are answered exactly once, not reimplemented per path.
// ============================================================
function normalizeKeyword(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
}
// Adds a new entry, or updates an existing one IF the incoming research is
// dated the same day or later. Never creates a second row for the same
// normalized keyword. Returns which of the three happened, for reporting.
// ============================================================
// BULK KEYWORD RESEARCH IMPORT — a compiled JSON file, previewed before
// anything is written. Reuses the exact same upsert logic as manual entry
// and screenshot-read, so "same keyword" and "newer research" mean the
// same thing everywhere in the app, not just here.
// ============================================================
function previewKeywordBatch(rows){
  // Same reserved-prefix guard as every other importer in this app: a
  // template file can never be mistaken for real data. Whole file refused,
  // nothing partial applied, if any row trips it.
  const sampleFlagged = rows.filter(r=>String(r.keyword||'').toUpperCase().startsWith(RESERVED_SAMPLE_PREFIX));
  if(sampleFlagged.length){
    return { ok:false, message:`This file still has ${sampleFlagged.length} example row(s) (keyword starts with "${RESERVED_SAMPLE_PREFIX}"). Nothing was imported. Delete these and re-upload: ${sampleFlagged.slice(0,10).map(r=>r.keyword).join(', ')}${sampleFlagged.length>10?'…':''}` };
  }

  const buckets = { added:[], updated:[], unchanged:[], rejected:[], duplicate:[] };
  const seenInFile = new Set();
  const existingByNorm = {}; WB.keywordResearch.forEach(k=>existingByNorm[k.keywordNormalized]=k);

  rows.forEach(row=>{
    const norm = normalizeKeyword(row.keyword);
    if(!norm){ buckets.rejected.push({ row, reason:'Missing or empty keyword.' }); return; }
    if(seenInFile.has(norm)){ buckets.duplicate.push({ row, reason:'Same keyword appears more than once in this file — only the first occurrence is used.' }); return; }
    seenInFile.add(norm);

    const existing = existingByNorm[norm];
    if(!existing){ buckets.added.push({ row, norm }); return; }
    const incomingDate = row.dateResearched || '';
    const existingDate = existing.dateResearched || '';
    if(incomingDate && incomingDate >= existingDate){ buckets.updated.push({ row, norm, existingDate }); }
    else { buckets.unchanged.push({ row, norm, reason: incomingDate ? `Existing record (${existingDate}) is the same age or newer.` : 'No research date on the incoming row.' }); }
  });

  return { ok:true, buckets };
}
async function applyKeywordBatch(buckets){
  buckets.added.concat(buckets.updated).forEach(({row})=>{
    upsertKeywordResearch({
      keyword: row.keyword, searches: row.searches ?? null, trend: row.trend ?? null,
      searchResults: row.searchResults ?? null, conversion: row.conversion ?? null,
      relatedTerms: row.relatedTerms ?? null, source: row.source ?? null,
      dateResearched: row.dateResearched ?? null, linkedSku: row.linkedSku ?? null,
      notes: row.notes ?? null,
    });
  });
  await persistWorkbook();
}

function upsertKeywordResearch(entry){
  const norm = normalizeKeyword(entry.keyword);
  if(!norm) return 'rejected';
  const existing = WB.keywordResearch.find(k=>k.keywordNormalized===norm);
  const record = {
    keyword: entry.keyword.trim(), keywordNormalized: norm,
    searches: entry.searches ?? null, trend: entry.trend ?? null,
    searchResults: entry.searchResults ?? null, conversion: entry.conversion ?? null,
    relatedTerms: entry.relatedTerms ?? null, source: entry.source ?? null,
    dateResearched: entry.dateResearched ?? null,
    linkedSku: entry.linkedSku ?? null, notes: entry.notes ?? null,
  };
  if(!existing){
    WB.keywordResearch.push(record);
    return 'added';
  }
  const incomingDate = entry.dateResearched || '';
  const existingDate = existing.dateResearched || '';
  if(incomingDate && incomingDate >= existingDate){
    Object.assign(existing, record);
    return 'updated';
  }
  return 'unchanged';
}

  const log = WB.keywordResearch.slice().sort((a,b)=> (b.dateResearched||'').localeCompare(a.dateResearched||''));
  const filtered = kwState.search ? log.filter(k=>k.keyword.toLowerCase().includes(kwState.search.toLowerCase())) : log;

  let html = `<div class="section-note">Etsy doesn't expose Marketplace Insights through the API, so import happens by screenshot \u2014 upload the page as you actually see it in Shop Manager, and it's read and logged automatically.</div>`;

  html += `<div class="section-title"><span class="left">Import a compiled research file</span></div>`;

  </div>`;

  if(kwState.batchPreview){

      ['rejected','Rejected \u2014 missing keyword','red'],
    ];
    html += `<div class="section-title"><span class="left">Preview</span></div>`;
    html += `<div class="grid grid-4" style="margin-bottom:16px;">` + bucketMeta.map(([k,label])=>`
      <div class="card"><div class="k">${label.toUpperCase()}</div><div class="v">${b.buckets[k].length}</div></div>`).join('') + `</div>`;

        <tbody>${b.buckets[k].slice(0,50).map(x=>`<tr><td>${escapeHtml(x.row.keyword||'(no keyword)')}</td><td class="small">${escapeHtml(x.reason||'')}</td></tr>`).join('')}</tbody>
      </table></div>`;
    });
    const applyCount = b.buckets.added.length + b.buckets.updated.length;
    html += `<button class="btn primary" id="kwBatchApplyBtn" ${applyCount===0?'disabled':''}>Apply \u2014 write ${applyCount} record(s)</button>

    html += `<div class="section-title"><span class="left">Review what was read</span></div>`;

      <thead><tr><th></th><th>Term</th><th>Searches</th><th>Trend</th><th>Search results</th><th>Conversion</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr style="${r.isPrimary?'background:var(--panel-3);':''}">
        <td><input type="checkbox" data-kwrow="${i}" ${r.selected?'checked':''}/></td>
        <td>${r.isPrimary?'<b>':''}${escapeHtml(r.term||'')}${r.isPrimary?' (searched)</b>':''}</td>
        <td class="small">${escapeHtml(String(r.searches??''))}</td>
        <td class="small">${escapeHtml(r.trend||'')}</td>
        <td class="small">${escapeHtml(String(r.searchResults??''))}</td>
        <td class="small">${escapeHtml(r.conversion||'')}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <button class="btn primary" id="kwSaveSelectedBtn">Save selected to log</button>
    <button class="btn" id="kwDiscardBtn">Discard</button>`;
  }

  html += `<div class="section-title" style="margin-top:30px;"><span class="left">This week's research queue (${queue.length})</span></div>`;
  html += `<div class="section-note" style="margin-bottom:10px;">Candidates to check next time you're in Marketplace Insights \u2014 plan them here so lookups are deliberate, not reactive.</div>`;
  html += `<div class="priority-list" style="margin-bottom:14px;">`;
  html += queue.map((q,i)=>`
    <div class="priority-row" style="border-left-color:var(--steel); cursor:default;">
      <span class="title">${escapeHtml(q.keyword)}</span>
      <span class="sku" style="width:auto;">${escapeHtml(q.addedFrom||'')}</span>
      <button class="btn danger" style="padding:5px 10px; font-size:11px;" data-rm-queue="${i}">Remove</button>
    </div>`).join('');
  html += queue.length ? '' : `<div class="empty-hint">Queue is empty.</div>`;
  html += `</div>`;
  html += `<div class="row2" style="max-width:500px; margin-bottom:24px;">
    <div class="field" style="margin-bottom:0;"><input type="text" id="newQueueKw" placeholder="Add a keyword to plan for later"/></div>
    <button class="btn" id="addQueueBtn" style="height:38px;">Add to queue</button>
  </div>`;

  html += `<div class="section-title"><span class="left">Log a result manually</span></div>`;
  html += `<div class="section-note">For when you don't have a screenshot handy \u2014 typing in one result at a time.</div>`;
  html += `<div class="card" style="max-width:640px;">
    <div class="row2">
      <div class="field"><label>Keyword</label><input type="text" id="kwKeyword"/></div>
      <div class="field"><label>Linked SKU (optional)</label><input type="text" id="kwSku" placeholder="e.g. 0011"/></div>
    </div>
    <div class="row2">
      <div class="field"><label>Searches</label><input type="text" id="kwSearches"/></div>
      <div class="field"><label>Search results</label><input type="text" id="kwListings"/></div>
    </div>
    <div class="row2">
      <div class="field"><label>Conversion</label>
        <select id="kwConversion">
          <option value="">\u2014</option>
          <option>Very high</option><option>High</option><option>Typical</option><option>Low</option><option>Very low</option>
        </select>
      </div>
      <div class="field"><label>Notes</label><input type="text" id="kwNotes" placeholder="optional"/></div>
    </div>
    <button class="btn primary" id="saveKwBtn">Save to log</button>
  </div>`;

  html += `<div class="section-title"><span class="left">Research log (${log.length})</span></div>`;
  html += `<div class="toolbar"><input class="search" id="kwSearchInput" placeholder="Search past keywords\u2026" value="${escapeHtml(kwState.search)}"/></div>`;
  html += `<div class="card-scroll"><table class="simple-table">
    <thead><tr><th>Date</th><th>Term</th><th>Searches</th><th>Trend</th><th>Results</th><th>Conversion</th><th>SKU</th></tr></thead>
    <tbody>${filtered.map(k=>`<tr>
      <td class="small">${k.dateResearched||''}</td><td>${escapeHtml(k.keyword)}</td>
      <td class="small">${k.searches??''}</td><td class="small">${escapeHtml(k.trend||'')}</td><td class="small">${k.searchResults??''}</td>
      <td class="small">${escapeHtml(k.conversion||'')}</td>
      <td class="small">${k.linkedSku?`<a href="#" data-open="${k.linkedSku}" style="color:var(--steel)">${k.linkedSku}</a>`:''}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="small">Nothing logged yet.</td></tr>'}</tbody>
  </table></div>`;

  document.getElementById('content').innerHTML = html;

  document.getElementById('kwBatchPreviewBtn').addEventListener('click', async ()=>{
    const file = document.getElementById('kwBatchInput').files[0];
    const flash = document.getElementById('kwBatchFlash');
    if(!file){ flash.className='result-flash show err'; flash.textContent='Choose a file first.'; return; }
    let rows;
    try{
      rows = JSON.parse(await file.text());
      if(!Array.isArray(rows)) throw new Error('not a list');
    }catch(e){ flash.className='result-flash show err'; flash.textContent="That file isn't valid JSON, or isn't a list of rows."; return; }
    const r = previewKeywordBatch(rows);
    if(!r.ok){ flash.className='result-flash show err'; flash.textContent=r.message; return; }
    kwState.batchPreview = r;
    flash.className = '';
    renderKeywords();
  });
  const batchApplyBtn = document.getElementById('kwBatchApplyBtn');
  if(batchApplyBtn) batchApplyBtn.addEventListener('click', async ()=>{
    const applyCount = kwState.batchPreview.buckets.added.length + kwState.batchPreview.buckets.updated.length;
    await applyKeywordBatch(kwState.batchPreview.buckets);
    kwState.batchPreview = null;
    render();
    alert(`Applied — ${applyCount} record(s) written to the research log.`);
  });
  const batchDiscardBtn = document.getElementById('kwBatchDiscardBtn');
  if(batchDiscardBtn) batchDiscardBtn.addEventListener('click', ()=>{
    kwState.batchPreview = null; renderKeywords();
  });
  document.getElementById('kwAnalyzeBtn').addEventListener('click', async ()=>{
    const fileInput = document.getElementById('kwImageInput');
    const file = fileInput.files[0];
    const flash = document.getElementById('kwAnalyzeFlash');
    if(!file){ flash.className='result-flash show err'; flash.textContent='Choose a screenshot or PDF first.'; return; }
    const btn = document.getElementById('kwAnalyzeBtn');
    btn.disabled = true; btn.textContent = 'Reading\u2026';
    flash.className = '';
    try{
      const base64 = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = ()=> res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name||'');
      const resp = await fetch(AI_PROXY + '/parse-keywords', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ image: base64, mediaType: isPdf ? 'application/pdf' : (file.type || 'image/png') }),
      });
      const data = await resp.json();
      if(!resp.ok || data.error) throw new Error(data.error || `HTTP ${resp.status}`);
      kwState.pendingResult = data;
      kwState.pendingSku = document.getElementById('kwImageSku').value.trim() || null;
      renderKeywords();
      // renderKeywords() just rebuilt the whole tab — the old button/flash
      // references above are now detached. Re-fetch fresh ones before
      // touching them, or this silently writes into nothing (the exact bug
      // just fixed in the drafting flow).
      const freshBtn = document.getElementById('kwAnalyzeBtn');
      if(freshBtn){ freshBtn.disabled = false; freshBtn.textContent = 'Read this file'; }
    }catch(e){
      const freshFlash = document.getElementById('kwAnalyzeFlash') || flash;
      freshFlash.className = 'result-flash show err';
      freshFlash.textContent = 'Could not read that file: ' + e.message;
      const freshBtn = document.getElementById('kwAnalyzeBtn') || btn;
      freshBtn.disabled = false; freshBtn.textContent = 'Read this file';
    }
  });

  const saveSelBtn = document.getElementById('kwSaveSelectedBtn');
  if(saveSelBtn) saveSelBtn.addEventListener('click', async ()=>{
    const pr = kwState.pendingResult;
    const rows = [{...pr.primaryTerm, isPrimary:true}].concat((pr.similarTerms||[]).map(t=>({...t, isPrimary:false})));
    let added = 0;
    rows.forEach((r,i)=>{
      const cb = document.querySelector(`[data-kwrow="${i}"]`);
      if(!cb || !cb.checked || !r.term) return;
      upsertKeywordResearch({
        keyword: r.term, searches: r.searches ?? null, trend: r.trend ?? null,
        searchResults: r.searchResults ?? null, conversion: r.conversion || null,
        relatedTerms: null,
        source: r.isPrimary ? 'Searched term' : ((pr.primaryTerm && pr.primaryTerm.term) || null),
        dateResearched: todayISO, linkedSku: kwState.pendingSku, notes: null,
      });
      added++;
    });
    kwState.pendingResult = null; kwState.pendingSku = null;
    await persistWorkbook();
    render();
    alert(`Saved ${added} term(s) to the research log.`);
  });
  const discardBtn = document.getElementById('kwDiscardBtn');
  if(discardBtn) discardBtn.addEventListener('click', ()=>{
    kwState.pendingResult = null; kwState.pendingSku = null; renderKeywords();
  });

  document.getElementById('addQueueBtn').addEventListener('click', async ()=>{
    const v = document.getElementById('newQueueKw').value.trim();
    if(!v) return;
    WB.keywordQueue.push({ keyword:v, addedFrom:'manual', addedDate: todayISO });
    await persistWorkbook(); renderKeywords(); renderNav();
  });
  document.querySelectorAll('[data-rm-queue]').forEach(b=> b.addEventListener('click', async ()=>{
    WB.keywordQueue.splice(+b.dataset.rmQueue,1);
    await persistWorkbook(); renderKeywords(); renderNav();
  }));
  document.getElementById('saveKwBtn').addEventListener('click', async ()=>{
    const keyword = document.getElementById('kwKeyword').value.trim();
    if(!keyword) return;
    upsertKeywordResearch({
      keyword,
      searches: document.getElementById('kwSearches').value.trim() || null,
      trend: null,
      searchResults: document.getElementById('kwListings').value.trim() || null,
      conversion: document.getElementById('kwConversion').value || null,
      relatedTerms: null, source: 'Manual entry',
      dateResearched: todayISO,
      linkedSku: document.getElementById('kwSku').value.trim() || null,
      notes: document.getElementById('kwNotes').value.trim() || null,
    });
    const fromQueueIdx = document.getElementById('kwKeyword').dataset.fromQueueIdx;
    if(fromQueueIdx !== undefined && fromQueueIdx !== ''){ WB.keywordQueue.splice(+fromQueueIdx,1); }
    await persistWorkbook(); renderKeywords(); renderNav();
  });
  document.getElementById('kwSearchInput').addEventListener('input', e=>{
    kwState.search = e.target.value; renderKeywords();
    const el = document.getElementById('kwSearchInput');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  document.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', (e)=>{ e.preventDefault(); openDrawer(el.dataset.open); }));
}

      <td class="small">${c.liveDate||''}</td><td class="small">${escapeHtml(c.infographic||'')}</td>

// NEEDS ATTENTION
// ============================================================
function attnCard(title, items, renderRow, opts){
  if(!items.length) return '';
  opts = opts || {};
  const cat = opts.category;
  const keyFn = opts.keyFn || (x=>x.sku);
  const allKeys = cat ? items.map(x=>keyFn(x)).join(',') : '';
  return `<div class="attn-card ${opts.isWarn?'warn':''}">
    <div class="attn-head">
      <span class="attn-title">${title}</span>
      <span style="display:flex; align-items:center; gap:10px;">
        <span class="attn-count">${items.length}</span>
        ${cat ? `<button class="copy-btn" data-dismissall="${cat}" data-dismissallkeys="${escapeHtml(allKeys)}">Clear all</button>` : ''}
      </span>
    </div>
    <div class="attn-list">${items.map(x=>{
      const row = renderRow(x);
      if(!cat) return row;
      return `<div style="display:flex; align-items:center; gap:8px;">${row}<button class="copy-btn" data-dismissone="${cat}" data-dismissonekey="${escapeHtml(String(keyFn(x)))}" style="flex-shrink:0;">Clear</button></div>`;
    }).join('')}</div>
  </div>`;
}
function renderAttention(){
  const i = attentionIssues();
  const total = attentionCount();
  let html = '';
  if(i.stale){
    html += `<div class="banner warn"><span class="mono">⚠</span><span class="fill">No workbook has been imported this session — everything below is checked against the seed snapshot only.</span><button id="attnImportBtn">Import workbook</button></div>`;
  }
  if(total===0 && !i.stale){
    html += `<div class="banner ok"><span class="mono">✓</span><span class="fill">No inconsistencies found. Records agree.</span></div>`;
  }
  // SKU problems come first — everything else in the app matches on SKU,
  // so a listing without one is invisible to every other feature.
  if(i.missingSku.length){
    html += `<div class="attn-card">
      <div class="attn-head">
        <span class="attn-title">Listings on Etsy with no SKU</span>
        <span style="display:flex; align-items:center; gap:10px;">
          <span class="attn-count">${i.missingSku.length}</span>
          <button class="copy-btn" data-dismissall="missingSku" data-dismissallkeys="${escapeHtml(i.missingSku.map(m=>m.listingId||m.title).join(','))}">Clear all</button>
        </span>
      </div>
      <div class="section-note" style="margin:4px 0 10px 0;">These can't be tracked, added to a project, or pushed to — the app has nothing to match them on. Set a SKU on each in Etsy, then run Import listings from Etsy again.</div>
      <div class="attn-list">
        ${i.missingSku.map(m=>`<div style="display:flex; align-items:center; gap:8px;"><div class="row" style="flex:1;"><span>${escapeHtml(m.title)}${m.state && m.state!=='active'?` <span class="badge notreviewed">${escapeHtml(m.state)}</span>`:''}</span>${m.url?`<a href="${escapeHtml(m.url)}" target="_blank" style="color:var(--steel); font-family:'IBM Plex Mono',monospace; font-size:11px;">open on Etsy</a>`:''}</div><button class="copy-btn" data-dismissone="missingSku" data-dismissonekey="${escapeHtml(String(m.listingId||m.title))}">Clear</button></div>`).join('')}
      </div>
    </div>`;
  }
  if((i.skuDupes||[]).length){
    html += `<div class="attn-card">
      <div class="attn-head">
        <span class="attn-title">SKUs used on more than one listing</span>
        <span style="display:flex; align-items:center; gap:10px;">
          <span class="attn-count">${i.skuDupes.length}</span>
          <button class="copy-btn" data-dismissall="skuDupes" data-dismissallkeys="${escapeHtml(i.skuDupes.map(d=>d.sku).join(','))}">Clear all</button>
        </span>
      </div>
      <div class="section-note" style="margin:4px 0 10px 0;">Only one listing per SKU can be tracked — the others are silently dropped on import. Make each SKU unique in Etsy, then import again.</div>
      <div class="attn-list">
        ${i.skuDupes.map(d=>`<div style="display:flex; align-items:center; gap:8px;"><div class="row" style="flex:1; display:block;">${d.titles.map(t=>`<div><span><b style="color:var(--ink)">${escapeHtml(d.sku)}</b> &nbsp; ${escapeHtml(typeof t==='string'?t:t.title)}</span>${(typeof t==='object'&&t.url)?`<a href="${escapeHtml(t.url)}" target="_blank" style="color:var(--steel); font-family:'IBM Plex Mono',monospace; font-size:11px;">open on Etsy</a>`:''}</div>`).join('')}</div><button class="copy-btn" data-dismissone="skuDupes" data-dismissonekey="${escapeHtml(d.sku)}">Clear</button></div>`).join('')}
      </div>
    </div>`;
  }
  html += attnCard(`Missing ${(WB.meta.infographicLabel||'infographic').toLowerCase()} decision`, i.missingInfographic, l=>`<div class="row" data-open="${l.sku}"><span>${l.sku} — ${escapeHtml(l.oldTitle)} <span class="section-note" style="display:inline;">(no DONE/NOT NEEDED decision recorded)</span></span><span>open →</span></div>`, {category:'missingInfographic'});
  html += attnCard('Missing or invalid tags', i.badTags, l=>{
    const reasons = [];
    if(l.tags.length!==13) reasons.push(`${l.tags.length}/13 tags`);
    const overLen = l.tags.filter(t=>t.length>20);
    if(overLen.length) reasons.push(`${overLen.length} tag${overLen.length===1?'':'s'} over 20 chars`);
    return `<div class="row" data-open="${l.sku}"><span>${l.sku} — ${escapeHtml(l.oldTitle)} <span class="section-note" style="display:inline;">(${reasons.join(', ')})</span></span><span>open →</span></div>`;
  }, {category:'badTags'});
  html += attnCard('Draft not pushed live', i.draftNotLive, l=>`<div class="row" data-open="${l.sku}"><span>${l.sku} — ${escapeHtml(l.oldTitle)} <span class="section-note" style="display:inline;">(status: ${escapeHtml(l.status||'DRAFT')} — content is written but never pushed to Etsy)</span></span><span>open →</span></div>`, {category:'draftNotLive'});
  html += attnCard('Updated without closeout entry', i.updatedNoCloseout, l=>`<div class="row" data-open="${l.sku}"><span>${l.sku} — ${escapeHtml(l.oldTitle)} <span class="section-note" style="display:inline;">(marked ${escapeHtml(l.status||'UPDATED')} on Etsy, but no session-closeout record exists for it)</span></span><span>open →</span></div>`, {category:'updatedNoCloseout'});
  html += attnCard('Closeout without Completion Check', i.closeoutNoCompletion, c=>`<div class="row"><span>${c.sku} — ${escapeHtml(c.listing)} <span class="section-note" style="display:inline;">(closed out on ${c.workDate}, but never got a Completion Check audit record)</span></span><span>${c.workDate}</span></div>`, {category:'closeoutNoCompletion', keyFn:c=>c.sku+'|'+c.workDate});
  html += attnCard('Etsy shows recent edits, still marked Not Reviewed here', i.externallyChanged, l=>{
    const detail = (l.externalChangeDetail||[]).map(d=>`<b style="color:var(--ink)">${escapeHtml(d.field)}</b>: ${escapeHtml(d.from)} \u2192 ${escapeHtml(d.to)}`).join('<br/>');
    return `<div class="row" data-open="${l.sku}" style="align-items:flex-start;">
      <span>${l.sku} — ${escapeHtml(l.oldTitle)}
        <span class="section-note" style="display:block; margin-top:3px;">${detail || `Etsy shows a change ${l.etsyLastModified?etsyDaysAgo(l.etsyLastModified):'recently'} that this app hasn't reconciled`}</span>
      </span>
      <span>${l.etsyLastModified?etsyDaysAgo(l.etsyLastModified):''} →</span>
    </div>`;
  }, {isWarn:true, category:'externallyChanged'});

  if(!html) html = `<div class="empty-hint">Nothing to show.</div>`;
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=> openDrawer(el.dataset.open)));
  const impBtn = document.getElementById('attnImportBtn'); if(impBtn) impBtn.addEventListener('click', triggerImport);
  document.querySelectorAll('[data-dismissone]').forEach(b=> b.addEventListener('click', async (e)=>{
    e.stopPropagation();
    await dismissAttnItem(b.dataset.dismissone, b.dataset.dismissonekey);
    renderAttention(); renderNav();
  }));
  document.querySelectorAll('[data-dismissall]').forEach(b=> b.addEventListener('click', async ()=>{
    const keys = (b.dataset.dismissallkeys||'').split(',').filter(Boolean);
    if(!keys.length) return;
    if(!confirm(`Clear all ${keys.length} item(s) in this category? They won't show here again unless the underlying issue changes.`)) return;
    await dismissAttnAll(b.dataset.dismissall, keys);
    renderAttention(); renderNav();
  }));
}

// PERFORMANCE — appended daily log, not overwritten
// ============================================================
function renderStats(){
  const b7 = WB.baselines.find(b=>b.period==='Last 7 days');
  const b30 = WB.baselines.find(b=>b.period==='Last 30 days');
  const capturedToday = WB.viewSnapshots.some(v=>v.date===todayISO);
  const totalTracked = new Set(WB.viewSnapshots.map(v=>v.sku)).size;
  const snapshotDays = new Set(WB.viewSnapshots.map(v=>v.date)).size;

  let html = `<div class="section-title"><span class="left">Per-listing views &amp; favorites</span></div>
  <div class="section-note">Etsy's API only ever returns lifetime totals — never a date range. So this builds real history by snapshotting those totals once a day: the difference between two days is that day's actual activity. It runs by itself when you open the app, so nothing is draining your phone in the background.</div>`;
  html += `<div class="banner ${capturedToday?'ok':'warn'}">
    <span class="mono">${capturedToday?'✓':'i'}</span>
    <span class="fill">${capturedToday
      ? `Captured today. <b>${totalTracked}</b> listing${totalTracked===1?'':'s'} tracked across <b>${snapshotDays}</b> day${snapshotDays===1?'':'s'} of history.`
      : `Not captured yet today.${totalTracked?` <b>${totalTracked}</b> listing${totalTracked===1?'':'s'} tracked so far.`:''}`}</span>
    <button id="captureViewsBtn">Capture now</button>
  </div>`;
  html += `<div class="result-flash" id="captureFlash"></div>`;

  const vsBytes = JSON.stringify(WB.viewSnapshots).length;
  const vsDatesSorted = WB.viewSnapshots.map(v=>v.date).sort();
  const oldestVs = vsDatesSorted[0];
  html += `<div class="section-title"><span class="left">View snapshot storage</span></div>
  <div class="section-note">One row is appended per tracked listing on every capture — this is what fills up local storage fastest. Trim it here if the "storage full" warning shows up; it won't touch anything else in the workbook.</div>`;
  html += `<div class="card" style="max-width:520px;">
    <div class="k">${WB.viewSnapshots.length} snapshot row${WB.viewSnapshots.length===1?'':'s'}${oldestVs?` · oldest ${oldestVs}`:''} · ~${(vsBytes/1024).toFixed(0)} KB</div>
    <div class="row2" style="margin-top:10px; align-items:end;">
      <div class="field"><label>Keep last</label>
        <select id="clearSnapshotsDays">
          <option value="30">30 days</option>
          <option value="60">60 days</option>
          <option value="90" selected>90 days</option>
          <option value="180">180 days</option>
        </select>
      </div>
      <button class="btn danger" id="clearOldSnapshotsBtn" ${WB.viewSnapshots.length?'':'disabled'}>Clear older than this</button>
    </div>
    <button class="btn danger" id="clearAllSnapshotsBtn" style="margin-top:10px;" ${WB.viewSnapshots.length?'':'disabled'}>Clear all view snapshot history</button>
    <div class="result-flash" id="clearSnapshotsFlash"></div>
  </div>`;

  html += `<div class="section-title"><span class="left">Shop baselines</span></div>
  <div class="section-note">Current baseline shown below. Log a snapshot to keep daily history instead of overwriting.</div>`;
  html += `<div class="grid grid-2">${[b7,b30].filter(Boolean).map(periodCard).join('')}</div>`;

  });
  const clearAllBtn = document.getElementById('clearAllSnapshotsBtn');
  if(clearAllBtn) clearAllBtn.addEventListener('click', async ()=>{

    const f = document.getElementById('clearSnapshotsFlash');
    f.className = 'result-flash show ok';

  });
}

function buildRulesFromAnswers(a){
  const lines = [];
  lines.push(`Title: Structure the title around ${a.product || 'the product'}. Open with the strongest accurate buyer phrase, not a file-type announcement. Generally 15 words or fewer. ${a.platforms ? `Mention ${a.platforms} when truthfully applicable.` : ''} Never add an audience, tool, or use-case term unless it's genuinely accurate for this specific item.`);
  lines.push(`Tags: Exactly 13 tags on Etsy, each 20 characters or fewer. Cover distinct buckets — exact identity, a truthful alternate name a buyer might search, product/material form${a.platforms ? ', the platforms/tools it works with' : ''}, and a real occasion/use intent if relevant. No near-duplicates or padding.`);
  if(a.openingLine){
    lines.push(`Description — required opening line, exact: "${a.openingLine}" Then identify the specific item and what the buyer gets, using the primary keyword naturally and early.`);
  } else {
    lines.push(`Description: open with a natural, specific sentence identifying this exact item and what the buyer gets — not a generic template line, and not a tag dump.`);
  }
  const factsList = [];
  if(a.materials) factsList.push(`materials/formats actually included (${a.materials})`);
  if(a.neverMention) factsList.push(`never mention: ${a.neverMention}`);
  lines.push(`Description — required facts: state what it actually is, ${factsList.length ? factsList.join('; ') : 'only true, listing-specific facts'}, and any policy that's genuinely true for this item (returns, personalization, license).`);
  lines.push(`Never do: Never invent a material, dimension, compatibility, or use case that wasn't actually given. Never treat keyword stuffing as SEO — every tag and phrase must be something the product actually earns.`);
  return lines.join('\n\n');
}

// Loads a prepared batch of drafted listings into matching SKUs. Accepts
// either the original JSON shape or a spreadsheet (.xlsx/.csv) with
// SKU/Title/Description/Tags columns — same "download a starter, edit it,
// re-upload" workflow as the bulk edit template button offers. Fills
// proposedTitle/description/tags only — never touches status, live date, or
// anything already recorded. Verification flags from the batch are carried
// in as blockers so they can't be pushed without being seen.
async function handleBatchImport(file){
  const isSpreadsheet = /\.(xlsx|xls|csv)$/i.test(file.name||'');
  let rows;
  if(isSpreadsheet){
    try{
      const buf = await file.arrayBuffer();
      const wbx = XLSX.read(buf, { type:'array' });
      const sheetRows = XLSX.utils.sheet_to_json(wbx.Sheets[wbx.SheetNames[0]], { defval:'' });
      rows = sheetRows.map(r=>({
        sku: String(r['SKU'] ?? r['Sku'] ?? r['sku'] ?? '').trim(),
        proposedTitle: String(r['Title'] ?? r['Proposed Title'] ?? '').trim(),
        description: String(r['Description'] ?? '').trim(),
        tags: String(r['Tags'] ?? '').split(',').map(t=>t.trim()).filter(Boolean),
      })).filter(r=>r.sku);
    }catch(e){ return { ok:false, message:'Could not read that spreadsheet: ' + e.message }; }
  } else {
    try{
      rows = JSON.parse(await file.text());
      if(!Array.isArray(rows)) throw new Error('not a list');
    }catch(e){ return { ok:false, message:'That file isn\'t a valid batch file.' }; }
  }

  const sampleRows = rows.filter(r=>String(r.sku||'').startsWith(RESERVED_SAMPLE_PREFIX));
  if(sampleRows.length){
    return {
      ok:false,
      message:`This file still has ${sampleRows.length} example row(s) from the template (SKU starts with "${RESERVED_SAMPLE_PREFIX}"). Nothing was imported. Delete these entries and re-upload: ${sampleRows.slice(0,10).map(r=>r.sku).join(', ')}${sampleRows.length>10?'…':''}`,
    };
  }

  const bySku = {}; WB.listings.forEach(l=>bySku[l.sku]=l);
  let matched=0, missing=[], flagged=0;
  const matchedSkus = [];
  rows.forEach(r=>{
    const sku = String(r.sku||'').padStart(4,'0');
    if(!r.sku) return;
    const l = bySku[sku];
    if(!l){ missing.push(sku); return; }
    if(r.proposedTitle) l.proposedTitle = r.proposedTitle;
    if(r.description) l.description = r.description;
    if(Array.isArray(r.tags) && r.tags.length) l.tags = r.tags;
    l.batchFlags = Array.isArray(r.flags) ? r.flags : [];
    l.batchVerified = false;
    if(l.batchFlags.length) flagged++;
    matched++;
    matchedSkus.push(sku);
  });

  const ok = await persistWorkbook();
  // Deliberately does NOT create or assign a project — batches don't know
  // what scope you actually want, and forcing "title only" every time was
  // exactly the problem. The caller shows an assignment step next: pick
  // an existing project, or create a new one with the right scope.
  if(ok && matched){
    projectState.pendingAssign = { skus: matchedSkus, sourceLabel: file.name.replace(/\.(json|xlsx|xls|csv)$/i,'') };
  }
  return {
    ok,
    matchedSkus,
    message: ok
      ? `Loaded ${matched} of ${rows.length} listings.${missing.length?` ${missing.length} SKU(s) weren't found in this shop: ${missing.slice(0,8).join(', ')}${missing.length>8?'…':''}.`:''}${flagged?` ${flagged} carry verification flags — shown as a warning when you push, not a requirement.`:''} Next: choose which project to add them to.`
      : 'Parsed the file but saving failed. Try again.',
  };
}

// Starter file for bulk editing: your real listings if you have any (so
// there's nothing to look up — just edit what you want changed and delete
// the rest of the rows), otherwise one clearly-fake example row using the
// same DEMO- prefix the import step refuses to accept as real data.

// ============================================================
// ETSY CONNECTION — OAuth 2.0 Authorization Code + PKCE.
// No shared secret is used or stored anywhere — PKCE means the
// keystring alone (a public identifier) is enough for this flow.
// Tokens live in this browser's storage only. If Etsy's API blocks
// browser-origin calls (CORS), the errors below will say so plainly
// instead of pretending to succeed.
// ============================================================
const ETSY_CLIENT_ID = '1yj1856zxupz5kjguxr8913m';
const ETSY_REDIRECT_URI = 'https://soft-hall-7798.kismetdesignfab.workers.dev';
// Etsy blocks direct browser calls to its token and API endpoints (CORS).
// This small relay Worker forwards those two calls server-to-server, where
// CORS doesn't apply, and hands the response straight back unmodified.
const ETSY_PROXY = 'https://kismet-etsy-proxy.kismetdesignfab.workers.dev';
const AI_PROXY = 'https://kismet-ai-proxy.kismetdesignfab.workers.dev';
const ETSY_SCOPES = 'listings_r listings_w shops_r';

let etsyAuth = null;       // { accessToken, refreshToken, expiresAt, userId, shopId, shopName } | { error }
let etsyTestResult = null; // last "Test connection" outcome, shown in the tab

function b64url(buf){
  let str = btoa(String.fromCharCode(...new Uint8Array(buf)));
  return str.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256(str){ return await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); }
function randomToken(len){
  const arr = new Uint8Array(len); crypto.getRandomValues(arr); return b64url(arr.buffer);
}

async function startEtsyAuth(){
  const verifier = randomToken(64);
  const state = randomToken(16);
  sessionStorage.setItem('etsy_verifier', verifier);
  sessionStorage.setItem('etsy_state', state);
  const challenge = b64url(await sha256(verifier));
  const params = new URLSearchParams({
    response_type:'code', client_id:ETSY_CLIENT_ID, redirect_uri:ETSY_REDIRECT_URI,
    scope:ETSY_SCOPES, state, code_challenge:challenge, code_challenge_method:'S256',
  });
  window.location.href = 'https://www.etsy.com/oauth/connect?'+params.toString();
}

// Called on every page load. If Etsy just redirected back with ?code=...
// this exchanges it for a token. Any failure is recorded, never hidden.
async function handleEtsyCallback(){
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');
  const state = url.searchParams.get('state');
  const err = url.searchParams.get('error');
  if(!code && !err) return false;
  window.history.replaceState({}, '', window.location.pathname); // clear the code out of the address bar either way

  if(err){
    etsyAuth = { error: 'Etsy declined the connection: ' + (url.searchParams.get('error_description') || err) };
    return true;
  }
  const savedState = sessionStorage.getItem('etsy_state');
  const verifier = sessionStorage.getItem('etsy_verifier');
  if(!verifier || state !== savedState){
    etsyAuth = { error: 'Login state did not match — restart the connect flow (this can happen if the tab was reloaded mid-login).' };
    return true;
  }
  try{
    const res = await fetch(ETSY_PROXY + '/token', {
      method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type:'authorization_code', client_id:ETSY_CLIENT_ID,
        redirect_uri:ETSY_REDIRECT_URI, code, code_verifier:verifier,
      }),
    });
    if(!res.ok){
      const t = await res.text();
      etsyAuth = { error: `Etsy rejected the token exchange (HTTP ${res.status}): ${t.slice(0,400)}` };
      return true;
    }
    const data = await res.json();
    const userId = data.access_token.split('.')[0];
    etsyAuth = {
      accessToken: data.access_token, refreshToken: data.refresh_token,
      expiresAt: Date.now() + data.expires_in*1000, userId,
    };
    await fetchEtsyShop();
    await persistEtsyAuth();
  }catch(e){
    // most likely CORS — the browser blocked reading the response entirely
    etsyAuth = { error: 'Could not reach Etsy\'s token endpoint from the browser (likely blocked by CORS): ' + e.message };
  }
  return true;
}

async function fetchEtsyShop(){
  if(!etsyAuth || !etsyAuth.accessToken) return;
  try{
    const res = await fetch(`${ETSY_PROXY}/api/application/users/${etsyAuth.userId}/shops`, {
      headers:{ 'x-api-key':ETSY_CLIENT_ID, 'Authorization':`Bearer ${etsyAuth.accessToken}` },
    });
    if(!res.ok){ etsyAuth.shopError = `Shop lookup failed (HTTP ${res.status})`; return; }
    const data = await res.json();
    etsyAuth.shopId = data.shop_id; etsyAuth.shopName = data.shop_name;
    etsyAuth.shopError = null;
  }catch(e){ etsyAuth.shopError = 'Could not reach Etsy (likely CORS): ' + e.message; }
}

async function persistEtsyAuth(){ try{ await appStorage.set(etsyKeyFor(activeProfileId), JSON.stringify(etsyAuth)); }catch(e){} }
async function loadEtsyAuth(){
  etsyAuth = null; // same fix — don't let a previous profile's Etsy connection leak into a new one
  try{ const r = await appStorage.get(etsyKeyFor(activeProfileId)); if(r && r.value) etsyAuth = JSON.parse(r.value); }catch(e){}
}
async function disconnectEtsy(){
  etsyAuth = null; etsyTestResult = null;
  try{ await appStorage.set(etsyKeyFor(activeProfileId), JSON.stringify(null)); }catch(e){}
}

// Refreshes the access token if it's expired or about to be. Returns
// false (never throws a lie) if refresh isn't possible.
async function ensureFreshToken(){
  if(!etsyAuth || !etsyAuth.accessToken) return false;
  if(Date.now() < etsyAuth.expiresAt - 60000) return true;
  try{
    const res = await fetch(ETSY_PROXY + '/token', {
      method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type:'refresh_token', client_id:ETSY_CLIENT_ID, refresh_token:etsyAuth.refreshToken }),
    });
    if(!res.ok) return false;
    const data = await res.json();
    etsyAuth.accessToken = data.access_token; etsyAuth.refreshToken = data.refresh_token;
    etsyAuth.expiresAt = Date.now() + data.expires_in*1000;
    await persistEtsyAuth();
    return true;
  }catch(e){ return false; }
}
async function etsyFetch(path, opts={}){
  const ok = await ensureFreshToken();
  if(!ok) throw new Error('Not connected, or the token refresh failed.');
  return fetch(ETSY_PROXY + '/api' + path, {
    ...opts,
    headers: { 'x-api-key':ETSY_CLIENT_ID, 'Authorization':`Bearer ${etsyAuth.accessToken}`, ...(opts.headers||{}) },
  });
}

// ============================================================
// PUSH TO ETSY — the only place this app writes to a live shop.
// Deliberately narrow: title, description, and tags only. Never touches
// price, quantity, images, shipping, or listing state, so a bug here
// can't take a listing down or change what a buyer pays.
// ============================================================
// Diff is always computed against the project's scope, so the preview
// shows exactly what will be written and nothing more.
function buildEtsyDiff(l, project){
  const allowed = project ? scopeFields(project) : ['title','tags','description'];
  const changes = [];
  const newTitle = (l.proposedTitle||'').trim();
  if(allowed.includes('title') && newTitle && newTitle !== (l.oldTitle||'')){
    changes.push({ field:'title', label:'Title', from:l.oldTitle||'(empty)', to:newTitle });
  }
  const newDesc = (l.description||'').trim();
  if(allowed.includes('description') && newDesc){
    changes.push({ field:'description', label:'Description', from:'(current description on Etsy)', to:newDesc });
  }
  if(allowed.includes('tags') && l.tags && l.tags.length){
    changes.push({ field:'tags', label:`Tags (${l.tags.length})`, from:'(current tags on Etsy)', to:l.tags.join(', ') });
  }
  // Target section is a project-level choice, not a per-listing field —
  // pull it from the project rather than from the listing.
  if(allowed.includes('shop_section_id') && project && project.targetShopSectionId){
    const fromName = sectionNameFor(l.shopSectionId) || (l.shopSectionId ? `section #${l.shopSectionId}` : '(no section)');
    const toName = sectionNameFor(project.targetShopSectionId) || `section #${project.targetShopSectionId}`;
    if(l.shopSectionId !== project.targetShopSectionId){
      changes.push({ field:'shop_section_id', label:'Shop section', from:fromName, to:toName });
    }
  }
  return changes;
}
function sectionNameFor(id){
  const s = (WB.shopSections||[]).find(x=>String(x.id)===String(id));
  return s ? s.title : null;
}

function etsyPushBlockers(l, project){
  // Hard stops — these prevent a push outright rather than warning about it.
  const blockers = [];
  if(!project) blockers.push('This listing isn\'t in a project yet. Add it to one first — the project decides which fields may be written.');
  if(!l.etsyListingId) blockers.push('This listing has no Etsy listing ID — run "Import listings from Etsy" first so the app knows which listing to update.');
  if(!etsyAuth || !etsyAuth.shopId) blockers.push('Not connected to Etsy.');

  const allowed = project ? scopeFields(project) : [];
  const newTitle = (l.proposedTitle||'').trim();
  if(allowed.includes('title')){
    if(newTitle && newTitle.length > 140) blockers.push('Etsy titles are limited to 140 characters.');
  }
  if(allowed.includes('tags')){
    if(l.tags && l.tags.length > 13) blockers.push(`Etsy allows a maximum of 13 tags (this has ${l.tags.length}).`);
    const badTags = (l.tags||[]).filter(t=>t.length>20);
    if(badTags.length) blockers.push(`${badTags.length} tag(s) exceed Etsy's 20-character limit.`);
  }
  if(allowed.includes('shop_section_id') && project && !project.targetShopSectionId){
    blockers.push('This project has no target section set yet — pick one before pushing.');
  }
  if(project && !buildEtsyDiff(l, project).length){
    blockers.push(`Nothing to push within this project's scope (${PROJECT_SCOPES[project.scope].label}).`);
  }
  // Batch verification flags are a warning, not a gate — see the confirm
  // dialog at push time instead of blocking the button.
  return blockers;
}

// Captures exactly what Etsy has right now, before we overwrite it.
// This is the restore point, taken from Etsy's own response rather than
// from our local copy, so it reflects reality and not an assumption.
async function snapshotListing(l, projectId){
  try{
    const res = await etsyFetch(`/application/listings/${l.etsyListingId}`);
    if(!res.ok) return { ok:false, message:`Couldn't read the current listing to save a restore point (HTTP ${res.status}). Nothing was changed.` };
    const cur = await res.json();
    WB.snapshots.push({
      sku: l.sku,
      takenAt: new Date().toISOString(),
      projectId: projectId || null,
      title: cur.title || '',
      tags: cur.tags || [],
      description: cur.description || '',
    });
    return { ok:true };
  }catch(e){
    return { ok:false, message:'Couldn\'t save a restore point: '+e.message+'. Nothing was changed.' };
  }
}
function snapshotsFor(sku){
  return (WB.snapshots||[]).filter(s=>s.sku===sku).sort((a,b)=>b.takenAt.localeCompare(a.takenAt));
}

async function pushListingToEtsy(l, project){
  const blockers = etsyPushBlockers(l, project);
  if(blockers.length) return { ok:false, message:blockers[0] };

  // Scope is enforced HERE, at the request body, not in the UI. A field
  // outside the project's scope is never added to the payload, so it
  // cannot be written even if the UI or a caller got it wrong.
  const allowed = scopeFields(project);
  const body = {};
  if(allowed.includes('title')){
    const t = (l.proposedTitle||'').trim();
    if(t && t !== (l.oldTitle||'')) body.title = t;
  }
  if(allowed.includes('description')){
    const d = (l.description||'').trim();
    if(d) body.description = d;
  }
  if(allowed.includes('tags')){
    if(l.tags && l.tags.length) body.tags = l.tags.join(',');
  }
  if(allowed.includes('shop_section_id') && project.targetShopSectionId){
    body.shop_section_id = project.targetShopSectionId;
  }
  // Belt and braces: strip anything this app must never write, in case a
  // future change accidentally introduces one of these keys.
  NEVER_WRITABLE.forEach(k=>{ delete body[k]; });
  if(!Object.keys(body).length){
    return { ok:false, message:'Nothing to send within this project\'s scope.' };
  }

  // Restore point first. If we can't save one, we don't push at all.
  const snap = await snapshotListing(l, project.id);
  if(!snap.ok) return snap;

  try{
    const res = await etsyFetch(`/application/shops/${etsyAuth.shopId}/listings/${l.etsyListingId}`, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    if(!res.ok){
      const t = await res.text();
      await persistWorkbook(); // keep the snapshot even though the push failed
      return { ok:false, message:`Etsy rejected the update (HTTP ${res.status}): ${t.slice(0,300)}` };
    }
    const data = await res.json();
    // Trust Etsy's response over our own assumption of what happened. Also
    // syncs the "live" reference fields (oldTitle/oldDescription/oldTags) to
    // match, not just the draft — otherwise the compare view would keep
    // showing a stale diff against a version of Etsy that's already gone.
    if(data.title) l.oldTitle = decodeHtmlEntities(data.title);
    if(data.description !== undefined) l.oldDescription = decodeHtmlEntities(data.description);
    if(data.tags){ l.tags = data.tags.map(t=>decodeHtmlEntities(t)); l.oldTags = l.tags.slice(); }
    if(data.shop_section_id !== undefined) l.shopSectionId = data.shop_section_id;
    l.etsyLastModified = data.last_modified_timestamp || l.etsyLastModified;
    l.liveDate = todayISO;
    l.etsyChangedExternally = false; l.externalChangeDetail = null;
    if(!project.pushed) project.pushed = [];
    if(!project.pushed.includes(l.sku)) project.pushed.push(l.sku);
    if(!WB.pushLog) WB.pushLog = [];
    WB.pushLog.push({
      sku: l.sku, projectId: project.id, projectName: project.name,
      fields: allowed.slice(), pushedAt: new Date().toISOString(),
    });

    const saved = await persistWorkbook();
    return {
      ok:true,
      message: saved
        ? `Pushed to Etsy and confirmed. A restore point was saved first — you can undo this from the listing.`
        : 'Pushed to Etsy successfully, but saving the local record failed — re-import to resync.',
    };
  }catch(e){
    await persistWorkbook();
    return { ok:false, message:'Push failed: '+e.message };
  }
}

// Puts a listing back to exactly what a saved restore point holds.
// Only ever writes the three copy fields, same as a push.
async function restoreListing(l, snap){
  if(!l.etsyListingId) return { ok:false, message:'No Etsy listing ID for this listing.' };
  const body = { title: snap.title, description: snap.description };
  if(snap.tags && snap.tags.length) body.tags = snap.tags.join(',');
  NEVER_WRITABLE.forEach(k=>{ delete body[k]; });
  try{
    const res = await etsyFetch(`/application/shops/${etsyAuth.shopId}/listings/${l.etsyListingId}`, {
      method:'PATCH', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    if(!res.ok){
      const t = await res.text();
      return { ok:false, message:`Etsy rejected the restore (HTTP ${res.status}): ${t.slice(0,300)}` };
    }
    const data = await res.json();
    if(data.title) l.oldTitle = decodeHtmlEntities(data.title);
    if(data.description !== undefined) l.oldDescription = decodeHtmlEntities(data.description);
    if(data.tags){ l.tags = data.tags.map(t=>decodeHtmlEntities(t)); l.oldTags = l.tags.slice(); }
    l.etsyLastModified = data.last_modified_timestamp || l.etsyLastModified;
    await persistWorkbook();
    return { ok:true, message:`Restored to the version saved on ${snap.takenAt.slice(0,10)}.` };
  }catch(e){
    return { ok:false, message:'Restore failed: '+e.message };
  }
}

// Your own shop's sections — pulled fresh from Etsy, not typed in blind.
// Cached in WB.shopSections; refresh explicitly when you add/rename one.
// Read-only shop profile. Uses the shops_r scope already granted at
// connect time. There is deliberately no write counterpart anywhere in
// this app — and the connection was never authorized with shops_w, so
// Etsy itself would refuse a shop write even if one were attempted.
async function fetchShopProfile(silent){
  if(!etsyAuth || !etsyAuth.shopId) return { ok:false, message:'Not connected to Etsy.' };
