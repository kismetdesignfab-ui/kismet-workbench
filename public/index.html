    const res = await etsyFetch(`/application/shops/${etsyAuth.shopId}`);
    if(!res.ok) return { ok:false, message:`Etsy returned HTTP ${res.status}` };
    const d = await res.json();
    WB.shopProfile = {
      shopName: decodeHtmlEntities(d.shop_name || ''),
      title: decodeHtmlEntities(d.title || ''),
      url: d.url || '',
      activeListings: d.listing_active_count ?? null,
      digitalListings: d.digital_listing_count ?? null,
      totalSales: d.transaction_sold_count ?? null,
      reviewCount: d.review_count ?? null,
      reviewAverage: d.review_average ?? null,
      favorers: d.num_favorers ?? null,
      fetchedAt: new Date().toISOString(),
    };
    await persistWorkbook();
    if(!silent) render();
    return { ok:true };
  }catch(e){
    return { ok:false, message:e.message };
  }
}

async function fetchShopSections(){
  if(!etsyAuth || !etsyAuth.shopId) return { ok:false, message:'Not connected to Etsy.' };
  try{
    const res = await etsyFetch(`/application/shops/${etsyAuth.shopId}/sections`);

}

// The real thing this was all built for: pull actual listings straight
// from Etsy and merge them into the workbook. Matches by SKU — if a
// listing already exists locally, we update its live title/tags/price
// from Etsy but KEEP your tracked status/notes/proposed rewrite (that
// workflow data is yours, not Etsy's, and is worth more than a raw
// overwrite). New SKUs get added as NOT REVIEWED. Nothing here writes
// back to Etsy — this is read-only, same as Test Connection.
let etsyImportResult = null;

// ============================================================
// VIEW/FAVORITES TRACKING — Etsy's API only ever gives lifetime totals,
// never a date range. The only way to get real daily numbers is to
// snapshot the lifetime total ourselves, regularly — the difference
// between two snapshots is that period's real activity. Runs whenever
// the app is opened and it hasn't captured today yet; never a background
// job, so it can't drain a phone.
// ============================================================
// Default retention for auto-captured view snapshots. Trend charts only ever
// show the last 14 days (see viewHistoryFor callers), so 6 months is already
// far more history than the app displays anywhere — it exists as a ceiling,
// not a target. The Performance tab's manual controls can still trim tighter.
const VIEW_SNAPSHOT_RETENTION_DAYS = 180;

async function captureViewSnapshot(){
  if(!etsyAuth || !etsyAuth.shopId) return { ok:false, message:'Not connected to Etsy.' };
  const already = new Set(WB.viewSnapshots.filter(v=>v.date===todayISO).map(v=>v.sku));
  try{
    let all = []; let offset = 0; const limit = 100;
    while(true){
      const res = await etsyFetch(`/application/shops/${etsyAuth.shopId}/listings?limit=${limit}&offset=${offset}&sort_on=created&sort_order=asc`);
      if(!res.ok) return { ok:false, message:`Etsy returned HTTP ${res.status}` };
      const data = await res.json();
      all = all.concat(data.results||[]);
      if(!data.results || data.results.length < limit || all.length >= (data.count||all.length)) break;
      offset += limit;
      if(offset > 5000) break;
    }
    let captured = 0;
    all.forEach(item=>{
      const sku = (item.skus && item.skus.find(s=>String(s||'').trim())) ? item.skus.find(s=>String(s||'').trim()).trim() : null;
      if(!sku || already.has(sku)) return;
      WB.viewSnapshots.push({ sku, date: todayISO, views: item.views ?? null, favorites: item.num_favorers ?? null });
      captured++;
    });
    if(captured) clearViewSnapshots(VIEW_SNAPSHOT_RETENTION_DAYS);
    await persistWorkbook();
    return { ok:true, captured };
  }catch(e){
    return { ok:false, message: e.message };
  }
}
function viewHistoryFor(sku){
  return WB.viewSnapshots.filter(v=>v.sku===sku).sort((a,b)=>a.date.localeCompare(b.date));
}
// Removes rows older than `days` (0 clears everything). This is the "clear old
// view snapshots" the storage-full warning points to — view snapshots grow one
// row per tracked listing per day with no cap, so they're the fastest-growing
// thing in the workbook and the first place worth trimming.
function clearViewSnapshots(days){
  const before = WB.viewSnapshots.length;
  if(days <= 0){
    WB.viewSnapshots = [];
  } else {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    const cutoffISO = cutoff.toISOString().slice(0,10);
    WB.viewSnapshots = WB.viewSnapshots.filter(v=>v.date >= cutoffISO);
  }
  return before - WB.viewSnapshots.length;
}

async function importFromEtsy(silent){
  etsyImportResult = { pending:true };
  if(!silent) renderEtsy();
  if(!etsyAuth || !etsyAuth.shopId){
    etsyImportResult = { ok:false, message:'No shop connected yet.' };
    if(!silent) renderEtsy();
    return etsyImportResult;
  }
  try{
    let all = []; let offset = 0; const limit = 100;
    while(true){
      const res = await etsyFetch(`/application/shops/${etsyAuth.shopId}/listings?limit=${limit}&offset=${offset}&includes=Shipping,Images&sort_on=created&sort_order=asc`);
      if(!res.ok){
        const t = await res.text();
        etsyImportResult = { ok:false, message:`Etsy returned HTTP ${res.status}: ${t.slice(0,300)}` };
        if(!silent) renderEtsy();
        return etsyImportResult;
      }
      const data = await res.json();
      all = all.concat(data.results||[]);
      if(!data.results || data.results.length < limit || all.length >= (data.count||all.length)) break;
      offset += limit;
      if(offset > 5000) break; // sanity guard, not a real shop size
    }

    // Etsy's pagination isn't guaranteed to stay stable between calls without
    // an explicit sort, so the same listing can come back on two overlapping
    // pages. Dedupe by listing_id before processing — otherwise a listing
    // seen twice in one import falsely reports as "matched" against itself.
    const seenIds = new Set();
    all = all.filter(item=>{
      if(seenIds.has(item.listing_id)) return false;
      seenIds.add(item.listing_id);
      return true;
    });

    // Decode Etsy's HTML-entity-encoded text fields once, here, before any
    // of the matching/comparison logic below ever sees them — see
    // decodeHtmlEntities() for why.
    all.forEach(item=>{
      if(item.title) item.title = decodeHtmlEntities(item.title);
      if(item.description) item.description = decodeHtmlEntities(item.description);
      if(Array.isArray(item.tags)) item.tags = item.tags.map(t=>decodeHtmlEntities(t));
    });

    // A listing with variations can carry several SKUs, and the first slot
    // is sometimes empty. Take the first non-empty one rather than skus[0],
    // otherwise a listing that HAS a SKU gets reported as missing one.
    const firstSku = (item)=>{
      if(!item.skus || !item.skus.length) return null;
      const found = item.skus.map(s=>String(s||'').trim()).find(s=>s.length);
      return found || null;
    };

    const bySku = {}; WB.listings.forEach(l=>bySku[l.sku]=l);
    let updated = 0, added = 0, noSku = 0;
    const noSkuTitles = [];
    const missingSkuRows = [];

    // SKUs are the foundation: if two Etsy listings share one, matching is
    // ambiguous and one would silently overwrite the other. Find those
    // before processing anything, and report them rather than guessing.
    const skuSeen = {};
    const dupes = {};
    all.forEach(item=>{
      const s = firstSku(item);
      if(!s) return;
      const entry = { title:item.title, listingId:item.listing_id, url:item.url||null };
      if(skuSeen[s]){ (dupes[s] = dupes[s] || [skuSeen[s]]).push(entry); }
      else skuSeen[s] = entry;
    });

    all.forEach(item=>{
      const sku = firstSku(item);
      const price = item.price ? (item.price.amount / item.price.divisor).toFixed(2) : null;
      const liveDate = item.state === 'active' ? todayISO : null;
      if(!sku){
        noSku++;
        if(noSkuTitles.length<25) noSkuTitles.push(item.title);
        missingSkuRows.push({ title:item.title, listingId:item.listing_id, url:item.url||null, state:item.state });
        return;
      }

      const existing = bySku[sku];
      if(existing){
        // Detect edits made outside this app (e.g. via ChatGPT directly on Etsy):
        // if Etsy's own modified time moved forward but this app's status never
        // changed, that's real evidence worth surfacing, not silently overwritten.
        const newTs = item.last_modified_timestamp || null;
        if(newTs && existing.etsyLastModified && newTs > existing.etsyLastModified && existing.status==='NOT REVIEWED'){
          existing.etsyChangedExternally = true;
          // Capture exactly which fields moved, before they get overwritten
          // below — "Etsy shows a change" is useless without saying what.
          const changedFields = [];
          if((item.title||'') !== (existing.oldTitle||'')) changedFields.push({ field:'Title', from:existing.oldTitle||'(empty)', to:item.title||'(empty)' });
          const oldTagsStr = (existing.oldTags||existing.tags||[]).join(', '), newTagsStr = (item.tags||[]).join(', ');
          if(oldTagsStr !== newTagsStr) changedFields.push({ field:'Tags', from:oldTagsStr||'(none)', to:newTagsStr||'(none)' });
          const newPrice = item.price && item.price.amount!=null ? (item.price.amount/(item.price.divisor||100)).toFixed(2) : null;
          if(newPrice!=null && String(newPrice)!==String(existing.price)) changedFields.push({ field:'Price', from:`$${existing.price}`, to:`$${newPrice}` });
          if((item.description||'') !== (existing.oldDescription||'')) changedFields.push({ field:'Description', from:'(previous text)', to:'(new text \u2014 open the listing to compare in full)' });
          if(item.state && item.state !== existing.etsyState) changedFields.push({ field:'Listing status', from:existing.etsyState||'(unknown)', to:item.state });
          existing.externalChangeDetail = changedFields.length ? changedFields : [{ field:'Something', from:'', to:'(Etsy\'s timestamp moved, but no tracked field looks different \u2014 could be images or a field this app doesn\'t track)' }];
        }
        existing.oldTitle = item.title;
        existing.oldDescription = item.description || existing.oldDescription || '';
        // oldTags mirrors Etsy on every sync, same as oldTitle/oldDescription
        // above. `tags` itself is deliberately NOT touched here — it's the
        // draft you edit, same as proposedTitle/description, and syncing it
        // from Etsy on every import (including the silent one that runs
        // whenever the app opens) used to silently overwrite in-progress tag
        // edits that hadn't been pushed yet.
        existing.oldTags = item.tags || existing.oldTags || [];
        existing.price = price;
        existing.etsyListingId = item.listing_id;
        existing.etsyState = item.state;
        existing.etsyUrl = item.url || existing.etsyUrl;
        existing.etsyLastModified = newTs;
        existing.shopSectionId = item.shop_section_id || null;
        existing.imageUrls = (item.images||[]).slice(0,1).map(im=>im.url_570xN||im.url_fullxfull).filter(Boolean);
        updated++;
      } else {
        const fresh = {
          row: null, sku, status:'NOT REVIEWED', priority:null,
          oldTitle: item.title, oldDescription: item.description || '', proposedTitle:'', description:'',
          tags: item.tags || [], oldTags: item.tags || [], price, pk:null, sk:null,
          infographic:null, googleSeo:'No', notes:null,
          liveDate, fbStatus:'NOT_POSTED', fbDate:null, fbLink:null,
          isDraft:false, pendingDraft:false, draftStatus:null, draftCategory:null, draftNote:null,
          etsyListingId: item.listing_id, etsyState: item.state,
          etsyLastModified: item.last_modified_timestamp || null,
          etsyUrl: item.url || null, etsyChangedExternally: false,
          shopSectionId: item.shop_section_id || null,
          imageUrls: (item.images||[]).slice(0,1).map(im=>im.url_570xN||im.url_fullxfull).filter(Boolean),
        };
        WB.listings.push(fresh);
        bySku[sku] = fresh;
        added++;
      }
    });

    WB.meta.source = `IMPORTED FROM ETSY: ${etsyAuth.shopName || 'shop ' + etsyAuth.shopId}`;
    WB.meta.importedAt = todayISO;
    const ok = await persistWorkbook();
    if(!ok){
      etsyImportResult = { ok:false, message:'Pulled the data but saving it failed. Try again.' };
    } else {
      // Persist the findings so they survive leaving this tab — a missing
      // SKU is a real outstanding problem, not a transient banner.
      WB.skuIssues = {
        checkedAt: new Date().toISOString(),
        missing: missingSkuRows,
        dupes: Object.entries(dupes).map(([sku,titles])=>({sku, titles})),
      };
      await persistWorkbook();
      etsyImportResult = { ok:true, total:all.length, updated, added, noSku, noSkuTitles,
                           dupes: WB.skuIssues.dupes };
    }
  }catch(e){
    etsyImportResult = { ok:false, message:'Request failed (likely CORS or a network issue): ' + e.message };
  }
  if(etsyImportResult.ok && !silent){
    // Land somewhere useful with the data, not stuck re-showing the same
    // connect screen you just used. Only for the manual button click —
    // a silent background refresh must never jump you to a different tab.
    uiState.lastTab = 'dashboard';
    await saveUiState();
  }
  if(!silent) render();
  updateMiniGauge(); renderNav();
  return etsyImportResult;
}

function renderEtsy(){
  let html = '';
  if(etsyAuth && etsyAuth.error){
    html += `<div class="banner err"><span class="mono">⚠</span><span class="fill">${escapeHtml(etsyAuth.error)}</span><button id="etsyRetryBtn">Try again</button></div>`;

// Background cloud backup — mirrors every local save to the account, once
// signed in, so a full local storage never means data only existed in one
// place. 'idle' when signed out, 'pending' while a save is debounced,

let cloudSyncState = { status:'idle', lastSyncedAt:null };

// Pushes THIS shop profile's workbook to the cloud, then reads it back
// to confirm it actually landed — same honesty rule as local saves.
async function pushToCloud(){
  if(!currentUser){ syncStatus = { ok:false, message:'Sign in first.' }; return syncStatus; }
  const p = currentProfile();
  try{
    const payload = {
      user_id: currentUser.id,
      profile_id: p.id,
      label: p.label,
      workbook: WB,
      updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from('shop_snapshots')
      .upsert(payload, { onConflict: 'user_id,profile_id' });
    if(error){ syncStatus = { ok:false, message:'Upload failed: '+error.message }; return syncStatus; }
    // read back to verify
    const { data: check, error: readErr } = await sb.from('shop_snapshots')
      .select('updated_at, label').eq('user_id', currentUser.id).eq('profile_id', p.id).single();
    if(readErr || !check){ syncStatus = { ok:false, message:'Uploaded but could not verify it saved. Try again.' }; return syncStatus; }
    syncStatus = { ok:true, message:`Backed up "${p.label}" to your account.` };
  }catch(e){
    syncStatus = { ok:false, message:'Upload failed: '+e.message };
  }
  return syncStatus;
}

// Debounced auto-backup: called on every local save. Coalesces bursts of
// edits (typing, bulk operations) into one upload a few seconds after
// things go quiet, instead of hammering Supabase on every keystroke.
function scheduleCloudSync(){
  if(!currentUser) return;
  cloudSyncState.status = 'pending';
  updateMiniGauge();
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(runAutoCloudSync, 5000);
}
async function runAutoCloudSync(){
  if(!currentUser || cloudSyncInFlight) return;
  cloudSyncInFlight = true;
  cloudSyncState.status = 'syncing';
  updateMiniGauge();
  try{
    const r = await pushToCloud();
    cloudSyncState.status = r && r.ok ? 'ok' : 'error';
    if(r && r.ok) cloudSyncState.lastSyncedAt = Date.now();
  }catch(e){
    cloudSyncState.status = 'error';
  }
  cloudSyncInFlight = false;
  updateMiniGauge();
  const acctPage = document.getElementById('content');
  if(acctPage && uiState.lastTab==='account') renderAccount();
}

// Lists what's in the cloud for this account, so you can pull a shop
// onto a different browser/computer.
async function listCloudShops(){
  if(!currentUser) return [];
  try{
    const { data, error } = await sb.from('shop_snapshots')
      .select('profile_id, label, updated_at').eq('user_id', currentUser.id)
      .order('updated_at', { ascending:false });
    if(error) return [];
    return data || [];
  }catch(e){ return []; }
}

// Pulls a cloud shop down into a local profile. Creates the local profile
// if this browser has never seen it; overwrites that profile's local data
// with the cloud copy (confirmed by the caller before this runs).
async function pullFromCloud(profileId){
  if(!currentUser){ syncStatus = { ok:false, message:'Sign in first.' }; return syncStatus; }
  try{
    const { data, error } = await sb.from('shop_snapshots')
      .select('profile_id, label, workbook').eq('user_id', currentUser.id).eq('profile_id', profileId).single();
    if(error || !data){ syncStatus = { ok:false, message:'Could not fetch that shop.' }; return syncStatus; }

    let local = profiles.find(p=>p.id===data.profile_id);
    if(!local){
      profiles.push({ id:data.profile_id, label:data.label, createdDate: todayISO });
      await appStorage.set(PROFILES_KEY, JSON.stringify(profiles));
    }
    await setActiveProfile(data.profile_id);
    WB = data.workbook;
    const ok = await persistWorkbook();
    syncStatus = ok
      ? { ok:true, message:`Loaded "${data.label}" from your account.` }
      : { ok:false, message:'Downloaded but saving locally failed.' };
  }catch(e){
    syncStatus = { ok:false, message:'Download failed: '+e.message };
  }
  return syncStatus;
}

// ROUTER
// ============================================================
function render(){
  // Until the shop is connected and listings are loaded, the working tabs
  // have nothing to show — send people to Setup rather than an empty screen.
  if(!setupComplete() && !SETUP_TABS.some(t=>t.id===uiState.lastTab)){
    // If listings vanished but an Etsy connection exists, say so plainly
    // instead of silently acting like a first-time setup — that's alarming
    // and hides what actually happened.
    if(etsyAuth && etsyAuth.shopId && !document.getElementById('noListingsBanner')){
      const el = document.createElement('div');
      el.id = 'noListingsBanner';
      el.style.cssText = 'position:fixed; bottom:16px; left:16px; right:16px; z-index:9999; max-width:640px; margin:0 auto;';
      el.innerHTML = `<div class="banner warn" style="margin:0; box-shadow:var(--shadow-lg);"><span class="mono">i</span><span class="fill">
        <b>No listings loaded right now.</b> Your Etsy connection is still active, so nothing is lost on Etsy's side \u2014 run <b>Import listings from Etsy</b> on the Shop Connection tab to pull them back in.
      </span><button onclick="document.getElementById('noListingsBanner').remove()">Dismiss</button></div>`;
      setTimeout(()=>document.body.appendChild(el), 100);
    }
    uiState.lastTab = 'setup';
  }
  // Normalise a tab id this version no longer has (saved by an older
  // build) before anything renders, so the header and the content can't
  // end up describing different tabs.
  if(!TABS.some(t=>t.id===uiState.lastTab)){
    uiState.lastTab = setupComplete() ? 'dashboard' : 'setup';
    saveUiState();
  }
  renderNav();
  renderProfileSwitcher();
  renderTopbarActions();
  renderShopBanner();
  const tabMeta = TABS.find(t=>t.id===uiState.lastTab) || TABS[0];
  const eyebrowEl = document.getElementById('pageEyebrow');
  eyebrowEl.textContent = tabMeta.tag ? ('TAB.'+tabMeta.tag) : (currentProfile()? currentProfile().label.toUpperCase() : '');
  document.getElementById('pageTitle').textContent = tabMeta.label;
  document.getElementById('main').scrollTop = 0;
  updateMiniGauge();
  if(uiState.lastTab==='setup') renderSetup();
  else if(uiState.lastTab==='dashboard') renderDashboard();
  else if(uiState.lastTab==='listings') renderListings();
  else if(uiState.lastTab==='projects') renderProjects();
  else if(uiState.lastTab==='keywords') renderKeywords();
  else if(uiState.lastTab==='completion') renderCompletion();
  else if(uiState.lastTab==='attention') renderAttention();
  else if(uiState.lastTab==='stats') renderStats();
  else if(uiState.lastTab==='playbook') renderPlaybook();
  else if(uiState.lastTab==='etsy') renderEtsy();
  else if(uiState.lastTab==='account') renderAccount();
  else {
    // An unknown tab id — e.g. a tab that existed in an older version and
    // is still saved in this browser. Without this fallback the page
    // rendered nothing at all and looked broken.
    uiState.lastTab = 'dashboard';
    saveUiState();
    renderNav();
    renderDashboard();
  }
}

document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeDrawerChecked(window.__openDrawerListing); });
document.getElementById('importFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const r = await handleImportFile(file);
  e.target.value = '';
  render();
  alert(r.message);
});

document.getElementById('batchFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const r = await handleBatchImport(file);
  e.target.value = '';
  // Take them straight to Projects, where the assignment step (if the
  // import matched anything) is waiting for them.
  if(r.ok && r.matchedSkus && r.matchedSkus.length){
    uiState.lastTab = 'projects';
    await saveUiState();
  }
  render();
  alert(r.message);
});

(async function init(){
  await loadProfiles();
  await loadState();
  await loadEtsyAuth();
  await loadCurrentUser();
  if(currentUser) cloudShopsCache = await listCloudShops();
  const cameFromEtsy = await handleEtsyCallback();
  if(cameFromEtsy){ uiState.lastTab = 'etsy'; saveUiState(); }
  else if(setupComplete()){ uiState.lastTab = 'dashboard'; } // always open on Dashboard, not wherever you left off
  render();
  document.getElementById('mobileMenuBtn').addEventListener('click', openMobileMenu);
  document.getElementById('mobileNavOverlay').addEventListener('click', closeMobileMenu);

  // Fire-and-forget: only runs when the app is actually opened, never in the
  // background, and only if today isn't already captured. A phone opening
  // this once a day costs one quick read call, nothing more.
  if(etsyAuth && etsyAuth.shopId && setupComplete()){
    const doneToday = WB.viewSnapshots.some(v=>v.date===todayISO);
    if(!doneToday){
      captureViewSnapshot().then(r=>{
        if(r.ok && r.captured>0){
          const el = document.getElementById('syncPill');
          if(el) el.insertAdjacentHTML('afterbegin', `<div class="sync-pill synced" style="margin:0 0 6px 0;"><span class="dot"></span> Views captured for today</div>`);
        }
      });
    }
  }

  // Real listing data (titles/tags/prices/state) refreshed every time a
  // new window opens, silently — never touches proposedTitle/description/
  // notes (your drafts), only what actually lives on Etsy. Never jumps you
  // to a different tab; if you're on a tab the fresh data would change,
  // it just re-renders in place once it's back.
  if(etsyAuth && etsyAuth.shopId && setupComplete() && !cameFromEtsy){
    // Read-only shop stats for the banner — refreshed alongside listings.
    fetchShopProfile(true).then(r=>{ if(r && r.ok) renderShopBanner(); });
    importFromEtsy(true).then(r=>{
      if(r && r.ok){
        const affected = new Set(['dashboard','listings','projects','attention','completion']);
        if(affected.has(uiState.lastTab)) render();
      }
    });
  }
})();

</script>
