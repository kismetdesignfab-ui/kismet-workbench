<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kismet Cut Ready DXF — Ops Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   Kismet Ops Bench — visual system
   Direction: "shop drawing" — the precision of a technical
   drawing sheet, executed like fine stationery. Grounded in the
   subject: this is a tool for someone who cuts steel and sells
   signs, so the type is signage-derived and the one loud element
   is a measured rule (the kerf gauge).
   Etsy-familiar: light ground, soft cards, generous air.
   ============================================================ */
:root{
  /* Ground — drafting vellum, cooler and greyer than a cream template */
  --bed:#F6F4F0;
  --panel:#FFFFFF;
  --panel-2:#F1EEE8;
  --panel-3:#F4F1EB;
  --line:#E3DDD2;
  --line-soft:#EDE9E1;

  /* Ink — warm charcoal, never pure black */
  --ink:#221E1A;
  --ink-2:#4A4239;
  --smoke:#7C7266;
  --smoke-dim:#8C8172;

  /* Torch — burnt copper. Kismet's accent, deepened for print-weight
     richness and used sparingly: actions and the gauge, not decoration. */
  --torch:#C2571C;
  --torch-dim:#A2470F;
  --torch-soft:#FBEDE2;

  /* Steel — informational, never competing with torch */
  --steel:#3D6478;
  --steel-soft:#E8EFF2;

  --green:#3B7A55;
  --green-soft:#E7F1EA;
  --amber:#9A6B10;
  --amber-soft:#FAF0DC;
  --red:#A8422F;
  --red-soft:#F9E9E4;

  /* Elevation — hairline + breath, not drop-shadow drama */
  --shadow-sm: 0 1px 2px rgba(34,30,26,0.04);
  --shadow-md: 0 2px 10px rgba(34,30,26,0.07);
  --shadow-lg: 0 18px 44px rgba(34,30,26,0.16);

  --r-sm:8px; --r-md:12px; --r-lg:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  background:var(--bed); color:var(--ink);
  font-family:'Inter Tight','Inter',sans-serif; font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
.mono{ font-family:'IBM Plex Mono',monospace; }
.app{ display:flex; height:100vh; width:100%; }

:focus-visible{ outline:2px solid var(--torch); outline-offset:2px; border-radius:4px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

/* ---------- Sidebar ---------- */
.sidebar{
  width:248px; flex-shrink:0; background:var(--panel);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  padding:24px 14px 18px 14px; z-index:2;
}
.brand{ padding:0 8px 18px 8px; border-bottom:1px solid var(--line); margin-bottom:18px; }
.brand .mark{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }
.brand .name{
  font-family:'Archivo',sans-serif; font-weight:700; font-size:13.5px;
  letter-spacing:0.06em; text-transform:uppercase; color:var(--ink); line-height:1.25;
}
.brand .sub{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim);
  letter-spacing:0.14em; text-transform:uppercase; margin-top:4px;
}

.nav{ display:flex; flex-direction:column; gap:1px; overflow-y:auto; overscroll-behavior:contain; }
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--r-sm);
  cursor:pointer; color:var(--ink-2); font-size:13.5px; font-weight:500;
  transition:background .13s ease, color .13s ease;
}
.nav-item .tag{
  font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:9.5px;
  color:var(--smoke-dim); width:18px; flex-shrink:0; letter-spacing:0.02em;
}
.nav-item .badge-count{
  margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px;
  background:var(--panel-2); color:var(--smoke); padding:2px 7px; border-radius:20px;
}
.nav-item .badge-count.alert{ background:var(--red-soft); color:var(--red); }
.nav-item:hover{ background:var(--panel-3); color:var(--ink); }
.nav-item.active{ background:var(--ink); color:#fff; font-weight:600; }
.nav-item.active .tag{ color:rgba(255,255,255,0.5); }
.nav-item.active .badge-count{ background:rgba(255,255,255,0.16); color:#fff; }

.sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
.gauge-mini .lbl{
  font-size:9.5px; color:var(--smoke-dim); text-transform:uppercase; letter-spacing:0.14em;
  margin-bottom:7px; font-family:'IBM Plex Mono',monospace;
}
.gauge-mini .bar{ height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
.gauge-mini .bar-fill{ height:100%; background:var(--torch); }
.gauge-mini .val{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-2); margin-top:7px; }
.sync-pill{
  display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace;
  font-size:9.5px; padding:5px 8px; border-radius:6px; letter-spacing:0.03em;
}
.sync-pill.stale{ background:var(--panel-2); color:var(--smoke); }
.sync-pill.synced{ background:var(--green-soft); color:var(--green); }
.sync-pill .dot{ width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }

/* ---------- Main ---------- */
.main{ flex:1; overflow-y:auto; height:100vh; overscroll-behavior:contain; }
.topbar{
  position:sticky; top:0; z-index:5; background:var(--bed);
  padding:30px 40px 16px 40px; display:flex; justify-content:space-between;
  align-items:flex-end; gap:20px; border-bottom:1px solid var(--line); margin-bottom:26px;
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim);
  letter-spacing:0.16em; text-transform:uppercase; margin-bottom:7px;
}
.h1{
  font-family:'Archivo',sans-serif; font-weight:700; font-size:26px;
  text-transform:uppercase; letter-spacing:-0.005em; color:var(--ink); line-height:1;
}
.content{ padding:0 40px 72px 40px; }

/* ---------- Etsy-style shop banner (read-only data) ---------- */
.shop-banner{
  padding:0 40px 22px 40px;
}
.shop-banner .welcome{
  font-family:'Inter Tight',sans-serif; font-size:22px; font-weight:700;
  color:var(--ink); letter-spacing:-0.01em; margin-bottom:3px;
}
.shop-banner .shop-sub{
  font-size:12.5px; color:var(--smoke); margin-bottom:16px;
}
.shop-stats{
  display:flex; gap:10px; flex-wrap:wrap; align-items:stretch;
}
.shop-stat{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  padding:12px 18px; min-width:132px;
}
.shop-stat .sv{
  font-family:'Inter Tight',sans-serif; font-size:20px; font-weight:700;
  color:var(--ink); line-height:1.15; letter-spacing:-0.01em;
}
.shop-stat .sk{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim);
  text-transform:uppercase; letter-spacing:0.1em; margin-top:4px;
}
.shop-stat .stars{ color:var(--torch); letter-spacing:0.06em; }
.shop-link-box{
  display:flex; align-items:center; gap:8px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px;
}
.shop-link-box .u{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--steel);
  max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* Etsy-like hover: cards that actually navigate get a real lift.
   Nothing that isn't clickable gets this treatment. */
.health-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  padding:16px 18px; cursor:pointer;
  transition:border-color .14s ease, box-shadow .14s ease, transform .14s ease;
}
.health-card:hover{
  border-color:var(--ink);
  box-shadow:0 4px 14px rgba(34,30,26,0.10);
  transform:translateY(-2px);
}
.health-card:hover .hc-go{ opacity:1; }
.health-card.is-open{ border-color:var(--ink); border-width:1.5px; }
.health-card .hc-icon{ font-size:20px; margin-bottom:8px; }
.health-card .hc-label{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim);
  text-transform:uppercase; letter-spacing:0.1em; line-height:1.5;
}
.health-card .hc-value{
  font-family:'Inter Tight',sans-serif; font-size:26px; font-weight:700;
  color:var(--ink); letter-spacing:-0.02em; margin-top:2px;
}
.health-card .hc-go{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--torch);
  letter-spacing:0.1em; margin-top:6px; opacity:0; transition:opacity .14s ease;
}
@media (max-width: 900px){
  .shop-banner{ padding:0 20px 18px 20px; }
}
.topbar-actions{ display:flex; gap:8px; flex-shrink:0; }

/* ---------- Banners ---------- */
.banner{
  display:flex; align-items:center; gap:11px; padding:13px 16px;
  border-radius:var(--r-md); font-size:13px; margin-bottom:20px; line-height:1.5;
}
.banner.warn{ background:var(--amber-soft); color:var(--amber); }
.banner.err{ background:var(--red-soft); color:var(--red); }
.banner.ok{ background:var(--green-soft); color:var(--green); }
.banner b{ font-weight:700; }
.banner .fill{ flex:1; }
.banner button{
  font-family:'Inter Tight',sans-serif; font-weight:600; font-size:12px; background:var(--panel);
  border:1px solid currentColor; color:inherit; padding:6px 12px; border-radius:var(--r-sm);
  cursor:pointer; flex-shrink:0;
}

/* ---------- SIGNATURE: the kerf gauge ----------
   A measured rule, the way a fabricator reads one: minor ticks,
   major ticks with figures, and a torch head at the cut position.
   This is the one deliberately loud element in the interface. */
.kerf-ruler{
  position:relative; height:66px; margin:4px 0 34px 0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  overflow:hidden; box-shadow:var(--shadow-sm);
}
.kerf-ticks{ position:absolute; inset:0; display:flex; align-items:flex-end; }
.kerf-tick{ flex:1; position:relative; height:100%; }
.kerf-tick::after{
  content:''; position:absolute; bottom:0; right:0; width:1px;
  height:9px; background:var(--line);
}
.kerf-tick.major::after{ height:18px; background:var(--smoke-dim); }
.kerf-tick .num{
  position:absolute; bottom:22px; right:0; transform:translateX(50%);
  font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--smoke-dim);
  letter-spacing:0.04em;
}
.kerf-fill{
  position:absolute; top:0; bottom:0; left:0;
  background:linear-gradient(90deg, rgba(194,87,28,0.10), rgba(194,87,28,0.03));
}
.kerf-head{
  position:absolute; top:0; bottom:0; width:2px; background:var(--torch);
}
.kerf-head::before{
  content:''; position:absolute; top:0; left:-4px; width:10px; height:10px;
  background:var(--torch); clip-path:polygon(50% 100%, 0 0, 100% 0);
}
.kerf-label{
  position:absolute; top:13px; transform:translateX(-50%);
  font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--torch-dim);
  font-weight:600; letter-spacing:0.08em; white-space:nowrap;
}

/* ---------- Plain capsule progress — no CNC/measurement theming ---------- */
.capsule-progress{
  display:flex; align-items:center; gap:14px; margin:4px 0 20px 0;
}
.capsule-progress .track{
  flex:1; height:14px; border-radius:999px; background:var(--panel-2);
  border:1px solid var(--line); overflow:hidden;
}
.capsule-progress .fill{
  height:100%; border-radius:999px; background:var(--torch);
  transition:width .2s ease;
}
.capsule-progress .label{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--smoke);
  font-weight:700; letter-spacing:0.04em; white-space:nowrap; flex-shrink:0;
}

/* ---------- Cards & grids ---------- */
.grid{ display:grid; gap:14px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-2{ grid-template-columns:1fr 1fr; }
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
  padding:20px 22px; box-shadow:var(--shadow-sm);
}
.card .k{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim);
  text-transform:uppercase; letter-spacing:0.14em; margin-bottom:11px;
}
.card .v{
  font-family:'Archivo',sans-serif; font-size:30px; font-weight:700; color:var(--ink);
  line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
}
.card .d{ font-size:11.5px; color:var(--smoke); margin-top:8px; }
.card .d.up{ color:var(--green); }
.card .d.down{ color:var(--red); }

/* Section headings: a hairline rule carries the structure, not a glyph */
.section-title{
  font-family:'Archivo',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:0.14em; color:var(--ink); margin:38px 0 14px 0;
  display:flex; align-items:center; gap:14px; justify-content:space-between;
}
.section-title .left{ display:flex; align-items:center; gap:14px; flex:1; }
.section-title .left::after{
  content:''; flex:1; height:1px; background:var(--line);
}
.section-note{ font-size:13px; color:var(--smoke); margin:-4px 0 16px 0; max-width:68ch; line-height:1.6; }

.cluster-edit{ display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
.cluster-edit input{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm);
  color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:13px;
  padding:9px 12px; min-width:240px;
}
.cluster-edit .lbl-inline{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim);
  text-transform:uppercase; letter-spacing:0.14em;
}

/* ---------- Row lists ---------- */
.priority-list{ display:flex; flex-direction:column; gap:7px; }
.priority-row{
  display:flex; align-items:center; gap:14px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-md); padding:13px 17px;
  cursor:pointer; transition:border-color .13s ease, box-shadow .13s ease;
}
.priority-row:hover{ border-color:var(--smoke-dim); box-shadow:var(--shadow-md); }
.priority-row .sku{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--smoke-dim);
  width:42px; flex-shrink:0;
}
.priority-row .title{ flex:1; font-size:13.5px; color:var(--ink); font-weight:500; }
.priority-row .go{
  font-size:10.5px; color:var(--smoke-dim); font-family:'IBM Plex Mono',monospace;
  letter-spacing:0.08em;
}
.priority-row:hover .go{ color:var(--torch); }

/* ---------- Toolbar & inputs ---------- */
.toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.search{
  flex:1; min-width:220px; background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:10px 14px; color:var(--ink); font-size:13.5px;
  font-family:'Inter Tight',sans-serif;
}
.search:focus{ outline:none; border-color:var(--ink); }
.search::placeholder{ color:var(--smoke-dim); }
select.filt{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-sm);
  color:var(--ink); padding:10px 12px; font-size:12.5px;
  font-family:'IBM Plex Mono',monospace; cursor:pointer;
}
.count-pill{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--smoke);
  white-space:nowrap; padding:0 4px; letter-spacing:0.04em;
}

/* ---------- Tables ---------- */
.table-wrap{
  border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden;
  background:var(--panel);
}
.trow{
  display:grid; grid-template-columns:60px 104px 1fr 78px 92px 88px; align-items:center;
  padding:12px 18px; border-bottom:1px solid var(--line-soft); cursor:pointer;
  background:var(--panel); transition:background .1s ease;
}
.trow:last-child{ border-bottom:none; }
.trow:hover{ background:var(--panel-3); }
.trow.head{
  background:transparent; cursor:default; font-family:'IBM Plex Mono',monospace;
  font-size:9.5px; color:var(--smoke-dim); text-transform:uppercase; letter-spacing:0.12em;
  border-bottom:1px solid var(--line); padding-top:14px; padding-bottom:14px;
}
.trow.head .sortable-h:hover{ color:var(--ink); }
.trow .c-sku{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--smoke-dim); }
.trow .c-title{
  font-size:13.5px; color:var(--ink); padding-right:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;
}
.trow .c-price{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--smoke);
  font-variant-numeric:tabular-nums;
}

.badge{
  display:inline-flex; align-items:center; font-family:'IBM Plex Mono',monospace;
  font-size:9.5px; padding:3px 8px; border-radius:4px; letter-spacing:0.08em;
  white-space:nowrap; text-transform:uppercase;
}
.badge.notreviewed{ background:var(--panel-2); color:var(--smoke); }
.badge.updated{ background:var(--green-soft); color:var(--green); }
.badge.updated2{ background:var(--torch-soft); color:var(--torch-dim); }
.badge.high{ background:var(--amber-soft); color:var(--amber); }
.badge.draft{ background:var(--steel-soft); color:var(--steel); }
.badge.fail{ background:var(--red-soft); color:var(--red); }

.pager{ display:flex; justify-content:center; align-items:center; gap:16px; margin-top:18px; }
.pager button{
  background:var(--panel); border:1px solid var(--line); color:var(--ink);
  border-radius:var(--r-sm); padding:8px 16px; font-family:'IBM Plex Mono',monospace;
  font-size:11.5px; cursor:pointer;
}
.pager button:disabled{ opacity:0.35; cursor:default; }
.pager button:hover:not(:disabled){ border-color:var(--ink); }
.pager .pg{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--smoke);
  letter-spacing:0.04em;
}

/* ---------- Drawer ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(34,30,26,0.32); z-index:20;
  display:none; align-items:stretch; justify-content:flex-end;
}
.overlay.open{ display:flex; }
.drawer{
  width:580px; max-width:94vw; background:var(--bed); border-left:1px solid var(--line);
  padding:30px 32px; overflow-y:auto; height:100vh; box-shadow:var(--shadow-lg); overscroll-behavior:contain;
}
.drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
.drawer .sku-line{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--smoke-dim);
  letter-spacing:0.1em; margin-bottom:6px; display:flex; align-items:center; gap:10px;
  text-transform:uppercase;
}
.close-x{
  background:var(--panel); border:1px solid var(--line); color:var(--smoke);
  width:32px; height:32px; border-radius:var(--r-sm); cursor:pointer; font-size:14px; flex-shrink:0;
}
.close-x:hover{ color:var(--ink); border-color:var(--ink); }

.ws-block{
  border:1px solid var(--line); border-radius:var(--r-md); padding:17px;
  margin-bottom:12px; background:var(--panel);
}
.ws-block .ws-lbl{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; }
.ws-block .ws-lbl span{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--smoke-dim);
  text-transform:uppercase; letter-spacing:0.14em;
}
.ws-block .ws-text{ font-size:13.5px; color:var(--ink); line-height:1.6; white-space:pre-wrap; }
.ws-block .ws-text.old{ color:var(--smoke); }
.ws-block textarea, .ws-block input[type=text]{
  width:100%; background:var(--panel-3); border:1px solid var(--line); border-radius:var(--r-sm);
  color:var(--ink); padding:10px 12px; font-size:13.5px; font-family:'Inter Tight',sans-serif;
  line-height:1.55;
}
.ws-block textarea{ min-height:74px; resize:vertical; }
.ws-block textarea:focus, .ws-block input:focus{ outline:none; border-color:var(--ink); background:var(--panel); }
.copy-btn{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; background:var(--panel);
  border:1px solid var(--line); color:var(--smoke); padding:5px 12px; border-radius:999px;
  cursor:pointer; letter-spacing:0.08em; text-transform:uppercase;
}
.copy-btn:hover{ color:var(--ink); border-color:var(--ink); }
.copy-btn.copied{ color:var(--green); border-color:var(--green); background:var(--green-soft); }

.tags-edit-row{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.tags-edit-row input{ flex:1; }
.tags-edit-row .tlen{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; width:38px; text-align:right;
  color:var(--smoke-dim); flex-shrink:0; font-variant-numeric:tabular-nums;
}
.tags-edit-row .tlen.over{ color:var(--red); font-weight:600; }

/* Buttons — Etsy's own language (pill shape, solid orange primary,

   warmer neutrals instead of Etsy's stark white/black. */
.btn{
  font-family:'Inter Tight',sans-serif; font-weight:700; font-size:13px; padding:11px 22px;
  border-radius:999px; border:1.5px solid var(--line); background:var(--panel);
  color:var(--ink); cursor:pointer; transition:border-color .13s ease, background .13s ease, transform .1s ease;
  letter-spacing:0.005em;
}
.btn:hover:not(:disabled){ border-color:var(--smoke-dim); background:var(--panel-3); }
.btn:active:not(:disabled){ transform:scale(0.98); }
.btn.primary{ background:var(--torch); border-color:var(--torch); color:#fff; box-shadow:0 2px 8px rgba(194,87,28,0.25); }
.btn.primary:hover:not(:disabled){ background:var(--torch-dim); border-color:var(--torch-dim); box-shadow:0 3px 10px rgba(194,87,28,0.32); }

.btn.danger{ border-color:var(--red); color:var(--red); }
.btn.danger:hover:not(:disabled){ background:var(--red-soft); }
.save-bar{

}

}
.result-flash.show{ display:block; }
.result-flash.ok{ background:var(--green-soft); color:var(--green); }
.result-flash.err{ background:var(--red-soft); color:var(--red); }

.fb-states{ display:flex; gap:8px; flex-wrap:wrap; }
.fb-btn{

.fb-btn.active{ background:var(--green-soft); border-color:var(--green); color:var(--green); }

.simple-table{ width:100%; border-collapse:collapse; font-size:13px; }

<script>
// ============================================================
// STATE MODEL
// One object = one source of truth for the session.
// Persisted atomically under a single storage key.
// ============================================================

// REAL STORAGE — window.storage only exists inside Claude's own artifact
// preview; a Worker-hosted page has no such thing. This shim gives every
// call site the same {value} shape but backs it with genuine browser
// localStorage, which actually persists on any real host. Scope: one
// browser, one device — no cross-device sync without a real backend.
const appStorage = {
  async get(key){
    try{
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    }catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); return { key, value }; }
    catch(e){ return null; }
  },
};

const WB_KEY = 'kismet-workbook-v2';
const UI_KEY = 'kismet-ui-state-v2';

let WB = null;      // the whole workbook object
let uiState = { lastTab: 'dashboard' };
let todayISO = new Date().toISOString().slice(0,10);

// ============================================================
// SHOP PROFILES — the real fix for "switching shops is destructive."
// Each shop gets its own namespaced storage (workbook + Etsy connection).
// Switching profiles just changes which namespace is active; nothing is
// ever deleted by switching. Only an explicit "Delete this profile"
// action removes data, and only for that one profile.
// ============================================================
const PROFILES_KEY = 'kismet-profiles-v1';
const ACTIVE_PROFILE_KEY = 'kismet-active-profile-v1';
let profiles = [];       // [{ id, label, createdDate }]
let activeProfileId = null;

function newProfileId(){ return 'shop-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function wbKeyFor(id){ return `kismet-workbook-v2:${id}`; }
function etsyKeyFor(id){ return `kismet-etsy-auth:${id}`; }
function currentProfile(){ return profiles.find(p=>p.id===activeProfileId) || profiles[0]; }

async function loadProfiles(){
  try{
    const r = await appStorage.get(PROFILES_KEY);
    if(r && r.value) profiles = JSON.parse(r.value);
  }catch(e){}
  if(!profiles.length){
    // First run: migrate any existing un-namespaced data into a default profile,
    // so nothing already saved gets orphaned by this change.
    const id = newProfileId();
    profiles = [{ id, label: 'My Shop', createdDate: todayISO }];
    await appStorage.set(PROFILES_KEY, JSON.stringify(profiles));
    try{
      const oldWb = await appStorage.get(WB_KEY);
      if(oldWb && oldWb.value) await appStorage.set(wbKeyFor(id), oldWb.value);
      const oldEtsy = await appStorage.get('kismet-etsy-auth');
      if(oldEtsy && oldEtsy.value) await appStorage.set(etsyKeyFor(id), oldEtsy.value);
    }catch(e){}
  }
  try{
    const r2 = await appStorage.get(ACTIVE_PROFILE_KEY);
    activeProfileId = (r2 && r2.value) ? r2.value : profiles[0].id;
  }catch(e){ activeProfileId = profiles[0].id; }
  if(!profiles.some(p=>p.id===activeProfileId)) activeProfileId = profiles[0].id;
}
async function setActiveProfile(id){
  activeProfileId = id;
  await appStorage.set(ACTIVE_PROFILE_KEY, id);
}
async function createProfile(label){
  const id = newProfileId();
  profiles.push({ id, label, createdDate: todayISO });
  await appStorage.set(PROFILES_KEY, JSON.stringify(profiles));
  return id;
}
async function renameProfile(id, label){
  const p = profiles.find(p=>p.id===id); if(p){ p.label = label; await appStorage.set(PROFILES_KEY, JSON.stringify(profiles)); }
}
async function deleteProfile(id){
  profiles = profiles.filter(p=>p.id!==id);
  if(!profiles.length){ const nid = newProfileId(); profiles = [{ id:nid, label:'My Shop', createdDate: todayISO }]; }
  await appStorage.set(PROFILES_KEY, JSON.stringify(profiles));
  try{ localStorage.removeItem(wbKeyFor(id)); localStorage.removeItem(etsyKeyFor(id)); }catch(e){}
  if(activeProfileId===id) await setActiveProfile(profiles[0].id);
}

// Merge a Bigfoot-style "SEO Drafts" sheet onto its matching catalog SKUs.
// These are proposed rewrites of EXISTING listings, not phantom new products —
// the SKU already exists in the catalog. A draft is "pending" (shows in the
// Draft Queue) unless its own Draft Status already reads DONE/complete, in
// which case the main listing row is trusted as-is and the draft is skipped.
function applyDraftBatch(listings, draftRows, categoryLabel){
  const bySku = {}; listings.forEach(l=>bySku[l.sku]=l);
  draftRows.forEach(d=>{
    const sku = String(d['SKU']||'').padStart(4,'0');
    const target = bySku[sku];
    if(!target) return; // draft references a SKU we don't have — leave it, surfaces nowhere silently
    const draftStatus = d['Draft Status'] || '';
    const isDone = /^DONE/i.test(draftStatus) || /LIVE.*COMPLETE/i.test(d['Source Research']||'');
    if(isDone) return; // already reflected in the live listing row — don't overwrite with stale draft copy
    target.proposedTitle = d['Proposed Title'] || target.proposedTitle;
    target.description = d['Description'] || target.description;
    const tags = String(d['13 Tags']||'').split(',').map(t=>t.trim()).filter(Boolean);
    if(tags.length) target.tags = tags;
    target.pk = d['Primary Keyword'] || target.pk;
    target.pendingDraft = true;
    target.draftStatus = draftStatus;
    target.draftCategory = d['Category'] || categoryLabel;
    target.draftNote = d['Source Research'] || null;
    target.infographicCheckNote = d['Infographic Check'] || null;
  });
}

TARGET BUYER: Makers, CNC plasma and laser operators, fabricators, and sign shops buying digital cut files. NOT finished-sign shoppers, farmhouse-decor shoppers, or gift buyers. No physical item is sold. Every word chosen must speak to someone who will cut this file themselves.

## TITLE

Title construction: Lead with the strongest accurate subject or product phrase supported by Marketplace Insights. Follow with comma-separated descriptive qualifiers and one natural hard identifier showing the product is a digital cut file for CNC plasma and/or laser users. Select from \`DXF\`, \`SVG\`, \`cut file\`, \`CNC cutting file\`, \`plasma cutting file\`, or \`laser cut file\` according to relevance, research evidence, and the actual included formats — never force every identifier into every title.

- SVG before DXF when both are included. Add another format only when actually provided.
- ALL-CAPS limited to three tokens total, and abbreviations count toward that limit — SVG, DXF, PNG, JPG, CNC included. Validated in code, not just in the instructions.
- Never repeat the same significant word three or more times within one title ("Ring Silver Ring Sterling Ring" — hurts readability, doesn't help ranking; Etsy already understands variations).
- **Length:** 15 words or fewer as a scannability guardrail, 140 characters as Etsy's hard limit, **no minimum, never lengthen an accurate title just to hit a range.** A short, correct title is never a problem. (Note: current 2026 sources describe an 80–120 character range as where well-formed titles tend to naturally land — useful as a sanity check, not a target to engineer toward.)

TITLE FAILURE TEST: If the title sounds like a pile of search terms instead of the name of a product, rewrite it. If the first phrase could describe five unrelated designs, it's too vague.

**On duplicates and catalog-level term reuse:**
- Exact duplicate titles should be avoided when the products are materially different.
- Listings within the same family may consistently reuse a proven head-category phrase — that's intentional, accurate coverage of a real catalog, not a problem.
- Listings can still compete for overlapping searches even when titles differ, so don't treat "different title" alone as proof of no overlap.
- Never invent an artificial differentiator — a word the artwork doesn't support — just to make two titles look less alike.
- Each title must identify the actual design clearly enough to distinguish it within the catalog; relevance controls term assignment, not a quota for uniqueness.

## TAGS — a coverage system, not thirteen versions of the same phrase

- Exactly 13. Each 20 characters or fewer, including spaces.
- Natural buyer phrases with spaces, not underscores.
- Cover distinct, accurate buckets: exact subject/product, an alternate name a buyer might search, file/product form, CNC plasma, laser, and a real buyer/use intent where genuinely relevant.

- Title/tag overlap is allowed when the phrase accurately represents an important buyer search — an important, accurate phrase belonging in both is not automatically redundant.

REJECT A TAG IMMEDIATELY IF:
- Over 20 characters.
- Describes a physical finished product instead of the digital file being sold.
- Names an object, animal, state, message, format, machine, or use not present in the listing.
- Exists only because the search volume is attractive, not because it's accurate.
- Repeats another tag with only a singular/plural or word-order change (Etsy matches these automatically).
- One of several tags wasting slots on functionally identical variations without expanding real search coverage.
- Depends on an assumption not checked against the artwork or the actual file package.

## DESCRIPTION

Required opening line, exact: "Welcome to Kismet Cut Ready DXF — cut-ready artwork for CNC plasma and laser."

Then identify the specific design and what the buyer can make with it, primary keyword early and natural — not a tag list. Then, in order:
1. DIGITAL DOWNLOAD stated clearly — no physical product ships
2. What the design is / intended use
3. File types actually included (only what's really in this listing — never assumed)

10. License: buyer may make finished items, may not resell/share/redistribute the files
11. Final reminder: no physical product included

## NON-NEGOTIABLE

- Never invent a design element, audience, occasion, file type, machine compatibility, or use case.
- Never hand over fewer than 13 tags, or any tag over 20 characters.
- Never call keyword stuffing "SEO."
- Legacy titles and tags are clues, not proof. If the artwork doesn't show it and the file package doesn't include it, don't claim it.

// Available formats a shop may offer at all — a listing then picks only
// what it actually includes, and only those may ever appear in the
// title, tags, description, or evidence for that listing.
const DEFAULT_AVAILABLE_FORMATS = ['DXF','DWG','SVG','PNG','JPG','AI','EPS','PDF'];
// Built-in formats plus anything this shop added. Built-ins can be
// unchecked but never deleted, so they stay available if the shop starts
// offering them later; custom entries can be removed outright.
function allShopFormats(){
  return DEFAULT_AVAILABLE_FORMATS.concat((WB.meta.customFormats||[])
    .filter(f=>!DEFAULT_AVAILABLE_FORMATS.includes(f)));
}

// Deterministically builds the final description from enabled blocks, in
// order. A required block with no usable content returns needsReview
// instead of guessing or inserting filler ("size and kerf information
// are not supplied" is exactly the kind of line this must never produce).
function assembleDescription(l, productType, templates, verifiedFacts, aiIntro, aiUse){
  const blocks = (templates[productType]||[]).filter(b=>b.status!=='disabled').sort((a,b)=>a.order-b.order);
  const lines = [];
  const missingRequired = [];
  const vf = verifiedFacts || {};

  const fieldText = {
    includedFormats: (vf.formats && vf.formats.length) ? `Files included: ${vf.formats.join(', ')}.` : '',
    sizeKerfScaling: [vf.dimensions?`Size: ${vf.dimensions}.`:'', vf.kerf?`Kerf: ${vf.kerf}.`:''].filter(Boolean).join(' '),
    personalization: vf.personalization==='Yes' ? 'One free personalization is available with purchase when the existing design permits it.' : '',
    materialsConstruction: vf.materials ? `Materials: ${vf.materials}.` : '',
    dimensions: vf.dimensions ? `Dimensions: ${vf.dimensions}.` : '',
    productionTime: vf.productionTime ? `Production time: ${vf.productionTime}.` : '',
  };

  blocks.forEach(b=>{
    let text = '';
    if(DESC_AI_WRITABLE_BLOCKS.has(b.key)){
      text = b.key==='introAI' ? (aiIntro||'') : (aiUse||'');
    } else if(fieldText.hasOwnProperty(b.key)){
      text = fieldText[b.key];
    } else {
      text = b.defaultText||'';
    }
    if(!text.trim()){
      if(b.status==='required') missingRequired.push(b.name);
      return; // optional-and-empty is omitted, never filled with filler
    }
    lines.push(text.trim());
  });

  if(missingRequired.length){
    return { needsReview:true, missingRequired, description:null };
  }
  return { needsReview:false, missingRequired:[], description: lines.join('\n\n') };
}

TARGET BUYER: Makers, CNC plasma and laser operators, fabricators, and sign shops buying DIGITAL CUT FILES. We are NOT targeting finished-sign shoppers, farmhouse-decor shoppers, or gift buyers. No physical item is sold. Write for someone who will cut this file themselves.

TITLE
Structure: <strongest accurate buyer phrase> SVG, DXF for CNC Plasma, Laser Cutting
Example: Pet Grave Marker SVG, DXF for CNC Plasma, Laser Cutting

- The opening phrase must identify the product, not announce a file type.

- Include CNC Plasma and Laser only when both truthfully apply.

TAGS — a coverage system, not thirteen versions of the same phrase

- Natural buyer phrases with spaces, not underscores.
- Cover distinct accurate buckets: exact subject/product, alternate name, file/product form, CNC plasma, laser, and a real buyer/use intent when relevant.
- Both axes must be represented: subject/product intent AND maker/file intent.
- Reach plasma and laser without wasting several slots on near-identical machine phrases.

REJECT A TAG IMMEDIATELY IF:
- It exceeds 20 characters.
- It describes a physical finished product instead of the digital file being sold.
- It names an object, animal, state, message, format, machine or use not present in the listing.

- It is broad filler that adds no clear buyer path.
- It targets a different listing family.
- It depends on assumptions not checked against the artwork or files.

WORKED EXAMPLES — the left column is right, the right column is the failure to avoid:
beagle welcome sign / NOT dog decor gift
dog memorial stake / NOT sympathy present
bigfoot flag svg / NOT patriotic home decor
iowa farm sign / NOT farmhouse wall art
dxf files for plasma / NOT metal sign

Then identify the specific design and what the buyer can make with it, using the primary keyword early and naturally — not as a tag list. Then:
1. State clearly it's a DIGITAL DOWNLOAD, no physical product ships
2. What the design is / intended use
3. File types actually included (only what's really in this listing — never assume)
4. Cut-ready facts: clean/closed/joined paths, proper spacing

NON-NEGOTIABLE FAILURES
- Never invent a design element, audience, occasion, file type, machine compatibility or use case.
- Never hand over fewer than 13 tags, or tags over 20 characters.
- Never call keyword stuffing "SEO".
- Legacy titles and tags are clues, not proof. If the artwork does not show it or the file package does not include it, do not claim it.`;

// Atomic-ish write + read-back verification. Never returns true unless
// the value we get back actually matches what we sent.
async function persistWorkbook(){
  const payload = JSON.stringify(WB);
  const key = wbKeyFor(activeProfileId);
  let ok = false;
  try{
    const res = await appStorage.set(key, payload);
    if(!res){
      // Almost always a storage-quota failure. Silence here was dangerous:
      // saves stopped working and nothing said so. The previously saved
      // data is still intact — localStorage never deletes on a failed
      // write — but nothing NEW is being kept until space is freed.
      showStorageWarning(payload.length);
    } else {
      const check = await appStorage.get(key);
      ok = !!check && check.value === payload;
      if(!ok) showStorageWarning(payload.length);
    }
  }catch(e){
    console.error('workbook save failed', e);
    showStorageWarning(payload.length);
  }
  // Cloud backup is independent of the local write above — WB in memory is
  // intact even when the local save just failed, so a signed-in account's
  // cloud copy matters most exactly when local storage is the problem.
  scheduleCloudSync();
  return ok;
}
function showStorageWarning(size){

  const mb = (size/1048576).toFixed(1);

  const cloudLine = currentUser
    ? `Your account is signed in, so a cloud backup of this data is already being attempted in the background \u2014 check the Cloud status in the sidebar.`
    : `Sign in (Account tab) so future saves back up automatically, or go to Account \u2192 Download full backup now, to be safe either way.`;
  el.innerHTML = `<div class="banner err" style="margin:0; box-shadow:var(--shadow-lg);"><span class="mono">!</span><span class="fill">
    <b>Changes are not being saved \u2014 browser storage is full.</b><br/>
    Your existing data is still intact (a failed save never deletes), but nothing new will persist until space is freed. Current workbook size: ${mb} MB.<br/>
    Try: Performance tab \u2192 clear old view snapshots. ${cloudLine}
  </span><button onclick="document.getElementById('storageWarnBanner').remove()">Dismiss</button></div>`;

function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Etsy's API returns some text fields (titles especially) with apostrophes
// and other punctuation already HTML-entity-encoded — e.g. "Mother&#39;s
// Day" instead of "Mother's Day". Left as-is, escapeHtml() above then
// re-escapes that entity's own "&", producing "Mother&amp;#39;s Day" in the
// page source, which the browser shows literally as "Mother&#39;s Day" —
// the "apostrophes look weird" bug. Decoding once at the point text comes
// in from Etsy (before it's ever stored or escaped) fixes it at the root
// instead of patching every display site. Uses a <textarea>, not innerHTML
// on a normal element — a textarea's content is parsed as text, never as
// markup, so this can't execute anything even if the input contained tags.
function decodeHtmlEntities(s){
  if(s===null||s===undefined||s==='') return s;
  const ta = document.createElement('textarea');
  ta.innerHTML = String(s);
  return ta.value;
}

// ============================================================
// TREND CHARTS — one small inline-SVG line chart, reused by the listing
// drawer (views/favorites) and the Dashboard (visits/orders/revenue).
// Single series per chart, so no legend box — the section title already
// names what's plotted. Steel is the app's informational color (never
// torch — torch stays reserved for actions), text stays in ink, never
// the series color. Every value shown here also lives in a table
// alongside it; the chart is a second way to see the same numbers, never
// the only way to get them.
// trendChartHtml() returns the markup to drop into a template string;
// call mountTrendChart() with the same args right after that markup is
// actually in the DOM (same two-step pattern the rest of the app uses
// for anything that needs live measurements or event listeners).
// ============================================================
function trendChartHtml(id, points, opts){
  const height = (opts && opts.height) || 92;
  const clean = (points||[]).filter(p=>p.y!=null);
  if(clean.length < 2){
    return `<div class="section-note" style="margin:4px 0 0 0;">${clean.length===1 ? 'One data point so far — a trend needs at least two.' : 'No data yet.'}</div>`;
  }
  return `<div class="trend-chart" id="${id}" style="position:relative; margin:4px 0 2px 0;"></div>`;
}
function mountTrendChart(id, points, opts){
  const el = document.getElementById(id);
  if(!el) return;
  opts = opts || {};
  const height = opts.height || 92;
  const color = opts.color || 'var(--steel)';
  const fillColor = opts.fill || 'var(--steel-soft)';
  const fmt = opts.valueFormat || (v=>String(Math.round(v)));
  const clean = (points||[]).filter(p=>p.y!=null);
  if(clean.length < 2) return;

  const width = Math.max(el.clientWidth || 480, 200);
  const padTop = 18, padBottom = 18, padX = 6;
  const plotH = height - padTop - padBottom;
  const baseline = padTop + plotH;
  const ys = clean.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanY = (maxY - minY) || (Math.abs(maxY) * 0.1) || 1;
  const stepX = (width - padX*2) / (clean.length-1);
  const xAt = i => padX + i*stepX;
  const yAt = v => baseline - ((v - minY) / spanY) * plotH;

  const linePath = clean.map((p,i)=> (i===0?'M':'L') + xAt(i).toFixed(1) + ',' + yAt(p.y).toFixed(1)).join(' ');
  const areaPath = `M${xAt(0).toFixed(1)},${baseline.toFixed(1)} ${clean.map((p,i)=>'L'+xAt(i).toFixed(1)+','+yAt(p.y).toFixed(1)).join(' ')} L${xAt(clean.length-1).toFixed(1)},${baseline.toFixed(1)} Z`;
  const lastX = xAt(clean.length-1), lastY = yAt(clean[clean.length-1].y);
  const labelLeft = lastX > width - 46; // flip the end-label left if it would clip the right edge

  el.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="display:block; overflow:visible;">
      <line x1="${xAt(0).toFixed(1)}" y1="${baseline.toFixed(1)}" x2="${xAt(clean.length-1).toFixed(1)}" y2="${baseline.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${areaPath}" fill="${fillColor}" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line class="tc-crosshair" x1="0" y1="${padTop}" x2="0" y2="${baseline}" stroke="var(--smoke)" stroke-width="1" opacity="0"></line>
      <circle class="tc-hoverdot" r="5" fill="${color}" stroke="var(--panel)" stroke-width="2" opacity="0"></circle>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="${color}" stroke="var(--panel)" stroke-width="2"></circle>
      <text x="${(labelLeft ? lastX-8 : lastX+8).toFixed(1)}" y="${Math.max(10,lastY-8).toFixed(1)}" text-anchor="${labelLeft?'end':'start'}" font-family="'IBM Plex Mono',monospace" font-size="11" font-weight="600" fill="var(--ink)">${escapeHtml(fmt(clean[clean.length-1].y))}</text>
      <rect class="tc-hitlayer" x="0" y="0" width="${width}" height="${height}" fill="transparent"></rect>
    </svg>
    <div class="tc-tooltip" style="position:absolute; pointer-events:none; opacity:0; background:var(--ink); color:#fff; font-size:11px; font-family:'IBM Plex Mono',monospace; padding:4px 8px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-100%); top:0; left:0; z-index:5; transition:opacity .1s;"></div>
  `;

  const svg = el.querySelector('svg');
  const hit = el.querySelector('.tc-hitlayer');
  const crosshair = el.querySelector('.tc-crosshair');
  const hoverDot = el.querySelector('.tc-hoverdot');
  const tooltip = el.querySelector('.tc-tooltip');

  function nearestIndex(clientX){
    const rect = svg.getBoundingClientRect();
    const svgX = (clientX - rect.left) / rect.width * width;
    return Math.max(0, Math.min(clean.length-1, Math.round((svgX - padX) / stepX)));
  }
  function showAt(clientX){
    const i = nearestIndex(clientX);
    const p = clean[i];
    const x = xAt(i), y = yAt(p.y);
    crosshair.setAttribute('x1', x.toFixed(1)); crosshair.setAttribute('x2', x.toFixed(1));
    crosshair.setAttribute('opacity', '1');
    hoverDot.setAttribute('cx', x.toFixed(1)); hoverDot.setAttribute('cy', y.toFixed(1));
    hoverDot.setAttribute('opacity', '1');
    const svgRect = svg.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    tooltip.style.left = (svgRect.left + (x/width)*svgRect.width - elRect.left) + 'px';
    tooltip.style.top = (svgRect.top + (y/height)*svgRect.height - elRect.top - 8) + 'px';
    tooltip.style.opacity = '1';
    tooltip.textContent = `${p.x} · ${fmt(p.y)}`; // p.x is our own ISO date / label, but textContent keeps this safe regardless
  }
  function hide(){
    crosshair.setAttribute('opacity','0');
    hoverDot.setAttribute('opacity','0');
    tooltip.style.opacity = '0';
  }
  hit.addEventListener('pointermove', e=> showAt(e.clientX));
  hit.addEventListener('pointerleave', hide);
}

// NAV
// ============================================================
// ============================================================
// CHECK TYPES — every warning in the app belongs to a named type
// (parsed from the batch flag text, or a built-in like SKU CHECK).
// A type can be turned off for the whole shop: once off, it's not
// dismissed for now, it's genuinely gone — never counted, never shown,
// anywhere, until someone turns it back on. This is the real fix for
// checks that don't matter to a given shop.
// ============================================================
function flagType(flagText){
  const m = String(flagText||'').match(/^([A-Z][A-Z0-9 \-]{2,40}):/);
  return m ? m[1].trim() : 'OTHER';
}
function checkTypeEnabled(type){ return !(WB.meta.disabledCheckTypes||[]).includes(type); }
async function setCheckTypeEnabled(type, enabled){
  const list = WB.meta.disabledCheckTypes || (WB.meta.disabledCheckTypes = []);
  const has = list.includes(type);
  if(enabled && has) WB.meta.disabledCheckTypes = list.filter(t=>t!==type);
  if(!enabled && !has) list.push(type);
  await persistWorkbook();
}
// Flags on a listing that actually count right now — filtered to only
// types that are still switched on. A listing with zero visible flags is
// simply not flagged, regardless of what its raw batchFlags array holds.
function visibleFlags(l){
  return (l.batchFlags||[]).filter(f=>checkTypeEnabled(flagType(f)));
}
// Every check type currently in play across the shop, for the settings list.
function allKnownCheckTypes(){
  const types = new Set(['SKU CHECK']);
  (WB.listings||[]).forEach(l=>(l.batchFlags||[]).forEach(f=>types.add(flagType(f))));
  return Array.from(types).sort();
}

// A dismissed item stays dismissed permanently (persisted), until it's
// explicitly un-dismissed or the underlying data genuinely changes and
// re-triggers the check under a new key.
function isDismissed(category, key){
  return ((WB.meta.dismissedAttention||{})[category]||[]).includes(String(key));
}
async function dismissAttnItem(category, key){
  if(!WB.meta.dismissedAttention) WB.meta.dismissedAttention = {};
  if(!WB.meta.dismissedAttention[category]) WB.meta.dismissedAttention[category] = [];
  const k = String(key);
  if(!WB.meta.dismissedAttention[category].includes(k)) WB.meta.dismissedAttention[category].push(k);
  await persistWorkbook();
}
async function dismissAttnAll(category, keys){
  if(!WB.meta.dismissedAttention) WB.meta.dismissedAttention = {};
  const existing = WB.meta.dismissedAttention[category] || [];
  WB.meta.dismissedAttention[category] = Array.from(new Set(existing.concat(keys.map(String))));
  await persistWorkbook();
}

function attentionIssues(){
  const issues = { missingInfographic:[], badTags:[], draftNotLive:[], updatedNoCloseout:[], closeoutNoCompletion:[], missingSku:[], externallyChanged:[], stale:false };
  WB.listings.forEach(l=>{
    const live = l.status && l.status.startsWith('UPDATED');
    if(WB.meta.infographicEnabled !== false && live && !['DONE','NOT NEEDED'].includes(l.infographic)) issues.missingInfographic.push(l);
    if(live && (l.tags.length!==13 || l.tags.some(t=>t.length>20))) issues.badTags.push(l);
    if(l.isDraft && live) issues.draftNotLive.push(l);
    if(l.pendingDraft && live) issues.draftNotLive.push(l); // flag stayed set after it actually went live
    if(live){
      const inCloseout = WB.sessionCloseout.some(c=>c.sku===l.sku);
      if(!inCloseout) issues.updatedNoCloseout.push(l);
    }
    if(l.etsyChangedExternally) issues.externallyChanged.push(l);
  });
  WB.sessionCloseout.forEach(c=>{
    const inCompletion = WB.completionCheck.some(cc=>cc.sku===c.sku);
    if(!inCompletion) issues.closeoutNoCompletion.push(c);
  });
  // Missing SKUs found by the last Etsy import. These aren't in WB.listings
  // at all (no SKU means nothing to key them on), so they come from the
  // saved import findings rather than the listings array.
  issues.missingSku = checkTypeEnabled('SKU CHECK') ? ((WB.skuIssues && WB.skuIssues.missing) || []) : [];
  issues.skuDupes = checkTypeEnabled('SKU CHECK') ? ((WB.skuIssues && WB.skuIssues.dupes) || []) : [];

  // Apply dismissals — a dismissed item is genuinely gone from the count
  // and every card, not just hidden for this session.
  issues.missingInfographic = issues.missingInfographic.filter(l=>!isDismissed('missingInfographic', l.sku));
  issues.badTags = issues.badTags.filter(l=>!isDismissed('badTags', l.sku));
  issues.draftNotLive = issues.draftNotLive.filter(l=>!isDismissed('draftNotLive', l.sku));
  issues.updatedNoCloseout = issues.updatedNoCloseout.filter(l=>!isDismissed('updatedNoCloseout', l.sku));
  issues.closeoutNoCompletion = issues.closeoutNoCompletion.filter(c=>!isDismissed('closeoutNoCompletion', c.sku+'|'+c.workDate));
  issues.externallyChanged = issues.externallyChanged.filter(l=>!isDismissed('externallyChanged', l.sku));
  issues.missingSku = issues.missingSku.filter(m=>!isDismissed('missingSku', m.listingId || m.title));
  issues.skuDupes = issues.skuDupes.filter(d=>!isDismissed('skuDupes', d.sku));

  issues.stale = !WB.meta.importedAt;
  return issues;
}
function attentionCount(){
  const i = attentionIssues();
  return i.missingInfographic.length + i.badTags.length + i.draftNotLive.length +
         i.updatedNoCloseout.length + i.closeoutNoCompletion.length +
         i.missingSku.length + (i.skuDupes||[]).length +
         i.externallyChanged.length;
}

function cloudSyncLabel(){
  switch(cloudSyncState.status){
    case 'pending': return 'saving soon…';
    case 'syncing': return 'backing up…';
    case 'error':   return 'backup failed';
    case 'ok': {
      const mins = Math.round((Date.now() - cloudSyncState.lastSyncedAt) / 60000);
      if(mins < 1) return 'backed up just now';
      if(mins < 60) return `backed up ${mins}m ago`;
      const hrs = Math.round(mins/60);
      if(hrs < 24) return `backed up ${hrs}h ago`;
      return `backed up ${Math.round(hrs/24)}d ago`;
    }
    default: return 'not backed up yet';
  }
}

// ============================================================
// IMPORT / EXPORT (the real "one source of truth" mechanism)
// ============================================================
function parseSheetRows(ws){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
  if(!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).filter(r=>r.some(v=>v!==null && v!=='')).map(r=>{
    const o = {}; headers.forEach((h,i)=>{ if(h) o[h]=r[i]; }); return o;
  });
}

// Sample/template files use this SKU prefix. If any row carries it, the
// whole import is refused — not silently skipped — so an example row can
// never end up mixed into real shop data by accident.
const RESERVED_SAMPLE_PREFIX = 'DEMO-';

async function handleImportFile(file){
  const buf = await file.arrayBuffer();
  const wbx = XLSX.read(buf, { type:'array', cellDates:true });
  const listingSheets = wbx.SheetNames.filter(n=>/^Listings /.test(n));
  let importedListings = [];
  const sampleRowsFound = [];
  listingSheets.forEach(name=>{
    const rows = parseSheetRows(wbx.Sheets[name]);
    rows.forEach(r=>{
      if(!r['Shop Row']) return;
      const skuVal = String(r['SKU']||'');
      if(skuVal.startsWith(RESERVED_SAMPLE_PREFIX)){
        sampleRowsFound.push({ sku:skuVal, title:r['Current Title']||'' });
        return;
      }
      importedListings.push({
        row: r['Shop Row'], sku: skuVal.padStart(4,'0'),
        status: r['Status']||'NOT REVIEWED', priority: r['Priority']||null,
        oldTitle: r['Current Title']||'', proposedTitle:'', description:'',
        tags: String(r['Current Tags']||'').split(',').map(t=>t.trim()).filter(Boolean),
        oldTags: String(r['Current Tags']||'').split(',').map(t=>t.trim()).filter(Boolean),
        price: r['Price'], pk: r['Primary Keyword']||null, sk: r['Secondary Keywords']||null,
        infographic: r['Infographic Needed / Done']||null,
        googleSeo: r['Google SEO Checked']||'No', notes: r['Performance / Notes']||null,
        liveDate: r['Date Updated Live']||null,
        fbStatus: r['FB Post Done']==='Yes' ? 'PUBLISHED':'NOT_POSTED',
        fbDate:null, fbLink:null, isDraft:false,
        pendingDraft:false, draftStatus:null, draftCategory:null, draftNote:null, infographicCheckNote:null,
      });
    });
  });
  // A file with sample rows still in it is refused entirely — nothing from
  // it is imported, real rows included, so there's no partial state to
  // second-guess. The error names exactly what to delete.
  if(sampleRowsFound.length){
    return {
      ok:false,
      message:`This file still has ${sampleRowsFound.length} example row(s) from the template (SKU starts with "${RESERVED_SAMPLE_PREFIX}"). Nothing was imported. Delete these rows and re-upload: ${sampleRowsFound.slice(0,10).map(r=>`${r.sku} (${r.title})`).join(', ')}${sampleRowsFound.length>10?'…':''}`,
    };
  }
  // preserve in-app edits (proposedTitle/description/tags edits/fb records/drafts)
  // for SKUs that already exist in WB, by merging onto the freshly imported row.
  const bySku = {}; WB.listings.forEach(l=>bySku[l.sku]=l);
  importedListings = importedListings.map(nl=>{
    const old = bySku[nl.sku];
    if(!old) return nl;
    return Object.assign({}, nl, {
      proposedTitle: old.proposedTitle, description: old.description,
      fbDate: old.fbDate, fbLink: old.fbLink,
      // tags: prefer imported tags UNLESS she has an in-progress edit different from the old import
      tags: nl.tags.length ? nl.tags : old.tags,
    });
  });

  // any sheet that looks like a "SEO Drafts" batch (has a Draft Status column)
  // gets merged onto its matching catalog SKUs, same as the seed does.
  wbx.SheetNames.forEach(name=>{
    if(!/draft/i.test(name)) return;
    const rows = parseSheetRows(wbx.Sheets[name]);
    if(!rows.length || !('Draft Status' in rows[0])) return;
    applyDraftBatch(importedListings, rows, name.replace(/SEO Drafts?/i,'').trim() || name);
  });

  // drafts that only exist in-app (added via + Add to draft queue, not in any workbook sheet) stay
  const importedSkus = new Set(importedListings.map(l=>l.sku));
  const draftsOnly = WB.listings.filter(l=>l.isDraft && !importedSkus.has(l.sku));
  WB.listings = importedListings.concat(draftsOnly);

  if(wbx.SheetNames.includes('Completion Check')){
    WB.completionCheck = parseSheetRows(wbx.Sheets['Completion Check']).filter(r=>r['SKU']).map(r=>({
      sku:r['SKU'], listing:r['Exact Etsy Listing'], etsyStatus:r['Etsy Status'], liveDate:r['Live Date'],
      infographic:r['Infographic'], fbPost:r['FB Post'], auditResult:r['Audit Result'], notes:r['Notes'],
    }));
  }
  if(wbx.SheetNames.includes('Session Closeout')){
    WB.sessionCloseout = parseSheetRows(wbx.Sheets['Session Closeout']).filter(r=>r['SKU']).map(r=>({
      workDate:r['Work Date'], sku:r['SKU'], listing:r['Exact Etsy Listing'], completionEvidence:r['Completion Evidence'],
      etsyStatus:r['Etsy Status'], infographic:r['Infographic'], fbPost:r['FB Post'],
      morningReconciled:r['Morning Reconciled'], notes:r['Closeout Notes']||r['Notes'],
      eodReportRun:r['EOD Report Run']||null, statsCaptured:r['Stats Captured']||null,
      listingTrackingUpdated:r['Listing Tracking Updated']||null, adStatusSynced:r['Ad Status Synced']||null,
    }));
  }
  if(wbx.SheetNames.includes('Finished SEO Audit')){
    WB.audit = parseSheetRows(wbx.Sheets['Finished SEO Audit']).filter(r=>r['Shop Row']);
  }
  WB.meta.importedAt = todayISO;
  WB.meta.source = 'IMPORTED: ' + file.name;
  const ok = await persistWorkbook();
  return { ok, message: ok ? `Imported ${file.name}. This is now the source of truth for the session.` : 'Import failed — file not applied.' };
}

function downloadJSONFile(filename, obj){
  const blob = new Blob([JSON.stringify(obj)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function workbookStorageBreakdown(){
  const rows = WB_STORAGE_BREAKDOWN_KEYS.map(([key,label])=>{
    const val = WB[key];
    const bytes = (val===undefined || val===null) ? 0 : JSON.stringify(val).length;
    const count = Array.isArray(val) ? val.length : null;
    return { key, label, bytes, count };
  }).sort((a,b)=>b.bytes-a.bytes);
  const totalBytes = JSON.stringify(WB).length;
  const accountedBytes = rows.reduce((s,r)=>s+r.bytes,0);
  return { rows, totalBytes, otherBytes: Math.max(0, totalBytes-accountedBytes) };
}

// The real "export a backup" — exportWorkbook() below only writes what fits
// a spreadsheet (listings, completion, closeout), the same fields
// handleImportFile() reads back. Keyword research, view/favorite history,
// projects, restore points, push log, and Playbook edits never round-trip
// through that pair. This is the whole WB object, so a restore from it is
// indistinguishable from never having lost anything.
function downloadFullBackup(){
  downloadJSONFile(`Kismet_Full_Backup_${todayISO}.json`, WB);
}
async function handleFullBackupImport(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ return { ok:false, message:'That file isn\'t valid JSON — could not read it as a backup.' }; }
  if(!data || !Array.isArray(data.listings) || !data.meta){
    return { ok:false, message:'That doesn\'t look like a Kismet full backup file.' };
  }
  WB = data;
  const ok = await persistWorkbook();
  return { ok, message: ok ? 'Full backup restored — every field, not just listings.' : 'Restored in memory, but saving locally failed.' };
}

function exportWorkbook(){
  const wbx = XLSX.utils.book_new();
  const liveListings = WB.listings.filter(l=>!l.isDraft);
  // Chunk into groups of 100 for the sheet split, same shape as the
  // original workbook — but never trust `row` to exist. Etsy-imported
  // listings never had one (row was a workbook-only concept), and relying
  // on it here silently crashed the whole export with no error shown.
  const chunks = [[],[],[],[],[],[]];
  liveListings.forEach((l,i)=>{
    const idx = Math.min(5, Math.floor(i/100));
    chunks[idx].push({
      'Shop Row': l.row ?? (i+1), 'Status': l.status, 'Priority': l.priority,
      'Current Title': l.proposedTitle || l.oldTitle, 'Current Tags': l.tags.join(','),
      'Price': l.price, 'SKU': l.sku, 'Primary Keyword': l.pk, 'Secondary Keywords': l.sk,
      'Infographic Needed / Done': l.infographic, 'Google SEO Checked': l.googleSeo,
      'FB Post Done': l.fbStatus==='PUBLISHED'?'Yes':'No',
      'Date Researched': null, 'Date Updated Live': l.liveDate, 'Performance / Notes': l.notes,
    });
  });
  const names = ['Listings 1-100','Listings 101-200','Listings 201-300','Listings 301-400','Listings 401-500','Listings 501-521'];
  chunks.forEach((rows,i)=>{ if(rows.length) XLSX.utils.book_append_sheet(wbx, XLSX.utils.json_to_sheet(rows), names[i]); });

  XLSX.utils.book_append_sheet(wbx, XLSX.utils.json_to_sheet(WB.completionCheck.map(c=>({
    'SKU':c.sku,'Exact Etsy Listing':c.listing,'Etsy Status':c.etsyStatus,'Live Date':c.liveDate,
    'Infographic':c.infographic,'FB Post':c.fbPost,'Audit Result':c.auditResult,'Notes':c.notes,
  }))), 'Completion Check');

  XLSX.utils.book_append_sheet(wbx, XLSX.utils.json_to_sheet(WB.sessionCloseout.map(c=>({
    'Work Date':c.workDate,'SKU':c.sku,'Exact Etsy Listing':c.listing,'Completion Evidence':c.completionEvidence,
    'Etsy Status':c.etsyStatus,'Infographic':c.infographic,'FB Post':c.fbPost,
    'Morning Reconciled':c.morningReconciled,'Notes':c.notes,
  }))), 'Session Closeout');

  const draftRows = WB.listings.filter(l=>l.isDraft).map(l=>({
    'SKU':l.sku,'Title':l.proposedTitle||l.oldTitle,'Tags':l.tags.join(','),'Status':'DRAFT — NOT LIVE',
  }));
  if(draftRows.length) XLSX.utils.book_append_sheet(wbx, XLSX.utils.json_to_sheet(draftRows), 'Draft Queue');

  XLSX.writeFile(wbx, `Kismet_Ops_Export_${todayISO}.xlsx`);
}

// DASHBOARD
// ============================================================
// The kerf gauge — the signature element. Read like a machinist's rule:
// 50 minor divisions, every 10th a major with its figure, and a torch
// head sitting at the cut position. The figures are real listing counts,
// so the scale means something rather than decorating a progress bar.
function kerfRuler(done, total, label){
  const pct = total ? (done/total)*100 : 0;
  const divisions = 50;
  let tickHtml = '';
  for(let i=1;i<=divisions;i++){
    const major = i % 10 === 0;
    const num = Math.round((i/divisions)*total);
    tickHtml += `<div class="kerf-tick ${major?'major':''}">${major?`<span class="num">${num}</span>`:''}</div>`;
  }
  // Keep the readout inside the frame at both extremes.
  const labelPos = Math.min(Math.max(pct, 8), 92);
  return `<div class="kerf-ruler" role="img" aria-label="${done} of ${total} listings updated">
    <div class="kerf-fill" style="width:${pct}%"></div>
    <div class="kerf-ticks">${tickHtml}</div>
    <div class="kerf-head" style="left:${pct}%"></div>
    <div class="kerf-label" style="left:${labelPos}%">${label}</div>
  </div>`;
}
function capsuleProgress(done, total, label){
  const pct = total ? (done/total)*100 : 0;
  return `<div class="capsule-progress">
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="label">${label}</div>
  </div>`;
}
function statCard(k,v,d){
  const dcls = d && d.startsWith('-') ? 'down' : (d && d.startsWith('+') ? 'up':'');
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="d ${dcls}">${d||''}</div></div>`;
}

// ============================================================
// SHOP HEALTH — mechanical checks across every live listing. Nothing
// here needs a fresh API call; it's all computable from data already
// held. Each category becomes a one-click project with the right scope
// already picked for that kind of problem.
// ============================================================
// Real research (Very high / High conversion) whose significant words don't
// appear ANYWHERE across the shop's current titles or tags — a genuine,
// checkable opportunity sitting unused, not a guess at "might help."
function unusedKeywordOpportunities(){
  const live = WB.listings.filter(l=>!l.isDraft);
  const usedWords = new Set();
  live.forEach(l=>{
    const text = ((l.proposedTitle||l.oldTitle||'') + ' ' + (l.tags||[]).join(' ')).toLowerCase();
    text.split(/[^a-z0-9]+/).filter(w=>w.length>2).forEach(w=>usedWords.add(w));
  });
  const strong = new Set(['Very high','High']);
  return (WB.keywordResearch||[]).filter(k=>{
    if(!strong.has((k.conversion||'').trim())) return false;
    const kwords = k.keyword.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2);
    return kwords.length>0 && !kwords.some(w=>usedWords.has(w));
  });
}

// Sums views across every tracked listing, per day — the shop-wide trend,
// not any one listing's. Only days that actually have data are included.
function shopWideViewTrend(){
  const byDate = {};
  (WB.viewSnapshots||[]).forEach(v=>{
    if(v.views==null) return;
    byDate[v.date] = (byDate[v.date]||0) + v.views;
  });
  return Object.entries(byDate).map(([date,total])=>({date,total})).sort((a,b)=>a.date.localeCompare(b.date));
}
// Charting is handled by trendChartHtml()/mountTrendChart() (defined below,
// near findListing) — one shared hover-enabled line chart used here and in
// the listing drawer, replacing what used to be a bare, non-interactive
// per-page sparkline.

// A single overall score: what share of listings are clean across every
// enabled check. Deliberately simple and explainable — a listing counts
// as clean if it appears in zero categories. No weighting, because any
// weighting I invented would be a guess dressed up as a measurement.
function shopHealthScore(health, liveCount){
  if(!liveCount) return { pct:100, clean:0, total:0, flagged:0 };
  const flaggedSkus = new Set();
  Object.keys(HEALTH_META).forEach(k=>{
    (health[k]||[]).forEach(l=>{
      if(!isDismissed('health:'+k, l.sku)) flaggedSkus.add(l.sku);
    });
  });
  const clean = liveCount - flaggedSkus.size;
  return { pct: Math.round((clean/liveCount)*100), clean, total: liveCount, flagged: flaggedSkus.size };
}

function shopHealthScoreBar(score){
  const colour = score.pct>=80 ? 'var(--green)' : (score.pct>=50 ? 'var(--amber)' : 'var(--red)');
  return `<div class="card" style="margin-bottom:16px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
      <div class="k">OVERALL SHOP HEALTH</div>
      <div style="font-family:'Inter Tight',sans-serif; font-size:22px; font-weight:700; color:${colour}; letter-spacing:-0.01em;">${score.pct}%</div>
    </div>
    <div class="capsule-progress" style="margin:0 0 8px 0;">
      <div class="track"><div class="fill" style="width:${score.pct}%; background:${colour};"></div></div>
    </div>
    <div class="section-note" style="margin:0;">${score.clean} of ${score.total} listings have nothing flagged \u00b7 ${score.flagged} need something. A listing counts once no matter how many checks it trips.</div>
  </div>`;
}

function shopHealth(){
  const live = WB.listings.filter(l=>!l.isDraft);
  const health = { fewTags:[], longTags:[], longTitle:[], dupeTitle:[], redundantTags:[], pluralWaste:[], noDescription:[], stale:[], repeatedWord:[], flatViews:[], draftNotPushed:[], noVerifiedFacts:[], noSection:[] };
  // SKUs already pushed by some project — used to spot written-but-never-live work.
  const pushedSkus = new Set((WB.projects||[]).flatMap(p=>p.pushed||[]));
  const titleGroups = {};
  live.forEach(l=>{
    const title = (l.proposedTitle || l.oldTitle || '').trim();
    const tags = l.tags || [];
    if(tags.length<13) health.fewTags.push(l);
    // Real work sitting idle: a draft was written but never went live.
    if((l.proposedTitle||'').trim() && !pushedSkus.has(l.sku)) health.draftNotPushed.push(l);
    // Without confirmed formats, AI generation has nothing solid to work from.
    if(!((l.verifiedFacts&&l.verifiedFacts.formats)||[]).length) health.noVerifiedFacts.push(l);
    // Unsectioned listings are hard for buyers to browse.
    if(!l.shopSectionId) health.noSection.push(l);
    if(tags.some(t=>t.length>20)) health.longTags.push(l);
    // 2026 guidance describes an 80-120 character sweet spot, not a hard
    // sub-70 cutoff — 140 is Etsy's real hard limit and is already
    // enforced separately at push time. This flag is about trimming
    // bloat, not a search-visibility cliff.
    if(title.length>120) health.longTitle.push(l);
    // A listing only counts as missing a description if there's neither a
    // live one from Etsy nor a new draft in progress — checking only the
    // draft field was the bug: every freshly-imported listing looked
    // "missing" even with a perfectly good live description.
    const hasDesc = (l.description && l.description.trim()) || (l.oldDescription && l.oldDescription.trim());
    if(!hasDesc) health.noDescription.push(l);
    if(l.etsyLastModified && (Date.now()/1000 - l.etsyLastModified) > 365*86400) health.stale.push(l);

    const titleWords = new Set(title.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean));
    if(tags.some(t=>{
      const tw = t.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
      return tw.length>0 && tw.every(w=>titleWords.has(w));
    })) health.redundantTags.push(l);

    const tagSet = new Set(tags.map(t=>t.toLowerCase().trim()));
    let pluralWaste = false;
    tagSet.forEach(t=>{ if(t.endsWith('s') && tagSet.has(t.slice(0,-1))) pluralWaste = true; });
    if(pluralWaste) health.pluralWaste.push(l);

    // A word genuinely repeated within one title ("Ring Silver Ring
    // Sterling Ring") — different from the same word appearing across
    // many DIFFERENT listings, which is normal and expected for a
    // catalog of similar products. File-type/process vocabulary is
    // exempted since "SVG, DXF for CNC Plasma, Laser Cutting" legitimately
    // repeats short structural words.
    const wordCounts = {};
    title.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2 && !AI_ALLOWED_VOCAB.has(w)).forEach(w=>{
      wordCounts[w] = (wordCounts[w]||0)+1;
    });
    if(Object.values(wordCounts).some(c=>c>=3)) health.repeatedWord.push(l);

    // Flat or declining views — only evaluated once there's enough
    // history to mean anything (roughly two weeks), so a listing just
    // starting to be tracked is never wrongly flagged.
    const hist = viewHistoryFor(l.sku);
    if(hist.length>=2){
      const first = hist[0], last = hist[hist.length-1];
      const daySpan = (new Date(last.date) - new Date(first.date)) / 86400000;
      if(daySpan>=10 && first.views!=null && last.views!=null && (last.views - first.views)<=0){
        health.flatViews.push(l);
      }
    }

    if(title) (titleGroups[title.toLowerCase()] = titleGroups[title.toLowerCase()]||[]).push(l);
  });
  Object.values(titleGroups).forEach(group=>{ if(group.length>1) health.dupeTitle.push(...group); });
  return health;
}

function renderArtworkDescription(d){

  return `<div class="banner ${cls}" style="margin:0;"><span class="mono">${conf==='high'?'✓':'!'}</span><span class="fill">
    <b>Seen in the photo:</b> ${escapeHtml(d.mainSubject||'(unclear)')}${d.confidence?` <span class="section-note" style="display:inline;">(confidence: ${escapeHtml(d.confidence)})</span>`:''}

function etsyDaysAgo(unixSeconds){
  const days = Math.floor((Date.now()/1000 - unixSeconds) / 86400);
  if(days<=0) return 'today';
  if(days===1) return '1 day ago';
  return `${days} days ago`;
}
function statusBadge(status){
  if(status === 'UPDATED*') return `<span class="badge updated2">UPDATED*</span>`;
  if(status === 'UPDATED') return `<span class="badge updated">UPDATED</span>`;
  return `<span class="badge notreviewed">NOT REVIEWED</span>`;
}

let listState = { search:'', status:'ALL', project:'ALL', page:0, pageSize:25, sortCol:null, sortDir:'asc' };
function filteredListings(){
  const s = listState.search.trim().toLowerCase();
  let rows = WB.listings.filter(l=>{
    if(l.isDraft) return false;
    if(listState.status!=='ALL' && l.status!==listState.status) return false;
    if(listState.project!=='ALL' && !projectsFor(l.sku).some(p=>p.id===listState.project)) return false;
    if(s){
      const hay = (l.oldTitle+' '+l.tags.join(',')+' '+l.sku+' '+(l.pk||'')).toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
  if(listState.sortCol){
    const col = listState.sortCol, dir = listState.sortDir==='asc' ? 1 : -1;
    rows = rows.slice().sort((a,b)=>{
      let av, bv;
      if(col==='sku'){ av=a.sku; bv=b.sku; }
      else if(col==='status'){ av=a.status; bv=b.status; }
      else if(col==='title'){ av=(a.oldTitle||'').toLowerCase(); bv=(b.oldTitle||'').toLowerCase(); }
      else if(col==='price'){ av=parseFloat(a.price)||0; bv=parseFloat(b.price)||0; }
      else if(col==='updated'){ av=a.etsyLastModified||0; bv=b.etsyLastModified||0; }
      if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0;
    });
  }
  return rows;
}
function sortArrow(col){
  if(listState.sortCol!==col) return '';
  return listState.sortDir==='asc' ? ' ▲' : ' ▼';
}
function renderListings(){
  const filtered = filteredListings();
  const totalPages = Math.max(1, Math.ceil(filtered.length/listState.pageSize));
  listState.page = Math.min(listState.page, totalPages-1);
  const start = listState.page*listState.pageSize;
  const pageItems = filtered.slice(start, start+listState.pageSize);

  let html = `<div class="toolbar">
    <input class="search" id="searchInput" placeholder="Search title, tags, SKU, keyword…" value="${escapeHtml(listState.search)}"/>
    <select class="filt" id="statusFilt">
      <option value="ALL" ${listState.status==='ALL'?'selected':''}>All statuses</option>
      <option value="NOT REVIEWED" ${listState.status==='NOT REVIEWED'?'selected':''}>Not reviewed</option>
      <option value="UPDATED" ${listState.status==='UPDATED'?'selected':''}>Updated</option>
      <option value="UPDATED*" ${listState.status==='UPDATED*'?'selected':''}>Updated*</option>
    </select>
    <select class="filt" id="prioFilt">
      <option value="ALL" ${listState.project==='ALL'?'selected':''}>All projects</option>

    </select>
    <span class="count-pill">${filtered.length} of ${WB.listings.filter(l=>!l.isDraft).length}</span>
  </div>
  <div class="table-wrap">
    <div class="trow head">
      <div class="sortable-h" data-sort="sku" style="cursor:pointer;">SKU${sortArrow('sku')}</div>
      <div class="sortable-h" data-sort="status" style="cursor:pointer;">STATUS${sortArrow('status')}</div>
      <div class="sortable-h" data-sort="title" style="cursor:pointer;">TITLE${sortArrow('title')}</div>
      <div class="sortable-h" data-sort="price" style="cursor:pointer;">PRICE${sortArrow('price')}</div>
      <div class="sortable-h" data-sort="updated" style="cursor:pointer;">UPDATED${sortArrow('updated')}</div>
      <div>PROJECT</div>
    </div>
    <div>${pageItems.map(l=>`
      <div class="trow" data-sku="${l.sku}">
        <div class="c-sku">${l.sku}</div><div>${statusBadge(l.status)}</div>
        <div class="c-title">${escapeHtml(l.oldTitle)}</div><div class="c-price">$${l.price}</div>
        <div class="c-price">${l.etsyLastModified ? etsyDaysAgo(l.etsyLastModified) : '—'}</div>
        <div>${projectsFor(l.sku).slice(0,2).map(p=>`<span class="badge draft" style="margin-right:3px;">${escapeHtml(p.name.slice(0,10))}</span>`).join('')}</div>
      </div>`).join('') || '<div class="empty-hint">No listings match those filters.</div>'}
    </div>
  </div>
  <div class="pager">
    <button id="prevPg" ${listState.page===0?'disabled':''}>← Prev</button>
    <span class="pg">Page ${listState.page+1} / ${totalPages}</span>
    <button id="nextPg" ${listState.page>=totalPages-1?'disabled':''}>Next →</button>
  </div>`;
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('.sortable-h').forEach(el=>{
    el.addEventListener('click', ()=>{
      const col = el.dataset.sort;
      if(listState.sortCol===col){ listState.sortDir = listState.sortDir==='asc' ? 'desc' : 'asc'; }
      else { listState.sortCol = col; listState.sortDir = 'asc'; }
      listState.page = 0;
      renderListings();

  document.getElementById('searchInput').addEventListener('input', e=>{
    listState.search=e.target.value; listState.page=0; renderListings();
    // Re-render destroys and recreates this input, which drops focus after
    // every keystroke — restore it so typing doesn't feel broken.
    const el = document.getElementById('searchInput');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  document.getElementById('statusFilt').addEventListener('change', e=>{ listState.status=e.target.value; listState.page=0; renderListings(); });
  document.getElementById('prioFilt').addEventListener('change', e=>{ listState.project=e.target.value; listState.page=0; renderListings(); });
  document.getElementById('prevPg').addEventListener('click', ()=>{ listState.page--; renderListings(); });
  document.getElementById('nextPg').addEventListener('click', ()=>{ listState.page++; renderListings(); });
  document.querySelectorAll('.trow[data-sku]').forEach(el=> el.addEventListener('click', ()=> openDrawer(el.dataset.sku)));
}

function computeGates(l){
  const gates = [];
  gates.push({ key:'live', pass: !!l.liveDate, label:'Listing pushed live (live date entered)' });
  if(WB.meta.infographicEnabled !== false){
    const label = WB.meta.infographicLabel || 'Infographic';
    gates.push({ key:'infographic', pass: ['DONE','NOT NEEDED'].includes(l.infographic), label:`${label} decision recorded (DONE or NOT NEEDED)` });
  }
  gates.push({ key:'tagcount', pass: l.tags.length===13, label:`Exactly 13 tags (currently ${l.tags.length})` });
  const overLen = l.tags.filter(t=>t.length>20);
  gates.push({ key:'taglen', pass: l.tags.length>0 && overLen.length===0, label: overLen.length ? `All tags ≤20 chars (${overLen.length} over)` : 'All tags ≤20 chars' });
  gates.push({ key:'title', pass: !!(l.proposedTitle && l.proposedTitle.trim()), label:'Proposed title entered' });
  gates.push({ key:'desc', pass: !!(l.description && l.description.trim()), label:'Description entered' });
  return gates;
}
function gatesPass(l){ return computeGates(l).every(g=>g.pass); }

function copyBtn(id, text){
  return `<button class="copy-btn" data-copy="${id}">Copy</button>`;
}
function wireCopyButtons(root, getters){
  root.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.copy;
      const text = getters[key]();
      try{ await navigator.clipboard.writeText(text); }
      catch(e){ /* clipboard may be blocked in sandbox; still flash for visibility */ }
      btn.textContent = 'Copied'; btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('copied'); }, 1200);
    });
  });
}
